<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Widget Library, SME South Africa</title>
  <meta name="description" content="The reusable widgets used across the SME South Africa mockups, with live previews and the exact markup to copy." />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{jakarta:['Plus Jakarta Sans','sans-serif'],inter:['Inter','system-ui','sans-serif']}}}};</script>
  <style>
    html,body{font-family:'Inter',system-ui,sans-serif;} .font-jakarta{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:.005em;}
    .hero-bg{background:linear-gradient(115deg,#0C1F31 0%,#0C1F31 50%,#2b1626 80%,#5e1a2c 115%);}
    .dot-pattern{background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px);background-size:22px 22px;}
    .dev-badge{display:none;} body.dev-on .dev-badge{display:inline-flex;} #devToggle.on{background:#DC183C;color:#fff;border-color:#DC183C;}
    .stage{background:repeating-conic-gradient(#F4F7FA 0% 25%,#FAFBFD 0% 50%) 0 0/20px 20px;}
    pre.code{max-height:360px;overflow:auto;background:#0C1F31;color:#d6e2ee;font-size:12px;line-height:1.55;border-radius:12px;padding:16px;white-space:pre;tab-size:2;}
    .ov{position:fixed;inset:0;z-index:60;} .ov-bg{position:absolute;inset:0;background:rgba(12,31,49,.45);} .drawer{position:absolute;right:0;top:0;height:100%;width:100%;max-width:440px;background:#fff;box-shadow:-12px 0 40px rgba(12,31,49,.25);overflow-y:auto;}
    .faq-row summary{list-style:none;cursor:pointer;padding:1.1rem 0;border-top:1px solid #E7EBEF;display:flex;align-items:center;gap:1rem;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;color:#0C1F31;}
    .faq-row summary::-webkit-details-marker{display:none;} .faq-row .chev{margin-left:auto;transition:transform .2s;} .faq-row[open] .chev{transform:rotate(180deg);} .faq-row p{padding:0 0 1rem;color:#42505E;line-height:1.7;font-size:.95rem;}
  </style>
</head>
<body class="bg-[#FCFCFC] text-[#121A21] antialiased">
<header class="bg-white border-b border-[#E7EBEF] sticky top-0 z-40"><div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center gap-4">

  <span class="hidden sm:inline-block px-2.5 py-1 rounded-full bg-[#FDECEF] text-[#DC183C] text-[11px] font-bold uppercase tracking-wider ml-2">Dev resource</span>

    <a href="index.html" class="inline-flex items-center gap-1.5 px-3.5 h-9 rounded-full text-sm font-bold text-[#121A21] hover:bg-slate-100 transition"><i data-lucide="arrow-left" class="w-4 h-4"></i> Hub</a>
  </div>
</div></header>

<section class="hero-bg text-white relative overflow-hidden"><div class="absolute inset-0 dot-pattern opacity-70 pointer-events-none"></div>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-12 relative">
    <nav aria-label="Breadcrumb" class="text-xs text-white/55 flex items-center flex-wrap gap-x-1.5 mb-4"><a href="public-home.html" class="hover:text-white transition">Home</a><span class="text-white/30">›</span><span class="text-white/85 font-medium">Widget Library</span></nav>
    <h1 class="font-jakarta font-extrabold text-3xl sm:text-5xl tracking-tight">Widget <span class="bg-gradient-to-r from-[#DC183C] to-[#FF9900] bg-clip-text text-transparent">Library</span> <button onclick="openBrief()" class="dev-badge align-middle ml-1 w-6 h-6 rounded-full bg-[#FF9900] text-[#0C1F31] items-center justify-center text-[11px] font-bold" title="Implementation notes">i</button></h1>
    <p class="mt-4 text-white/70 max-w-2xl text-lg">The reusable pieces used across the mockups, <span id="count">11</span> in all. Each one is shown live with the exact markup to copy, where it is used and what it needs.</p>
  </div>
</section>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-10">
  <div class="flex items-center gap-2 overflow-x-auto mb-8"><a href="#g-home" class="shrink-0 px-3.5 h-9 inline-flex items-center rounded-full border border-[#E7EBEF] bg-white text-sm font-semibold text-slate-600 hover:border-[#DC183C] hover:text-[#DC183C] transition">Home</a><a href="#g-subscribe" class="shrink-0 px-3.5 h-9 inline-flex items-center rounded-full border border-[#E7EBEF] bg-white text-sm font-semibold text-slate-600 hover:border-[#DC183C] hover:text-[#DC183C] transition">Subscribe</a><a href="#g-article" class="shrink-0 px-3.5 h-9 inline-flex items-center rounded-full border border-[#E7EBEF] bg-white text-sm font-semibold text-slate-600 hover:border-[#DC183C] hover:text-[#DC183C] transition">Article</a><a href="#g-calls-to-action" class="shrink-0 px-3.5 h-9 inline-flex items-center rounded-full border border-[#E7EBEF] bg-white text-sm font-semibold text-slate-600 hover:border-[#DC183C] hover:text-[#DC183C] transition">Calls to action</a><a href="#g-events" class="shrink-0 px-3.5 h-9 inline-flex items-center rounded-full border border-[#E7EBEF] bg-white text-sm font-semibold text-slate-600 hover:border-[#DC183C] hover:text-[#DC183C] transition">Events</a></div>
  <div id="list" class="space-y-12"></div>
</main>

<div id="overlay-root"></div><div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50"></div>

<script>
  const WIDGETS = [{"id": "newsletter-card-dark", "title": "Newsletter card (dark)", "group": "Subscribe", "desc": "Dark sidebar card that invites a reader to the newsletter. The button opens the subscribe pop-up (next widget). Used at the foot of the sidebar on content pages.", "used": [["public-podcast-episode.html", "Podcast episode"]], "needs": "Tailwind, Lucide (mail, arrow-right), the Subscribe pop-up.", "code": "<div class=\"bg-[#0C1F31] text-white rounded-2xl p-6\">\n  <div class=\"w-11 h-11 rounded-xl bg-white/10 grid place-items-center text-[#FF9900]\"><i data-lucide=\"mail\" class=\"w-5 h-5\"><\/i><\/div>\n  <h3 class=\"font-jakarta font-extrabold text-lg mt-4\">Never miss an episode<\/h3>\n  <p class=\"text-sm text-white/65 mt-1.5 leading-relaxed\">New conversations land every week. Get each one in your inbox with the SME newsletter.<\/p>\n  <button type=\"button\" onclick=\"openSubscribe()\" class=\"mt-4 inline-flex items-center gap-2 px-5 h-11 rounded-full bg-[#DC183C] hover:bg-[#B0142F] text-white text-sm font-bold transition\">Join the newsletter <i data-lucide=\"arrow-right\" class=\"w-4 h-4\"><\/i><\/button>\n<\/div>", "preview": "<div class=\"bg-[#0C1F31] text-white rounded-2xl p-6\">\n  <div class=\"w-11 h-11 rounded-xl bg-white/10 grid place-items-center text-[#FF9900]\"><i data-lucide=\"mail\" class=\"w-5 h-5\"><\/i><\/div>\n  <h3 class=\"font-jakarta font-extrabold text-lg mt-4\">Never miss an episode<\/h3>\n  <p class=\"text-sm text-white/65 mt-1.5 leading-relaxed\">New conversations land every week. Get each one in your inbox with the SME newsletter.<\/p>\n  <button type=\"button\" onclick=\"openSubscribe()\" class=\"mt-4 inline-flex items-center gap-2 px-5 h-11 rounded-full bg-[#DC183C] hover:bg-[#B0142F] text-white text-sm font-bold transition\">Join the newsletter <i data-lucide=\"arrow-right\" class=\"w-4 h-4\"><\/i><\/button>\n<\/div>", "demo": ""}, {"id": "subscribe-popup", "title": "Subscribe pop-up", "group": "Subscribe", "desc": "One-field email pop-up (Esc, backdrop click or the close button dismisses it; validates the address; confirms with a toast). In production this is the on-page FluentForm \"Newsletter: Subscribe to Read\" in a dialog, which feeds Kit. The code below is the pop-up markup plus its three functions.", "used": [["public-podcast-episode.html", "Podcast episode"]], "needs": "Tailwind, Lucide (mail, x, arrow-right), a showToast() helper.", "code": "<div id=\"subscribeModal\" class=\"hidden fixed inset-0 z-50 flex items-center justify-center p-4\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"subscribeTitle\">\n  <div class=\"absolute inset-0 bg-[#0C1F31]/60 backdrop-blur-sm\" onclick=\"closeSubscribe()\"><\/div>\n  <div class=\"relative bg-white rounded-3xl w-full max-w-md shadow-2xl p-6 sm:p-8 z-10 transform scale-95 opacity-0 transition-all duration-200\" id=\"subscribeModalContent\">\n    <div class=\"flex items-start justify-between mb-5\">\n      <div class=\"flex items-start gap-3\">\n        <div class=\"w-11 h-11 rounded-xl bg-[#FDECEF] text-[#DC183C] grid place-items-center shrink-0\"><i data-lucide=\"mail\" class=\"w-5 h-5\"><\/i><\/div>\n        <div><h3 id=\"subscribeTitle\" class=\"font-jakarta font-extrabold text-xl text-[#0C1F31]\">Never miss an episode<\/h3><p class=\"text-sm text-[#6A7581] mt-1\">Get every new conversation in your inbox with the SME newsletter.<\/p><\/div>\n      <\/div>\n      <button type=\"button\" onclick=\"closeSubscribe()\" class=\"w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 hover:text-slate-800 transition shrink-0\" aria-label=\"Close\"><i data-lucide=\"x\" class=\"w-4 h-4\"><\/i><\/button>\n    <\/div>\n    <form onsubmit=\"submitSubscribe(event)\" class=\"space-y-4\" novalidate>\n      <div><label for=\"subEmail\" class=\"block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5\">Email address<\/label><input id=\"subEmail\" type=\"email\" required autocomplete=\"email\" class=\"w-full bg-white border border-[#E7EBEF] rounded-xl h-11 px-3.5 text-sm outline-none focus:border-[#DC183C] focus:ring-2 focus:ring-[#DC183C]/10 transition\" placeholder=\"you@business.co.za\" /><\/div>\n      <p id=\"subError\" class=\"hidden text-xs font-semibold text-[#B3122F]\">Please enter a valid email address.<\/p>\n      <button type=\"submit\" class=\"w-full h-12 rounded-full bg-[#DC183C] hover:bg-[#B0142F] text-white font-bold text-sm transition flex items-center justify-center gap-2 shadow-md\">Subscribe <i data-lucide=\"arrow-right\" class=\"w-4 h-4\"><\/i><\/button>\n      <p class=\"text-center text-[10px] font-bold uppercase tracking-wider text-[#6A7581]\">No spam. Unsubscribe anytime.<\/p>\n    <\/form>\n  <\/div>\n<\/div>\n\n<script>\n  function openSubscribe(){const m=document.getElementById('subscribeModal');m.classList.remove('hidden');requestAnimationFrame(()=>{const c=document.getElementById('subscribeModalContent');c.classList.remove('scale-95','opacity-0');});document.getElementById('subError').classList.add('hidden');setTimeout(()=>document.getElementById('subEmail').focus(),120);lucide.createIcons();}\n  function closeSubscribe(){const m=document.getElementById('subscribeModal');const c=document.getElementById('subscribeModalContent');c.classList.add('scale-95','opacity-0');setTimeout(()=>m.classList.add('hidden'),200);}\n  function submitSubscribe(e){e.preventDefault();const i=document.getElementById('subEmail');const ok=/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(i.value.trim());document.getElementById('subError').classList.toggle('hidden',ok);if(!ok){i.focus();return;}i.value='';closeSubscribe();showToast('You are subscribed. See you in your inbox.');}\n  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('subscribeModal').classList.contains('hidden'))closeSubscribe();});\n<\/script>", "preview": "<div id=\"subscribeModal\" class=\"hidden fixed inset-0 z-50 flex items-center justify-center p-4\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"subscribeTitle\">\n  <div class=\"absolute inset-0 bg-[#0C1F31]/60 backdrop-blur-sm\" onclick=\"closeSubscribe()\"><\/div>\n  <div class=\"relative bg-white rounded-3xl w-full max-w-md shadow-2xl p-6 sm:p-8 z-10 transform scale-95 opacity-0 transition-all duration-200\" id=\"subscribeModalContent\">\n    <div class=\"flex items-start justify-between mb-5\">\n      <div class=\"flex items-start gap-3\">\n        <div class=\"w-11 h-11 rounded-xl bg-[#FDECEF] text-[#DC183C] grid place-items-center shrink-0\"><i data-lucide=\"mail\" class=\"w-5 h-5\"><\/i><\/div>\n        <div><h3 id=\"subscribeTitle\" class=\"font-jakarta font-extrabold text-xl text-[#0C1F31]\">Never miss an episode<\/h3><p class=\"text-sm text-[#6A7581] mt-1\">Get every new conversation in your inbox with the SME newsletter.<\/p><\/div>\n      <\/div>\n      <button type=\"button\" onclick=\"closeSubscribe()\" class=\"w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 hover:text-slate-800 transition shrink-0\" aria-label=\"Close\"><i data-lucide=\"x\" class=\"w-4 h-4\"><\/i><\/button>\n    <\/div>\n    <form onsubmit=\"submitSubscribe(event)\" class=\"space-y-4\" novalidate>\n      <div><label for=\"subEmail\" class=\"block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5\">Email address<\/label><input id=\"subEmail\" type=\"email\" required autocomplete=\"email\" class=\"w-full bg-white border border-[#E7EBEF] rounded-xl h-11 px-3.5 text-sm outline-none focus:border-[#DC183C] focus:ring-2 focus:ring-[#DC183C]/10 transition\" placeholder=\"you@business.co.za\" /><\/div>\n      <p id=\"subError\" class=\"hidden text-xs font-semibold text-[#B3122F]\">Please enter a valid email address.<\/p>\n      <button type=\"submit\" class=\"w-full h-12 rounded-full bg-[#DC183C] hover:bg-[#B0142F] text-white font-bold text-sm transition flex items-center justify-center gap-2 shadow-md\">Subscribe <i data-lucide=\"arrow-right\" class=\"w-4 h-4\"><\/i><\/button>\n      <p class=\"text-center text-[10px] font-bold uppercase tracking-wider text-[#6A7581]\">No spam. Unsubscribe anytime.<\/p>\n    <\/form>\n  <\/div>\n<\/div>", "demo": "open-subscribe"}, {"id": "subscribe-card-pink", "title": "Subscribe card (pink)", "group": "Subscribe", "desc": "Pink email-capture card under the article table of contents (\"Get the SME Brief\").", "used": [["public-article.html", "Article"]], "needs": "Tailwind, Lucide (mail).", "code": "<div class=\"rounded-2xl border border-[#E7EBEF] bg-[#FDECEF] p-6\">\n  <div class=\"w-11 h-11 rounded-xl bg-white grid place-items-center mb-3 shadow-sm\"><i data-lucide=\"mail\" class=\"w-5 h-5 text-[#DC183C]\"><\/i><\/div>\n  <h3 class=\"font-jakarta font-extrabold text-lg text-[#0C1F31]\">Get the SME Brief<\/h3>\n  <p class=\"text-sm text-[#6A7581] mt-1.5 leading-relaxed\">Weekly insights for South African founders, straight to your inbox.<\/p>\n  <form onsubmit=\"subscribeBrief(event)\" class=\"mt-4 space-y-2.5\">\n    <input type=\"email\" required placeholder=\"you@business.co.za\" class=\"w-full bg-white border border-[#E7EBEF] rounded-full h-11 px-4 text-sm outline-none focus:border-[#DC183C] focus:ring-2 focus:ring-[#DC183C]/15 transition\" />\n    <button type=\"submit\" class=\"inline-flex w-full items-center justify-center gap-2 h-11 rounded-full bg-[#DC183C] hover:bg-[#B0142F] text-white font-bold text-sm transition\">Subscribe <i data-lucide=\"arrow-right\" class=\"w-4 h-4\"><\/i><\/button>\n  <\/form>\n<\/div>", "preview": "<div class=\"rounded-2xl border border-[#E7EBEF] bg-[#FDECEF] p-6\">\n  <div class=\"w-11 h-11 rounded-xl bg-white grid place-items-center mb-3 shadow-sm\"><i data-lucide=\"mail\" class=\"w-5 h-5 text-[#DC183C]\"><\/i><\/div>\n  <h3 class=\"font-jakarta font-extrabold text-lg text-[#0C1F31]\">Get the SME Brief<\/h3>\n  <p class=\"text-sm text-[#6A7581] mt-1.5 leading-relaxed\">Weekly insights f ht:700;color:#0C1F31;}\n.faq-row summary::-webkit-details-marker{display:none;}\n.faq-row .chev{margin-left:auto;transition:transform .2s;}\n.faq-row[open] .chev{transform:rotate(180deg);}\n.faq-row p{padding:0 0 1rem;color:#42505E;line-height:1.7;font-size:.95rem;}<\/style><div class=\"bg-white rounded-2xl border border-[#E7EBEF] px-6 shadow-sm\">\n  <details class=\"faq-row\"><summary>What's the dress code?<i data-lucide=\"chevron-down\" class=\"chev w-5 h-5 text-[#DC183C]\"><\/i><\/summary><p>Smart cocktail. No suits required. Represent your brand.<\/p><\/details>\n  <details class=\"faq-row\"><summary>Can I bring a plus-one?<i data-lucide=\"chevron-down\" class=\"chev w-5 h-5 text-[#DC183C]\"><\/i><\/summary><p>Every ticket is single-seat. Buy a second ticket if you'd like a partner or team-mate along, introductions are matched per-attendee.<\/p><\/details>\n  <details class=\"faq-row\"><summary>How do investor intros work?<i data-lucide=\"chevron-down\" class=\"chev w-5 h-5 text-[#DC183C]\"><\/i><\/summary><p>You'll fill a short \"who you'd like to meet\" form 5 days before. We match, then push confirmed introductions to the event app on the night.<\/p><\/details>\n  <details class=\"faq-row\"><summary>What is the refund policy?<i data-lucide=\"chevron-down\" class=\"chev w-5 h-5 text-[#DC183C]\"><\/i><\/summary><p>Full refund up to 7 days before the event, 50% up to 48 hours before, none thereafter. Tickets are fully transferable to another attendee at no charge.<\/p><\/details>\n<\/div>", "demo": ""}];
  const HAS_COMMUNITY = true;
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function showToast(m){const el=document.getElementById('toast');el.classList.remove('hidden');el.innerHTML=`<div class="bg-[#0C1F31] text-white rounded-full pl-3 pr-5 py-2.5 shadow-2xl flex items-center gap-2 text-sm font-semibold" style="border-left:4px solid #DC183C"><i data-lucide="check-circle" class="w-4 h-4" style="color:#DC183C"></i><span>${esc(m)}</span></div>`;lucide.createIcons();setTimeout(()=>{el.classList.add('hidden');el.innerHTML='';},2400);}
  function slug(s){return s.toLowerCase().replace(/\W+/g,'-');}

  function copyText(t,msg){
    const done=()=>showToast(msg||'Copied');
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,()=>fallback());}else fallback();
    function fallback(){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done();}catch(e){showToast('Select the code and copy it');}a.remove();}
  }
  function copyWidget(id){const w=WIDGETS.find(x=>x.id===id);copyText(w.code,'HTML copied');}
  function toggleCode(id){const el=document.getElementById('code-'+id);el.classList.toggle('hidden');const b=document.getElementById('cb-'+id);b.querySelector('span').textContent=el.classList.contains('hidden')?'View code':'Hide code';}

  const used=(u)=>u.map(x=>`<a href="${esc(x[0])}" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-slate-100 hover:bg-[#FDECEF] hover:text-[#DC183C] text-[11px] font-bold text-slate-600 transition">${esc(x[1])} <i data-lucide="arrow-up-right" class="w-3 h-3"></i></a>`).join(' ');

  function card(w){
    const demo=w.demo==='open-subscribe'?`<button onclick="openSubscribe()" class="mt-1 inline-flex items-center gap-2 px-5 h-11 rounded-full bg-[#DC183C] hover:bg-[#B0142F] text-white text-sm font-bold transition"><i data-lucide="eye" class="w-4 h-4"></i> Open the pop-up</button>`:'';
    return `<section id="${w.id}" class="scroll-mt-24">
      <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
        <div class="min-w-0"><h3 class="font-jakarta font-extrabold text-xl sm:text-2xl text-[#0C1F31]">${esc(w.title)}</h3>
          <p class="text-sm text-[#6A7581] mt-1.5 max-w-3xl leading-relaxed">${esc(w.desc)}</p></div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="cb-${w.id}" onclick="toggleCode('${w.id}')" class="inline-flex items-center gap-1.5 px-3.5 h-10 rounded-full border border-[#E7EBEF] bg-white text-sm font-bold text-slate-700 hover:border-[#DC183C] hover:text-[#DC183C] transition"><i data-lucide="code-2" class="w-4 h-4"></i><span>View code</span></button>
          <button onclick="copyWidget('${w.id}')" class="inline-flex items-center gap-1.5 px-4 h-10 rounded-full bg-[#0C1F31] hover:bg-[#16324A] text-white text-sm font-bold transition"><i data-lucide="copy" class="w-4 h-4"></i> Copy HTML</button>
        </div>
      </div>
      <div class="stage rounded-2xl border border-[#E7EBEF] p-5 sm:p-8"><div class="max-w-[420px] ${w.id.indexOf('cta-band')===0||w.id==='faq-accordion'?'max-w-none':''}">${w.preview}</div>${demo}</div>
      <div class="mt-3 flex flex-wrap items-center gap-x-4 gap-y-2 text-xs text-[#6A7581]"><span class="font-bold uppercase tracking-wider text-[10px] text-[#DC183C]">Used on</span> ${used(w.used)} <span class="ml-auto"><b class="text-slate-600">Needs:</b> ${esc(w.needs)}</span></div>
      <pre id="code-${w.id}" class="code hidden mt-3"></pre>
    </section>`;
  }
  function communityCard(){
    return `<section id="sme-community" class="scroll-mt-24">
      <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
        <div class="min-w-0"><h3 class="font-jakarta font-extrabold text-xl sm:text-2xl text-[#0C1F31]">Community card (home hero)</h3>
          <p class="text-sm text-[#6A7581] mt-1.5 max-w-3xl leading-relaxed">The right-hand card in the homepage hero: Feed, Groups and Events tabs, a floating chip and a notification card. Delivered as ONE paste-ready block for an Elementor HTML widget. It needs no Tailwind or theme and is namespaced so it cannot clash with the page.</p></div>
        <div class="flex items-center gap-2 shrink-0">
          <a href="widgets/sme-community-widget.html" download class="inline-flex items-center gap-1.5 px-3.5 h-10 rounded-full border border-[#E7EBEF] bg-white text-sm font-bold text-slate-700 hover:border-[#DC183C] hover:text-[#DC183C] transition"><i data-lucide="download" class="w-4 h-4"></i> Download file</a>
          <button onclick="copyCommunity()" class="inline-flex items-center gap-1.5 px-4 h-10 rounded-full bg-[#0C1F31] hover:bg-[#16324A] text-white text-sm font-bold transition"><i data-lucide="copy" class="w-4 h-4"></i> Copy HTML</button>
        </div>
      </div>
      <div class="rounded-2xl border border-[#E7EBEF] overflow-hidden bg-[#0C1F31]"><iframe src="widgets/sme-community-widget-preview.html" title="Community card preview" class="w-full h-[640px] border-0"></iframe></div>
      <div class="mt-3 flex flex-wrap items-center gap-x-4 gap-y-2 text-xs text-[#6A7581]"><span class="font-bold uppercase tracking-wider text-[10px] text-[#DC183C]">Used on</span> ${used([['public-home.html','Home']])} <span class="ml-auto"><b class="text-slate-600">Needs:</b> nothing (self-contained). Copy works when this page is served over http(s); on a local file use Download.</span></div>
    </section>`;
  }
  function copyCommunity(){fetch('widgets/sme-community-widget.html').then(r=>r.text()).then(t=>copyText(t,'HTML copied')).catch(()=>showToast('Use Download file (opened from a local file)'));}

  (function render(){
    const list=document.getElementById('list');let html='';const groups=[];WIDGETS.forEach(w=>{if(!groups.includes(w.group))groups.push(w.group);});
    if(HAS_COMMUNITY)html+=`<div id="g-home"><p class="text-[11px] font-bold uppercase tracking-widest text-[#DC183C] mb-4">Home</p>${communityCard()}</div>`;
    groups.forEach(g=>{html+=`<div id="g-${slug(g)}"><p class="text-[11px] font-bold uppercase tracking-widest text-[#DC183C] mb-4">${esc(g)}</p><div class="space-y-12">${WIDGETS.filter(w=>w.group===g).map(card).join('')}</div></div>`;});
    list.innerHTML=html;
    WIDGETS.forEach(w=>{const pre=document.getElementById('code-'+w.id);if(pre)pre.textContent=w.code;});
    // the pop-up used by the dark newsletter card: mount one copy so its button works here too
    const sub=WIDGETS.find(w=>w.id==='subscribe-popup');
    if(sub){const tmp=document.createElement('div');tmp.innerHTML=sub.code.split('<scr'+'ipt>')[0];document.getElementById('subscribeHost').appendChild(tmp.firstElementChild);
      const s=document.createElement('script');s.textContent=sub.code.split('<scr'+'ipt>')[1].split('</scr'+'ipt>')[0];document.body.appendChild(s);}
    lucide.createIcons();
  })();

  const BRIEF={title:'Widget Library',sub:'Reusable widgets · extracted from the mockups',
    purpose:'Single place to pick up a widget that is used on more than one page (or that the developer needs on its own), instead of asking for it one by one. It is the sister of the Icon Library.',
    data:'Nothing is typed in by hand: <code>Theme/tools/build_widget_library.py</code> extracts each widget’s markup straight from the mockup page that uses it, so the library cannot drift from the pages. The home hero community card is a standalone, paste-ready file (<code>widgets/sme-community-widget.html</code>).',
    logic:'Each widget shows a live preview, a <b>Copy HTML</b> button (the exact markup, plus any CSS or script it needs), a code view, the pages that use it and what it depends on. To add a widget, add a line to WIDGETS in the build script and run it. Re-run it whenever a widget changes on its page.',
    components:'hero · group chips · widget cards (preview stage, copy, code, used-on, needs) · subscribe pop-up demo.',
    specs:'Stage: checker background (#F4F7FA / #FAFBFD) so white and dark widgets both read. Buttons: pill, 40px, navy for Copy, outlined for View code. Group labels: 11px uppercase #DC183C. Markup uses Tailwind utility classes and Lucide icons exactly as on the pages; the in-production equivalents are the theme partials.'};
  function toggleDevMode(){const on=document.body.classList.toggle('dev-on');const b=document.getElementById('devToggle');if(b)b.classList.toggle('on',on);if(on)showToast('Dev Mode on, tap the ⓘ for notes.');lucide.createIcons();}
  function openBrief(){const b=BRIEF;const sec=(i,l,h)=>`<div class="px-6 py-4 border-t border-slate-100"><p class="text-[10px] font-bold uppercase tracking-widest text-[#DC183C] flex items-center gap-1.5 mb-2"><i data-lucide="${i}" class="w-3.5 h-3.5"></i>${l}</p><div class="text-sm text-slate-600 leading-relaxed">${h}</div></div>`;document.getElementById('overlay-root').innerHTML=`<div class="ov" id="ov"><div class="ov-bg" onclick="document.getElementById('ov').remove()"></div><div class="drawer"><div class="sticky top-0 z-10 bg-[#0C1F31] text-white px-6 py-5 flex items-start justify-between"><div><p class="text-[10px] font-bold uppercase tracking-widest text-[#FF9900] mb-1">Dev Brief</p><h3 class="font-jakarta font-extrabold text-lg leading-tight">${b.title}</h3><p class="text-xs text-white/60 mt-1">${b.sub}</p></div><button onclick="document.getElementById('ov').remove()" class="text-white/60 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>${sec('target','Purpose',b.purpose)}${sec('database','Data model',b.data)}${sec('git-branch','Logic',b.logic)}${sec('boxes','Components',b.components)}${sec('ruler','Spec values',b.specs)}</div></div>`;lucide.createIcons();}
</script>
<script src="member-chrome.js"></script>
</body>
