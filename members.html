<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{jakarta:['Plus Jakarta Sans','sans-serif'],inter:['Inter','system-ui','sans-serif'],mono:['ui-monospace','monospace']},colors:{primary:'#DC183C',accent:'#FF9900',navy:'#0C1F31',success:'#29A37A',ink:'#121A21'}}}};</script>
  
  <style>
    html,body{font-family:'Inter',system-ui,sans-serif;} .font-jakarta{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:.005em;}
    .no-scrollbar::-webkit-scrollbar{display:none;} .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}} .reveal{animation:fadeUp .45s cubic-bezier(.2,.7,.2,1) backwards;}
    @keyframes toastIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}} @keyframes toastOut{to{opacity:0;transform:translateY(20px);}}
    .toast-in{animation:toastIn .25s ease forwards;} .toast-out{animation:toastOut .25s ease forwards;}
    .card-lift{transition:box-shadow .2s,transform .2s;} .card-lift:hover{box-shadow:0 8px 20px -8px rgba(10,44,61,.12);transform:translateY(-1px);}
    .cnav.active{color:#DC183C;border-color:#DC183C;}
    #overlay-root:empty{display:none;}
    .ov{position:fixed;inset:0;z-index:60;} .ov-bg{position:absolute;inset:0;background:rgba(12,31,49,.45);backdrop-filter:blur(2px);opacity:0;transition:opacity .3s;} .ov.open .ov-bg{opacity:1;}
    .drawer{position:absolute;right:0;top:0;height:100%;width:100%;max-width:440px;background:#fff;box-shadow:-12px 0 40px rgba(12,31,49,.25);overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.7,.2,1);} .ov.open .drawer{transform:translateX(0);}
    .dev-badge{display:none;} body.dev-on .dev-badge{display:inline-flex;} #devToggle.on{background:#DC183C;color:#fff;border-color:#DC183C;}
      /* HEADER-SEARCH-CSS */
    .search-overlay { position:absolute; inset:0; background:white; z-index:50; display:flex; align-items:center; justify-content:center; padding:0 1rem; opacity:0; pointer-events:none; transform:translateY(-10px); transition:all .3s cubic-bezier(.2,.8,.2,1); }
    .search-overlay.active { opacity:1; pointer-events:auto; transform:translateY(0); }
    @media (min-width:640px){ .search-overlay{ padding:0 1.5rem; } }
</style>

    </div>
  </div>

  <!-- Full Header Search Overlay -->

        <input type="text" id="headerSearchInput" placeholder="Search members, groups, forums..." class="w-full h-12 pl-12 pr-4 text-base bg-slate-50 border border-[#DC183C] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#DC183C]/20 transition-all shadow-sm">

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">

<div id="overlay-root"></div>
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50"></div>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function monogram(i,s=64){const fs=Math.max(10,Math.floor(s*0.38));return `<div class="mx-auto rounded-full bg-gradient-to-br from-[#DC183C] to-[#FF9900] grid place-items-center font-jakarta font-bold text-white shrink-0 shadow-sm" style="width:${s}px;height:${s}px;font-size:${fs}px">${esc(i)}</div>`;}

const MEMBERS = [
  { name:'Thandi Nkosi',    initials:'TN', role:'CEO',         company:'Khula Agri',   industry:'Agritech',  interest:'Operations',  province:'Limpopo',       contrib:31,  status:'none' },
  { name:'Amahle Jacobs',   initials:'AJ', role:'Founder',     company:'FinFlow',      industry:'Fintech',   interest:'Funding',     province:'Western Cape',  contrib:88,  status:'none' },
  { name:'Bongani Khumalo', initials:'BK', role:'Founder',     company:'BuildRight',   industry:'Construction',interest:'Networking',province:'Gauteng',       contrib:19,  status:'none' },
  { name:'Zinhle Mthembu',  initials:'ZM', role:'Founder',     company:'CraftBrew',    industry:'Retail',    interest:'Sales',       province:'KwaZulu-Natal', contrib:9,   status:'none' },
  { name:'Sello Monare',    initials:'SM', role:'MD',          company:'TechSolve RSA',industry:'Fintech',   interest:'Networking',  province:'Gauteng',       contrib:64,  status:'connected' },
  { name:'Karabo Kgophane', initials:'KK', role:'E-comm Lead', company:'Mzansi Cart',  industry:'Retail',    interest:'Marketing',   province:'Gauteng',       contrib:58,  status:'connected' },
  { name:'Mandla Dlamini',  initials:'MD', role:'Co-founder',  company:'PesaPay',      industry:'Fintech',   interest:'Funding',     province:'Western Cape',  contrib:21,  status:'none' },
  { name:'Refiloe Sithole', initials:'RS', role:'Founder',     company:'Skhokho',      industry:'SaaS',      interest:'Sales',       province:'Gauteng',       contrib:47,  status:'connected' },
  { name:'Sipho Ngubane',   initials:'SN', role:'Founder',     company:'TapWallet',    industry:'Fintech',   interest:'Tech',        province:'KwaZulu-Natal', contrib:12,  status:'none' },
  { name:'Lerato Phakathi', initials:'LP', role:'Founder',     company:'Inkundla AI',  industry:'AI',        interest:'Mentorship',  province:'Gauteng',       contrib:73,  status:'pending' },
  { name:'Thabo Maseko',    initials:'TM', role:'Founder',     company:'Kasi Eats',    industry:'Food',      interest:'Marketing',   province:'Gauteng',       contrib:54,  status:'none' },
  { name:'Kagiso Ndlovu',   initials:'KN', role:'Founder',     company:'Urban Eats',   industry:'Food',      interest:'Funding',     province:'Gauteng',       contrib:0,   status:'none' }
];

function uniq(arr){ return [...new Set(arr)]; }
function fillSelect(id, all, label){ const el=document.getElementById(id); el.innerHTML = `<option value="">All ${label}</option>` + uniq(MEMBERS.map(m=>m[all])).sort().map(v=>`<option>${esc(v)}</option>`).join(''); }

function resetFilters(){ ['f-search','f-industry','f-interest','f-region'].forEach(id=>document.getElementById(id).value=''); render(); }

function connectBtn(m,i){
  if(m.status==='connected') return `<button class="w-full bg-white border border-[#29A37A] text-[#29A37A] rounded-xl py-2.5 text-xs font-bold flex justify-center items-center gap-1.5 mt-4"><i data-lucide="check" class="w-3.5 h-3.5"></i> Connected</button>`;
  if(m.status==='pending')  return `<button class="w-full bg-white border border-slate-200 text-slate-500 rounded-xl py-2.5 text-xs font-bold flex justify-center items-center gap-1.5 mt-4"><i data-lucide="clock" class="w-3.5 h-3.5"></i> Pending</button>`;
  return `<button onclick="connect(${i})" class="w-full bg-[#DC183C] hover:bg-[#B0142F] text-white rounded-xl py-2.5 text-xs font-bold transition flex justify-center items-center gap-1.5 mt-4"><i data-lucide="user-plus" class="w-3.5 h-3.5"></i> Connect</button>`;
}

function connect(i){ MEMBERS[i].status='pending'; render(); showToast('Connection request sent to '+MEMBERS[i].name.split(' ')[0]+'.', null); }

function pill(t){ return `<span class="inline-flex items-center px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 text-[11px] font-semibold">${esc(t)}</span>`; }

function gridCard(m,gi){
  // Only shows contributions if greater than 0, with no active status text.
  const metaLine = m.contrib > 0 
    ? `<p class="text-[11px] text-slate-500 mt-4 flex items-center justify-center gap-1"><i data-lucide="hand-heart" class="w-3.5 h-3.5 text-[#29A37A]"></i> ${m.contrib} contributions</p>`
    : `<div class="h-8 mt-4"></div>`; // Spacer to maintain consistent card height if no contributions
    
  return `<div class="bg-white rounded-[20px] border border-slate-100 p-6 text-center card-lift flex flex-col h-full shadow-sm">
    <a href="single-member.html" class="inline-block mb-4">${monogram(m.initials, 72)}</a>
    
    <a href="single-member.html" class="font-jakarta font-bold text-[17px] text-[#121A21] hover:text-[#DC183C] transition leading-tight mb-1">${esc(m.name)}</a>
    <p class="text-xs text-slate-500 mb-4">${esc(m.role)} · ${esc(m.company)}</p>
    
    <!-- Pills Layout exactly as requested -->
    <div class="flex flex-col items-center gap-1.5 mb-2 mt-auto">
       <div class="flex items-center justify-center gap-1.5">
          ${pill(m.interest)}
          ${pill(m.industry)}
       </div>
       ${pill(m.province)}
    </div>
    
    ${metaLine}
    
    <!-- Full width connect button at bottom -->
    ${connectBtn(m,m._i)}
  </div>`;
}

function render(){
  const q = document.getElementById('f-search').value.toLowerCase();
  const ind = document.getElementById('f-industry').value;
  const int = document.getElementById('f-interest').value;
  const reg = document.getElementById('f-region').value;
  const sort = document.getElementById('f-sort').value;
  let list = MEMBERS.map((m,i)=>({ ...m, _i:i }));
  list = list.filter(m => (!q || (m.name+' '+m.company+' '+m.role).toLowerCase().includes(q)) && (!ind||m.industry===ind) && (!int||m.interest===int) && (!reg||m.province===reg));
  if(sort==='contrib') list.sort((a,b)=>b.contrib-a.contrib);
  else if(sort==='az') list.sort((a,b)=>a.name.localeCompare(b.name));
  
  const host = document.getElementById('results');
  if(!list.length){ host.innerHTML = `<div class="bg-white rounded-2xl border border-slate-100 py-16 text-center text-slate-400"><i data-lucide="user-x" class="w-8 h-8 mx-auto mb-2"></i><p class="font-semibold">No members match those filters.</p><button onclick="resetFilters()" class="text-xs font-bold text-[#DC183C] uppercase mt-2 hover:underline">Reset filters</button></div>`; }
  else { host.innerHTML = `<div class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">${list.map(gridCard).join('')}</div>`; }
  lucide.createIcons();
}

const BRIEFS = {
    footer:{ title:'Community Footer', sub:'Shared app-shell component', purpose:'The closing utility bar for every logged-in community screen (Feed, Members, Groups, Forums, Profile, Account). Deliberately minimal &mdash; a single thin row, not a marketing footer &mdash; so it closes the app experience the same way the BuddyBoss header opens it, bookending all 9 community templates consistently.', data:'Static link list: <code>{ label, href }[]</code> &mdash; About, Help Center, Terms, Privacy. No dynamic data.', logic:'Rendered identically on every community template (member-hub, members, single-member, single-post, groups, single-group, forums, single-discussion, member-account). All four links resolve to existing public pages.', components:'Copyright + Community tag (left) &middot; utility link row (right).', specs:'<b>Container:</b> <code>bg-white border-t border-slate-200</code> &mdash; light, matches the header, NOT the navy marketing surface used for hero bands elsewhere on the site. <code>max-w-7xl</code>, 20px vertical padding (<code>py-5</code>), stacks to a column below <code>sm</code>.<br/><b>Left group:</b> 12px (<code>text-xs</code>) slate-500, <code>&middot;</code> separator slate-300, "Community" tag 10px weight 800 uppercase tracking-widest slate-400 &mdash; a quiet reminder you\'re inside the app, not the marketing site.<br/><b>Right nav:</b> 12px weight 600 slate-500, 20px gap, hover <code>#DC183C</code>.<br/><br/><b>Why this differs from the (not-yet-built) public-site footer:</b> Articles/Resources/marketing pages are editorial and SEO-facing &mdash; that footer should be the tall, dark <code>navy</code> sitemap block with category columns, socials and a newsletter CTA, matching the hero-band treatment used across the public site. This community footer is the opposite on purpose: thin, light, utility-only &mdash; a logged-in member is inside a tool, not reading an article, so the chrome should get out of the way rather than sell anything.' },
     directory:{ title:'Members Directory', sub:'Browse & filter all members', purpose:'The discovery surface for the whole community. Search + facet filters (industry, interest, region) and sort. Drives connection density — the metric that makes a community sticky. Cards deep-link to the member profile and offer one-tap Connect.', data:'<code>members[] { id, name, role, company, industry, interest, province, contribution_total, connection_status }</code>.', logic:'Server-side faceted search with pagination. &ldquo;Top contributors&rdquo; sort surfaces generous members (reputation = generosity). Connect creates a pending request, optimistic UI. Honours each member&rsquo;s &ldquo;show in directory&rdquo; privacy setting.', components:'Filter sidebar · sort · member cards · connect.', specs:'<b>Page shell:</b> container <code>max-w-7xl</code> = 1280px, padding-x 16px/24px (<code>px-4 sm:px-6</code>), padding-y 24px (<code>py-6</code>). 12-col grid, 24px gap (<code>gap-6</code>) — filter sidebar <code>col-span-3</code> &asymp;258px, results <code>col-span-9</code> &asymp;822px; stacks below <code>lg</code> (1024px).<br/><b>Page title:</b> H1 Plus Jakarta Sans weight 800 24px (<code>text-2xl</code>) <code>#121A21</code>.<br/><b>Sort select:</b> 12px weight 600, 1px border slate-200 (<code>#E2E8F0</code>), radius 8px (<code>rounded-lg</code>), padding 12px&times;8px.<br/><b>Filter sidebar:</b> sticky top 112px (<code>top-28</code>), 16px stack.<br/><b>Search field:</b> bg white, 1px border slate-200, radius 12px (<code>rounded-xl</code>), padding-left 36px py 10px, Lucide `search` 16&times;16 slate-400, focus border <code>#DC183C</code>.<br/><b>Filter card:</b> bg white, radius 16px (<code>rounded-2xl</code>), 1px border slate-100 (<code>#F0F5F9</code>), padding 16px.<br/><b>Filter labels:</b> 11px weight 700 uppercase tracking-wider slate-500.<br/><b>Selects:</b> bg slate-50 (<code>#F8FAFC</code>), 1px border slate-200, radius 8px, padding 12px&times;8px, 14px.<br/><br/><b>Grid cards:</b> responsive 4-column <code>sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4</code>, 16px gap (<code>gap-4</code>); card bg white radius 16px 1px border slate-100 padding 20px (<code>p-5</code>) centred, hover lift shadow <code>0 8px 20px -8px rgba(10,44,61,.12)</code>.<br/><b>Card avatar:</b> 64&times;64 rounded-full gradient <code>#DC183C&rarr;#FF9900</code>.<br/><b>Card name:</b> Plus Jakarta Sans weight 700 <code>#121A21</code> hover <code>#DC183C</code>.<br/><b>Role line:</b> 12px slate-500; pills 11px weight 600 bg slate-100 slate-600 (<code>#6A7581</code>), padding 8px&times;2px rounded-full.<br/><b>Contribution meta:</b> Hidden if 0 contributions. 11px slate-400 (<code>#94A3B8</code>), Lucide `hand-heart` 14&times;14 <code>#29A37A</code>.<br/><b>Connect button:</b> bg <code>#DC183C</code> hover <code>#B0142F</code>, rounded-full, padding 16px&times;6px (<code>px-4 py-1.5</code>), 12px white weight 700, `user-plus` 14&times;14; Connected = <code>#29A37A</code> outline + `check`; Pending = slate-200 outline + `clock`.' } };
function toggleDevMode(){const on=document.body.classList.toggle('dev-on');const b=document.getElementById('devToggle');if(b)b.classList.toggle('on',on);if(on)showToast('Dev Mode on — tap any ⓘ for implementation notes.',null);lucide.createIcons();}
function closeOverlay(id){const el=document.getElementById(id);if(!el)return;el.classList.remove('open');setTimeout(()=>{if(el&&el.parentNode)el.remove();},300);}
function openBrief(id){const b=BRIEFS[id];if(!b)return;const sec=(icon,label,html)=>`<div class="px-6 py-4 border-t border-slate-100"><p class="text-[10px] font-bold uppercase tracking-widest text-[#DC183C] flex items-center gap-1.5 mb-2"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${label}</p><div class="text-sm text-slate-600 leading-relaxed">${html}</div></div>`;document.getElementById('overlay-root').innerHTML=`<div class="ov" id="ov-brief"><div class="ov-bg" onclick="closeOverlay('ov-brief')"></div><div class="drawer"><div class="sticky top-0 z-10 bg-[#0C1F31] text-white px-6 py-5 flex items-start justify-between"><div class="min-w-0"><p class="text-[10px] font-bold uppercase tracking-widest text-[#FF9900] mb-1">Dev Brief</p><h3 class="font-jakarta font-extrabold text-lg leading-tight">${b.title}</h3><p class="text-xs text-white/60 mt-1">${b.sub}</p></div><button onclick="closeOverlay('ov-brief')" class="text-white/60 hover:text-white shrink-0 ml-3"><i data-lucide="x" class="w-5 h-5"></i></button></div>${sec('target','Purpose',b.purpose)}${sec('database','Data model',b.data)}${sec('git-branch','Logic',b.logic)}${b.specs?sec('ruler','Spec values',b.specs):''}${sec('boxes','Components',b.components)}</div></div>`;requestAnimationFrame(()=>{const o=document.getElementById('ov-brief');if(o)o.classList.add('open');});lucide.createIcons();}
function showToast(msg,kind){const el=document.getElementById('toast');const color=kind==='ask'?'#DC183C':kind==='win'?'#29A37A':kind==='share'?'#FF9900':'#0C1F31';el.classList.remove('hidden');el.innerHTML=`<div class="toast-in bg-[#0C1F31] text-white rounded-full pl-3 pr-5 py-2.5 shadow-2xl flex items-center gap-2 text-sm font-semibold" style="border-left:4px solid ${color}"><i data-lucide="check-circle" class="w-4 h-4" style="color:${color}"></i><span>${esc(msg)}</span></div>`;lucide.createIcons();setTimeout(()=>{const i=el.firstElementChild;if(i){i.classList.remove('toast-in');i.classList.add('toast-out');}setTimeout(()=>{el.classList.add('hidden');el.innerHTML='';},250);},2400);}

document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.ov.open').forEach(o=>closeOverlay(o.id)); });
fillSelect('f-industry','industry','industries'); fillSelect('f-interest','interest','interests'); fillSelect('f-region','province','regions');
render();
lucide.createIcons();
  /* HEADER-SEARCH-JS */
  function toggleHeaderSearch(){
    var o=document.getElementById('headerSearchOverlay'); if(!o) return;
    var open=o.classList.toggle('active');
    var i=document.getElementById('headerSearchInput');
    if(open){ if(i) setTimeout(function(){ i.focus(); },100); } else if(i){ i.value=''; }
  }
  document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ var o=document.getElementById('headerSearchOverlay'); if(o&&o.classList.contains('active')) toggleHeaderSearch(); } });
</script>
