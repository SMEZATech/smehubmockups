  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            jakarta: ['Plus Jakarta Sans', 'sans-serif'],
            inter: ['Inter', 'system-ui', 'sans-serif'],
            mono: [ 'ui-monospace', 'monospace']
          },
          colors: { primary:'#DC183C', accent:'#FF9900', navy:'#0C1F31', success:'#29A37A', ink:'#121A21' }
        }
      }
    };

  <style>
    :root{
      --primary:349 80% 48%; --accent:36 100% 50%; --navy:210 60% 12%; --success:160 60% 40%;
      --foreground:210 30% 10%; --muted-foreground:210 10% 45%; --border:210 20% 92%;
      --background:0 0% 99%; --card:0 0% 100%; --radius:0.75rem;
      --shadow-card:0 2px 8px rgba(12,31,49,.08); --shadow-card-hover:0 8px 24px rgba(12,31,49,.12);
    }
    html, body { font-family:'Inter', system-ui, sans-serif; }
    .font-jakarta { font-family:'Plus Jakarta Sans', sans-serif; letter-spacing:.005em; }

    .no-scrollbar::-webkit-scrollbar { display:none; }
    .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }

    /* Reveal */
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .reveal { animation: fadeUp .45s cubic-bezier(.2,.7,.2,1) backwards; }

    /* Toast */
    @keyframes toastIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes toastOut { to { opacity:0; transform:translateY(20px); } }
    .toast-in { animation: toastIn .25s ease forwards; }
    .toast-out { animation: toastOut .25s ease forwards; }

    /* Type stripes */
    .stripe-ask   { box-shadow: inset 4px 0 0 0 #DC183C; }
    .stripe-win   { box-shadow: inset 4px 0 0 0 #29A37A; }
    .stripe-share { box-shadow: inset 4px 0 0 0 #FF9900; }

    /* Card lift */
    .card-lift { transition: box-shadow .2s, transform .2s; }
    .card-lift:hover { box-shadow:0 8px 20px -8px rgba(10,44,61,.12); transform:translateY(-1px); }


    /* Settings sidebar item */
    .snav.active { background:#FDECEF; color:#DC183C; }
    .snav.active i { color:#DC183C; }

    /* Segmented control */
    .seg.active { background:#0C1F31; color:#fff; }

    /* Toggle switch */
    .switch { width:42px; height:24px; border-radius:9999px; background:#CBD5E1; position:relative; transition:background .2s; flex:none; cursor:pointer; }
    .switch::after { content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:9999px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s; }
    .switch.on { background:#29A37A; }
    .switch.on::after { transform:translateX(18px); }
    .switch.disabled { opacity:.45; cursor:not-allowed; }

    /* Chip select (radio cards) */
    .rcard { transition:border-color .15s, background-color .15s; cursor:pointer; }
    .rcard.sel { border-color:#DC183C; background:#FDECEF; }

    /* Overlays */
    #overlay-root:empty { display:none; }
    .ov { position:fixed; inset:0; z-index:60; }
    .ov-bg { position:absolute; inset:0; background:rgba(12,31,49,.45); backdrop-filter:blur(2px); opacity:0; transition:opacity .3s; }
    .ov.open .ov-bg { opacity:1; }
    .drawer { position:absolute; right:0; top:0; height:100%; width:100%; max-width:440px; background:#fff; box-shadow:-12px 0 40px rgba(12,31,49,.25); overflow-y:auto; transform:translateX(100%); transition:transform .3s cubic-bezier(.2,.7,.2,1); }
    .ov.open .drawer { transform:translateX(0); }

    /* Dev Mode */
    .dev-badge { display:none; }
    body.dev-on .dev-badge { display:inline-flex; }
    #devToggle.on { background:#DC183C; color:#fff; border-color:#DC183C; }

      /* HEADER-SEARCH-CSS */
    .search-overlay { position:absolute; inset:0; background:white; z-index:50; display:flex; align-items:center; justify-content:center; padding:0 1rem; opacity:0; pointer-events:none; transform:translateY(-10px); transition:all .3s cubic-bezier(.2,.8,.2,1); }
    .search-overlay.active { opacity:1; pointer-events:auto; transform:translateY(0); }
    @media (min-width:640px){ .search-overlay{ padding:0 1.5rem; } }
</style>

<script>
/* ===================== HELPERS ===================== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function monogram(initials, size=44){
  const fs = Math.max(10, Math.floor(size*0.38));
  return `<div class="rounded-full bg-gradient-to-br from-[#DC183C] to-[#FF9900] grid place-items-center font-jakarta font-bold text-white shrink-0" style="width:${size}px;height:${size}px;font-size:${fs}px">${esc(initials)}</div>`;
}
const TYPES = {
  ask:   { color:'#DC183C', bgTint:'bg-[#DC183C]/10', text:'text-[#DC183C]', label:'Ask',   icon:'help-circle', headerBg:'#FDECEF' },
  win:   { color:'#29A37A', bgTint:'bg-[#29A37A]/10', text:'text-[#29A37A]', label:'Win',   icon:'trophy',      headerBg:'#E4F5EE' },
  share: { color:'#FF9900', bgTint:'bg-[#FF9900]/15', text:'text-[#AE6B0A]', label:'Share', icon:'megaphone',   headerBg:'#FFF1E0' }
};

let BLOCKED = [
  { name:'Spam Account', initials:'SA', reason:'Repeated promotional DMs', date:'1 month ago' }
];

const PROFILE = {
  initials:'NM', firstName:'Naledi', lastName:'Mokoena', handle:'naledi', email:'naledi@greentrace.africa',
  interest:'Funding', province:'Western Cape', city:'Cape Town',
  bio:"Naledi founded GreenTrace in 2021 to help SA agri-exporters track sustainability compliance without the spreadsheet chaos.",
  jobTitle:'Founder', company:'GreenTrace', sector:'Cleantech', stage:'Growing',
  yearsInBusiness:'2 - 4 Years', companySize:'11 - 50 employees', turnover:'R10M+',
  challenge:'Other', bankAccount:'yes',
  tools:{ excel:false, accounting:false, hrPayroll:true, pos:false, none:false, other:false }
};
const INTERESTS = ['Networking','Funding','Mentorship','Marketing','Sales','Operations','Tech'];
const PROVINCES = ['Gauteng','Western Cape','KwaZulu-Natal','Eastern Cape','Free State','Limpopo','Mpumalanga','North West','Northern Cape'];
const SECTORS = ['Fintech','SaaS','Retail','Agritech','Cleantech','AI','Construction','Food','Other'];
const STAGES = ['Idea','Just Launched','Growing','Established'];
const YEARS_IN_BUSINESS = ['Less than 1 year','1 - 2 Years','2 - 4 Years','5 - 10 Years','10+ Years'];
const COMPANY_SIZES = ['Just me','2 - 10 employees','11 - 50 employees','51 - 200 employees','200+ employees'];
const TURNOVERS = ['Under R1M','R1M - R5M','R5M - R10M','R10M+'];
const CHALLENGES = ['Funding & Cash Flow','Sales & Marketing','Hiring & Team','Operations & Compliance','Supply Chain','Other'];

/* ===================== STATE ===================== */
const state = {
  settingsTab:'profile',
  notif:{ digest:'weekly', reply:true, mention:true, sectorAsk:true, winConn:true, event:true, suggested:false },
  downloads:{ q:'', type:'all', sort:'newest' },
  funding:{ q:'', status:'all', sort:'newest', expanded:{}, editing:{}, view:'list', activeId:null },
  orders:{ page:1 }
};
/* ===================== SCREEN B: SETTINGS ===================== */
const SETTINGS_NAV = [
  { id:'login',         label:'Login Information', icon:'key-round' },
  { id:'profile',       label:'Profile',        icon:'user-round' },
  { id:'notifications', label:'Notification Preferences', icon:'bell' },
  { id:'privacy',       label:'Privacy',        icon:'eye' },
  { id:'blocked',       label:'Blocked Members',icon:'user-x' },
  { id:'invites',       label:'Group Invites',  icon:'mail-plus' },
  { id:'membership',    label:'Membership',     icon:'crown' },
  { id:'orders',        label:'My Orders',      icon:'shopping-bag' },
  { id:'downloads',     label:'Downloads',      icon:'download-cloud' },
  { id:'funding',       label:'Funding',        icon:'banknote' },
  { id:'export',        label:'Export Data',    icon:'file-down' }
];
function renderSettingsNav(){
  document.getElementById('settings-nav').innerHTML = SETTINGS_NAV.map(s=>`
    <button onclick="setSettingsTab('${s.id}')" class="snav ${state.settingsTab===s.id?'active':'text-slate-600 hover:bg-slate-50'} shrink-0 w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold text-left transition">
      <i data-lucide="${s.icon}" class="w-4.5 h-4 text-slate-400"></i> <span>${s.label}</span>
      <button onclick="event.stopPropagation();openBrief('set_${s.id}')" class="dev-badge w-4 h-4 rounded-full bg-[#DC183C] text-white items-center justify-center text-[9px] font-bold leading-none animate-pulse ml-auto" title="Implementation notes">i</button>
    </button>`).join('');
  lucide.createIcons();
}
function setSettingsTab(id){ state.settingsTab=id; renderSettingsNav(); renderSettingsContent(); window.scrollTo({top:120,behavior:'smooth'}); }

function settingsCard(title, sub, body){
  return `<div class="bg-white rounded-2xl border border-slate-100 overflow-hidden reveal">
    <div class="px-5 sm:px-6 py-4 border-b border-slate-100">
      <h2 class="font-jakarta font-extrabold text-lg text-[#121A21] tracking-tight">${esc(title)}</h2>
      ${sub?`<p class="text-sm text-slate-500 mt-0.5">${sub}</p>`:''}
    </div>
    <div class="p-5 sm:p-6">${body}</div>
  </div>`;
}
function field(label, inputHTML, hint){
  return `<div><label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">${esc(label)}</label>${inputHTML}${hint?`<p class="text-xs text-slate-400 mt-1">${hint}</p>`:''}</div>`;
}
function inp(id,val,ph=''){ return `<input id="${id}" value="${esc(val||'')}" placeholder="${esc(ph)}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-[#DC183C] focus:bg-white transition">`; }
function sel(id,opts,cur){ return `<select id="${id}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-[#DC183C] focus:bg-white transition">${opts.map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}</select>`; }
function toggleRow(label, sub, on, onclick){
  return `<div class="flex items-center justify-between gap-4 py-3.5">
    <div class="min-w-0"><p class="text-sm font-semibold text-[#121A21]">${esc(label)}</p>${sub?`<p class="text-xs text-slate-500 mt-0.5">${esc(sub)}</p>`:''}</div>
    <div onclick="${onclick}" class="switch ${on?'on':''}"></div>
  </div>`;
}

function renderSettingsContent(){
  const host = document.getElementById('settings-content');
  const map = { login:setLogin, profile:setProfile, notifications:setNotifications, privacy:setPrivacy, blocked:setBlocked, invites:setInvites, membership:setMembership, orders:setOrders, downloads:renderDownloads, funding:renderFunding, export:setExportData };
  host.innerHTML = (map[state.settingsTab]||setLogin)();
  lucide.createIcons();
}

function setNotifications(){
  const n = state.notif;
  const digest = ['daily','weekly','none'];
  const digestUI = `<div class="grid sm:grid-cols-3 gap-2">${digest.map(d=>`
    <div onclick="setDigest('${d}')" class="rcard ${n.digest===d?'sel':''} border border-slate-200 rounded-xl p-3 text-center">
      <p class="font-jakarta font-bold text-sm text-[#121A21] capitalize">${d}</p>
      <p class="text-[11px] text-slate-500 mt-0.5">${d==='daily'?'Every morning':d==='weekly'?'Monday digest':'No email digest'}</p>
    </div>`).join('')}</div>`;
  const events = [
    ['reply','New reply to your post',"When someone replies to your Ask, Win or Share"],
    ['mention','Mentions',"When a member @mentions you"],
    ['sectorAsk','New Ask in your sector',"Fresh Asks from your sector so you can help"],
    ['winConn','Win from a connection',"Celebrate milestones from people you know"],
    ['event','Event reminders',"Upcoming SME events and summit alerts"],
    ['suggested','New suggested connection',"When we find a founder worth meeting"]
  ];
  const body = `
    <div class="pb-5 mb-5 border-b border-slate-100">
      <h3 class="font-jakarta font-bold uppercase text-sm text-[#121A21] tracking-wide mb-1">Email digest</h3>
      <p class="text-xs text-slate-500 mb-3">Batched email summary — sent via Kit (ConvertKit), staggered to protect deliverability.</p>
      ${digestUI}
    </div>
    <h3 class="font-jakarta font-bold uppercase text-sm text-[#121A21] tracking-wide mb-1">In-app notifications</h3>
    <div class="divide-y divide-slate-100">
      ${events.map(([k,l,s])=>toggleRow(l,s,n[k],`toggleNotif('${k}')`)).join('')}
    </div>`;
  return settingsCard('Notifications', 'Choose what reaches you, and how.', body);
}
function setDigest(d){ state.notif.digest=d; renderSettingsContent(); showToast('Email digest: '+d+'.', null); }
function toggleNotif(k){ state.notif[k]=!state.notif[k]; renderSettingsContent(); }

const PRIVACY_OPTIONS = ['Public','Only Me','My Connections'];
const PRIVACY_FIELDS = [

function reDownload(id){
  const d = DOWNLOADS.find(x=>x.id===id); if(!d) return;
  showToast('Re-downloading '+d.title+'…', null);
}

function renderDownloadList(){
  const host = document.getElementById('dl-list'); if(!host) return;
  const q = (state.downloads.q||'').toLowerCase();
  let list = DOWNLOADS.slice();
  if(state.downloads.type!=='all') list = list.filter(d=>d.type===state.downloads.type);
  if(q) list = list.filter(d=>d.title.toLowerCase().includes(q));
  if(state.downloads.sort==='oldest') list.reverse();
  else if(state.downloads.sort==='accessed') list.sort((a,b)=>b.accessed-a.accessed);
  const empty = document.getElementById('dl-empty');
  if(!list.length){
    host.innerHTML = '';
    if(empty) empty.classList.remove('hidden');
    lucide.createIcons();
    return;
  }
  if(empty) empty.classList.add('hidden');
  host.innerHTML = list.map((d,i)=>{
    const m = DOWNLOAD_TYPE_META[d.type];
    return `<div class="flex items-center gap-3 px-4 py-3.5 ${i%2?'bg-slate-50/50':''} border-b border-slate-100 last:border-0">
      <div class="w-11 h-11 rounded-xl grid place-items-center shrink-0" style="background:${m.bg}"><i data-lucide="${d.icon}" class="w-5 h-5" style="color:${m.color}"></i></div>

function withdrawApp(id){
  const a = APPLICATIONS.find(x=>x.id===id); if(!a) return;
  if(confirm('Withdraw application '+id+'? This cannot be undone.')){
    a.status='declined'; a.step=-1; a.updated='just now';
    a.timeline.push({ date:'today', text:'Withdrawn by applicant.', icon:'x-circle' });
    renderSettingsContent();
    showToast('Application '+id+' withdrawn.', null);
  }
}
function toggleEditApp(id){
  state.funding.editing[id] = !state.funding.editing[id];
  renderFundingList();
}
function saveEditApp(id){
  const a = APPLICATIONS.find(x=>x.id===id); if(!a) return;
  const amt = document.getElementById('fa-amt-'+id); const term = document.getElementById('fa-term-'+id); const purp = document.getElementById('fa-purp-'+id);
  if(amt){ const v=parseInt(String(amt.value).replace(/[^0-9]/g,''),10); if(v) a.amount=v; }
  if(term && term.value.trim()) a.term=term.value.trim();
  if(purp && purp.value.trim()) a.purpose=purp.value.trim();
  a.updated='just now';
  state.funding.editing[id] = false;
  renderFundingList();
  showToast('Application '+id+' updated.', 'win');
}

function submitNewFunding(){
  const g = id => document.getElementById(id);
  const product = g('nf-product').value;
  const amount = parseInt((g('nf-amount').value||'0').replace(/[^\d]/g,''),10) || 0;
  const term = g('nf-term').value.trim() || '—';
  const purpose = g('nf-purpose').value.trim() || 'No purpose provided.';
  const newId = 'APP-2026-'+(1000+APPLICATIONS.length);
  APPLICATIONS.unshift({
    id:newId, product, icon:FUNDING_ICON_MAP[product]||'banknote',
    amount, term, purpose,
    submitted:'today', updated:'just now', status:'submitted', step:0,
    lender:null, contact:null,
    documents:[
      { name:'Company registration (CIPC)', state:'pending' },
      { name:'6 months bank statements', state:'pending' },
      { name:'Latest management accounts', state:'pending' }
    ],
    timeline:[{ date:'today', text:'Application submitted.', icon:'send' }]
  });
  state.funding.view='detail'; state.funding.activeId=newId;
  renderSettingsContent();
  window.scrollTo({top:120,behavior:'smooth'});
  showToast('Application submitted.', 'win');
}

function viewFunding(id){
  state.funding.activeId = id;
  state.funding.view = 'detail';
  renderSettingsContent();
  window.scrollTo({top:120,behavior:'smooth'});
}
function backToFundingList(){
  state.funding.view = 'list';
  renderSettingsContent();
  window.scrollTo({top:120,behavior:'smooth'});
}
function confirmWithdraw(id){
  const a = APPLICATIONS.find(x=>x.id===id); if(!a) return;
  if(confirm('Withdraw application '+id+'? This cannot be undone.')){
    a.status='declined'; a.step=-1; a.updated='just now';
    a.timeline.push({ date:'today', text:'Withdrawn by applicant.', icon:'x-circle' });
    if(state.funding.view==='detail') renderSettingsContent();
    else renderFundingList();
    showToast('Application '+id+' withdrawn.', null);
  }
}

function fundingContextCTA(a){
  let title='', body='', cta='Continue', icon='arrow-right', tone='#0C1F31';
  switch(a.status){
    case 'draft':
      title='Finish your draft and submit.'; body='Complete the required fields so we can match you with a lender.'; cta='Continue application'; icon='edit-3'; break;
    case 'submitted':
      title='Awaiting lender match.'; body='Your application is in the queue. We typically match within 2 business days.'; cta='Message support'; icon='clock'; break;
    case 'review':
      title='Your application is being reviewed.'; body='The underwriter is assessing your file. We will notify you of any next steps.'; cta='View timeline'; icon='search'; break;
    case 'docs': {
      const pending = a.documents.filter(d=>d.state!=='provided').length;
      title=`You have ${pending} document${pending===1?'':'s'} outstanding — upload now.`; body='The lender cannot continue until every requested document is provided.'; cta='Upload documents'; icon='upload'; tone='#DC183C'; break;
    }
    case 'approved':
      title='Congratulations — review your funding offer.'; body='An approval term sheet is ready. Sign to release funds.'; cta='Review offer'; icon='badge-check'; tone='#29A37A'; break;
    case 'funded':
      title='Funds disbursed.'; body='This application is closed. A statement will be available in your account portal.'; cta='Download statement'; icon='download'; tone='#29A37A'; break;
    case 'declined':
      title='Application closed.'; body='If circumstances change, you can submit a new application at any time.'; cta='Start a new application'; icon='refresh-cw'; break;
  }
  return `<div class="rounded-2xl overflow-hidden border border-[#E7EBEF] mt-6">
    <div class="px-5 py-5 relative flex items-center justify-between gap-3 flex-wrap" style="background:${tone}">
      <div class="absolute inset-0 opacity-30" style="background:radial-gradient(circle at 90% 50%, #FF9900 0%, transparent 60%);"></div>
      <div class="relative min-w-0 flex items-start gap-3">
        <div class="w-10 h-10 rounded-xl bg-white/10 grid place-items-center shrink-0"><i data-lucide="${icon}" class="w-5 h-5 text-[#FF9900]"></i></div>
        <div class="min-w-0">
          <p class="font-jakarta font-extrabold text-white text-base leading-tight">${esc(title)}</p>
          <p class="text-xs text-white/70 mt-1">${esc(body)}</p>
        </div>
      </div>
      <button onclick="showToast('${esc(cta)} (mockup).',null)" class="relative bg-[#DC183C] hover:bg-[#B0142F] text-white rounded-full px-5 py-2.5 font-jakarta font-bold text-sm transition flex items-center gap-2 shrink-0"><i data-lucide="${icon}" class="w-4 h-4"></i> ${esc(cta)}</button>
    </div>
  </div>`;
}

function fundingDocRow(a, d, i){
  const sizes = ['1.2 MB','864 KB','2.1 MB','512 KB','1.7 MB','948 KB'];
  const fname = (d.state==='provided') ? (d.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,28)+'.pdf') : '';
  const size = sizes[i % sizes.length];
  let action = '';
  if(d.state==='provided') action = `<button onclick="showToast('Viewing '+${JSON.stringify(d.name)},null)" class="text-[11px] font-bold text-slate-500 hover:text-[#DC183C] border border-[#E7EBEF] rounded-full px-3 py-1.5 transition">View</button>`;
  else if(d.state==='reupload') action = `<button onclick="uploadDoc('${a.id}',${i})" class="bg-[#FF9900] hover:bg-[#AE6B0A] text-white rounded-full px-3 py-1.5 text-[11px] font-bold transition inline-flex items-center gap-1.5"><i data-lucide="refresh-cw" class="w-3 h-3"></i> Re-upload</button>`;
  else action = `<button onclick="uploadDoc('${a.id}',${i})" class="bg-[#DC183C] hover:bg-[#B0142F] text-white rounded-full px-3 py-1.5 text-[11px] font-bold transition inline-flex items-center gap-1.5"><i data-lucide="upload" class="w-3 h-3"></i> Upload</button>`;
  return `<div class="flex items-center gap-3 py-3 border-b border-[#E7EBEF] last:border-0">
    <div class="w-9 h-9 rounded-lg bg-[#FCFCFC] border border-[#E7EBEF] grid place-items-center shrink-0"><i data-lucide="${d.state==='provided'?'file-check':'file'}" class="w-4 h-4 ${d.state==='provided'?'text-[#29A37A]':'text-slate-400'}"></i></div>
    <div class="min-w-0 flex-1">
      <p class="text-sm font-semibold text-[#121A21] truncate">${esc(d.name)}</p>

    </div>
    ${docBadge(d.state)}
    ${action}
  </div>`;
}

function fundingDetailStepper(step){
  return `<div class="flex items-center w-full">

      const dotBg = done?'#29A37A':cur?'#FDECEF':'#FCFCFC';
      const dotIconColor = done?'#fff':cur?'#DC183C':'#94A3B8';
      const icon = done?'check':(cur?'circle-dot':'circle');
      const lineColor = done?'#29A37A':'#E7EBEF';
      return `<div class="flex items-center ${i===FUNDING_STEPS.length-1?'':'flex-1'} min-w-0">
        <div class="flex flex-col items-center">

          <p class="text-[10px] font-bold mt-2 ${cur?'text-[#DC183C]':done?'text-[#29A37A]':'text-slate-400'} uppercase tracking-wide text-center whitespace-nowrap">${s}</p>
        </div>
        ${i<FUNDING_STEPS.length-1?`<div class="flex-1 h-0.5 mx-2 -mt-6" style="background:${lineColor}"></div>`:''}
      </div>`;
    }).join('')}
  </div>`;
}

function checkPw(){
  const a=document.getElementById('pw-new'), b=document.getElementById('pw-conf'), m=document.getElementById('pw-msg');
  if(!a||!b||!m) return;
  if(a.value && a.value.length<8){ m.textContent='New password must be at least 8 characters.'; m.className='text-xs text-[#DC183C]'; }
  else if(a.value && b.value && a.value!==b.value){ m.textContent='Passwords do not match.'; m.className='text-xs text-[#DC183C]'; }
  else if(a.value && a.value===b.value){ m.textContent='Passwords match.'; m.className='text-xs text-[#29A37A]'; }
  else { m.textContent=''; }
}

  set_funding:{ title:'Settings · Funding', sub:'Full funding application tracker',

    components:'<b>List view:</b> hero band + new-application CTA · 4-stat strip · status chips + search + sort · semantic table (md+) with zebra rows + hover highlight + status pill + amount right-aligned + per-row View application CTA + kebab menu · mobile stacked cards · empty state. <b>New-application view:</b> back link · pre-fill notice linking to Profile · Business details fields · Funding request fields (product, amount, term, purpose) · Submit / Cancel. <b>Detail view:</b> back link + reference · hero card (product icon + h1 + large status pill + Updated meta + Update info CTA) · 3-column grid on lg: left sidebar = At a glance + Actions (Withdraw / Duplicate / Download PDF); right column = wide 5-step progress tracker, Application details (dl grid), Documents (rows with status badge + file name + Upload/Re-upload/View), Activity timeline (vertical with icons + actor avatars). · Context CTA band keyed off status.',
    specs:'<b>Container:</b> rendered inside <code>settingsCard</code> (see Settings shell). <b>Note:</b> funding uses off-white <code>#FCFCFC</code> surfaces and <code>#E7EBEF</code> borders (vs slate-100 elsewhere).<br/><b>Hero band:</b> rounded-2xl 1px border <code>#E7EBEF</code>, inner bg <code>#0C1F31</code> padding 20px (<code>px-5 py-5</code>) + radial <code>#29A37A</code> 40%. Kicker 10px weight 700 uppercase tracking-widest <code>#FF9900</code>; h3 Plus Jakarta 800 24px (<code>text-2xl</code>) white; sub 12px white/60. New-application CTA bg <code>#DC183C</code> hover <code>#B0142F</code> rounded-full padding 20px/10px Plus Jakarta 700 14px white + Lucide <code>plus</code> 16&times;16.<br/><b>Stat strip:</b> <code>grid-cols-2 sm:grid-cols-4</code> 12px gap; card bg white rounded-2xl 1px <code>#E7EBEF</code> padding 16px, label 10px weight 700 uppercase tracking-widest slate-400, value Plus Jakarta 800 24px + 8px status dot (Total <code>#0C1F31</code>, In review <code>#FF9900</code>, Approved <code>#29A37A</code>, Declined <code>#6A7581</code>).<br/><b>Filter/search bar:</b> card rounded-2xl 1px <code>#E7EBEF</code> padding 16px; search bg <code>#FCFCFC</code> 1px <code>#E7EBEF</code> rounded-full padding-l 36px py 8px 14px; sort select rounded-full padding 12px/8px 12px weight 600; status chips padding 14px/6px rounded-full 12px weight 700 1px <code>#E7EBEF</code>, active bg <code>#DC183C</code> white.<br/><b>Table (md+):</b> bg white rounded-2xl 1px <code>#E7EBEF</code>; thead bg <code>#FCFCFC</code> bottom border <code>#E7EBEF</code>; th padding 16px/12px (<code>px-4 py-3</code>) 11px weight 700 uppercase tracking-wider <code>#0C1F31</code>; Amount &amp; Actions right-aligned; zebra rows + hover; per-row View button bg <code>#DC183C</code> rounded-full. Below md: stacked cards (<code>md:hidden space-y-3</code>).<br/><b>Status pills:</b> Draft <code>#6A7581</code>/<code>#E7EBEF</code>, Submitted <code>#3B82F6</code>/<code>#E5EFFB</code>, In review <code>#F function toggleDevMode(){
  const on = document.body.classList.toggle('dev-on');
  const btn = document.getElementById('devToggle');
  if(btn) btn.classList.toggle('on', on);
  if(on) showToast('Dev Mode on — tap any ⓘ for implementation notes.', null);
  lucide.createIcons();
}
function closeOverlay(id){
  const el = document.getElementById(id); if(!el) return;
  el.classList.remove('open');
  setTimeout(()=>{ if(el && el.parentNode) el.remove(); }, 300);
}
function openBrief(id){
  const b = BRIEFS[id]; if(!b) return;
  const sec = (icon,label,html) => `
    <div class="px-6 py-4 border-t border-slate-100">
      <p class="text-[10px] font-bold uppercase tracking-widest text-[#DC183C] flex items-center gap-1.5 mb-2"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${label}</p>
      <div class="text-sm text-slate-600 leading-relaxed">${html}</div>
    </div>`;
  document.getElementById('overlay-root').innerHTML = `
    <div class="ov" id="ov-brief">
      <div class="ov-bg" onclick="closeOverlay('ov-brief')"></div>
      <div class="drawer">
        <div class="sticky top-0 z-10 bg-[#0C1F31] text-white px-6 py-5 flex items-start justify-between">
          <div class="min-w-0"><p class="text-[10px] font-bold uppercase tracking-widest text-[#FF9900] mb-1">Dev Brief</p><h3 class="font-jakarta font-extrabold text-lg leading-tight">${b.title}</h3><p class="text-xs text-white/60 mt-1">${b.sub}</p></div>
          <button onclick="closeOverlay('ov-brief')" class="text-white/60 hover:text-white shrink-0 ml-3"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        ${sec('target','Purpose', b.purpose)}
        ${sec('database','Data model', b.data)}
        ${sec('git-branch','Logic', b.logic)}
        ${b.specs ? sec('ruler','Spec values', b.specs) : ''}
        ${sec('boxes','Components', b.components)}
        <div class="px-6 py-4 border-t border-slate-100"><p class="text-[11px] text-slate-400 flex items-center gap-1.5"><i data-lucide="info" class="w-3.5 h-3.5"></i> Spec lives beside the feature — toggle Dev Mode off for the clean stakeholder view.</p></div>
      </div>
    </div>`;
  requestAnimationFrame(()=>{ const o=document.getElementById('ov-brief'); if(o) o.classList.add('open'); });
  lucide.createIcons();
}

/* ===================== TOAST ===================== */
function showToast(msg, kind){
  const el = document.getElementById('toast');
  const t = TYPES[kind]; const color = t ? t.color : '#0C1F31';
  el.classList.remove('hidden');
  el.innerHTML = `<div class="toast-in bg-[#0C1F31] text-white rounded-full pl-3 pr-5 py-2.5 shadow-2xl flex items-center gap-2 text-sm font-semibold" style="border-left:4px solid ${color}">
    <i data-lucide="check-circle" class="w-4 h-4" style="color:${color}"></i><span>${esc(msg)}</span></div>`;
  lucide.createIcons();
  setTimeout(()=>{ const inner=el.firstElementChild; if(inner){ inner.classList.remove('toast-in'); inner.classList.add('toast-out'); } setTimeout(()=>{ el.classList.add('hidden'); el.innerHTML=''; },250); }, 2400);
}

/* ===================== INIT ===================== */
document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.querySelectorAll('.ov.open').forEach(o=>closeOverlay(o.id)); });

/* Deep-link support: #funding, #profile, etc. — lets other pages (e.g. the member workspace) land straight on a settings tab */
(function(){
  var hashId = (location.hash || '').replace('#','');
  if(hashId && SETTINGS_NAV.some(function(s){ return s.id === hashId; })) state.settingsTab = hashId;
})();

renderSettingsNav();
renderSettingsContent();
lucide.createIcons();
  /* HEADER-SEARCH-JS */
  function toggleHeaderSearch(){
    var o=document.getElementById('headerSearchOverlay'); if(!o) return;
    var open=o.classList.toggle('active');
    var i=document.getElementById('headerSearchInput');
    if(open){ if(i) setTimeout(function(){ i.focus(); },100); } else if(i){ i.value=''; }
  }
  document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ var o=document.getElementById('headerSearchOverlay'); if(o&&o.classList.contains('active')) toggleHeaderSearch(); } });
</script>
