      theme: {
        extend: {

  <style>
    :root{
      --primary:349 80% 48%; --accent:36 100% 50%; --navy:210 60% 12%; --success:160 60% 40%;
      --foreground:210 30% 10%; --muted-foreground:210 10% 45%; --border:210 20% 92%;
      --background:0 0% 99%; --card:0 0% 100%; --radius:0.75rem;
      --shadow-card:0 2px 8px rgba(12,31,49,.08); --shadow-card-hover:0 8px 24px rgba(12,31,49,.12);
    }
    html, body { font-family:'Inter', system-ui, sans-serif; }
    .font-jakarta { font-family:'Plus Jakarta Sans', sans-serif; letter-spacing:.005em; }

    .no-scrollbar::-webkit-scrollbar { display:none; }
    .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }

    /* Reveal */
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .reveal { animation: fadeUp .45s cubic-bezier(.2,.7,.2,1) backwards; }

    /* Toast */
    @keyframes toastIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes toastOut { to { opacity:0; transform:translateY(20px); } }
    .toast-in { animation: toastIn .25s ease forwards; }
    .toast-out { animation: toastOut .25s ease forwards; }

    /* Type stripes */
    .stripe-ask   { box-shadow: inset 4px 0 0 0 #DC183C; }
    .stripe-win   { box-shadow: inset 4px 0 0 0 #29A37A; }
    .stripe-share { box-shadow: inset 4px 0 0 0 #FF9900; }

    /* Card lift */
    .card-lift { transition: box-shadow .2s, transform .2s; }
    .card-lift:hover { box-shadow:0 8px 20px -8px rgba(10,44,61,.12); transform:translateY(-1px); }


    /* Settings sidebar item */
    .snav.active { background:#FDECEF; color:#DC183C; }
    .snav.active i { color:#DC183C; }

    /* Segmented control */
    .seg.active { background:#0C1F31; color:#fff; }

    /* Toggle switch */
    .switch { width:42px; height:24px; border-radius:9999px; background:#CBD5E1; position:relative; transition:background .2s; flex:none; cursor:pointer; }
    .switch::after { content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:9999px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s; }
    .switch.on { background:#29A37A; }
    .switch.on::after { transform:translateX(18px); }
    .switch.disabled { opacity:.45; cursor:not-allowed; }

    /* Chip select (radio cards) */
    .rcard { transition:border-color .15s, background-color .15s; cursor:pointer; }
    .rcard.sel { border-color:#DC183C; background:#FDECEF; }

    /* Overlays */
    #overlay-root:empty { display:none; }
    .ov { position:fixed; inset:0; z-index:60; }
    .ov-bg { position:absolute; inset:0; background:rgba(12,31,49,.45); backdrop-filter:blur(2px); opacity:0; transition:opacity .3s; }
    .ov.open .ov-bg { opacity:1; }
    .drawer { position:absolute; right:0; top:0; height:100%; width:100%; max-width:440px; background:#fff; box-shadow:-12px 0 40px rgba(12,31,49,.25); overflow-y:auto; transform:translateX(100%); transition:transform .3s cubic-bezier(.2,.7,.2,1); }
    .ov.open .drawer { transform:translateX(0); }

    /* Dev Mode */
    .dev-badge { display:none; }
    body.dev-on .dev-badge { display:inline-flex; }
    #devToggle.on { background:#DC183C; color:#fff; border-color:#DC183C; }

      /* HEADER-SEARCH-CSS */
    .search-overlay { position:absolute; inset:0; background:white; z-index:50; display:flex; align-items:center; justify-content:center; padding:0 1rem; opacity:0; pointer-events:none; transform:translateY(-10px); transition:all .3s cubic-bezier(.2,.8,.2,1); }
    .search-overlay.active { opacity:1; pointer-events:auto; transform:translateY(0); }
    @media (min-width:640px){ .search-overlay{ padding:0 1.5rem; } }
</style>

<script>
/* ===================== HELPERS ===================== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function monogram(initials, size=44){
  const fs = Math.max(10, Math.floor(size*0.38));
  return `<div class="rounded-full bg-gradient-to-br from-[#DC183C] to-[#FF9900] grid place-items-center font-jakarta font-bold text-white shrink-0" style="width:${size}px;height:${size}px;font-size:${fs}px">${esc(initials)}</div>`;
}
const TYPES = {
  ask:   { color:'#DC183C', bgTint:'bg-[#DC183C]/10', text:'text-[#DC183C]', label:'Ask',   icon:'help-circle', headerBg:'#FDECEF' },
  win:   { color:'#29A37A', bgTint:'bg-[#29A37A]/10', text:'text-[#29A37A]', label:'Win',   icon:'trophy',      headerBg:'#E4F5EE' },
  share: { color:'#FF9900', bgTint:'bg-[#FF9900]/15', text:'text-[#AE6B0A]', label:'Share', icon:'megaphone',   headerBg:'#FFF1E0' }
};

let BLOCKED = [
  { name:'Spam Account', initials:'SA', reason:'Repeated promotional DMs', date:'1 month ago' }
];

const PROFILE = {
  initials:'NM', firstName:'Naledi', lastName:'Mokoena', handle:'naledi', email:'naledi@greentrace.africa',
  interest:'Funding', province:'Western Cape', city:'Cape Town',
  bio:"Naledi founded GreenTrace in 2021 to help SA agri-exporters track sustainability compliance without the spreadsheet chaos.",
  jobTitle:'Founder', company:'GreenTrace', sector:'Cleantech', stage:'Growing',
  yearsInBusiness:'2 - 4 Years', companySize:'11 - 50 employees', turnover:'R10M+',
  challenge:'Other', bankAccount:'yes',
  tools:{ excel:false, accounting:false, hrPayroll:true, pos:false, none:false, other:false }
};
const INTERESTS = ['Networking','Funding','Mentorship','Marketing','Sales','Operations','Tech'];
const PROVINCES = ['Gauteng','Western Cape','KwaZulu-Natal','Eastern Cape','Free State','Limpopo','Mpumalanga','North West','Northern Cape'];
const SECTORS = ['Fintech','SaaS','Retail','Agritech','Cleantech','AI','Construction','Food','Other'];
const STAGES = ['Idea','Just Launched','Growing','Established'];
const YEARS_IN_BUSINESS = ['Less than 1 year','1 - 2 Years','2 - 4 Years','5 - 10 Years','10+ Years'];
const COMPANY_SIZES = ['Just me','2 - 10 employees','11 - 50 employees','51 - 200 employees','200+ employees'];
const TURNOVERS = ['Under R1M','R1M - R5M','R5M - R10M','R10M+'];
const CHALLENGES = ['Funding & Cash Flow','Sales & Marketing','Hiring & Team','Operations & Compliance','Supply Chain','Other'];

/* ===================== STATE ===================== */
const state = {
  settingsTab:'profile',
  notif:{ digest:'weekly', reply:true, mention:true, sectorAsk:true, winConn:true, event:true, suggested:false },
  newsletter:{ weekly:true, funding:true, solutions:false, events:false },
  orders:{ page:1 }
};
/* ===================== SCREEN B: SETTINGS ===================== */
const SETTINGS_NAV = [
  /* Live order (14 Oct 2026): account items, then FUNDING, EVENTS and LEARN. No Membership tab (no Premium upsell) and no
     "My applications" tab: the applications log is the "Your applications" section inside Funding (Joel, 13 Oct). */
  { id:'login',         label:'Login Information', icon:'key-round' },
  { id:'profile',       label:'Profile',        icon:'user-round' },
  { id:'newsletter',    label:'Newsletter',     icon:'mail-open' },
  { id:'orders',        label:'My Orders',      icon:'shopping-bag' },
  { id:'invites',       label:'Group Invites',  icon:'mail-plus' },
  { id:'notifications', label:'Notification Preferences', icon:'bell' },
  { id:'privacy',       label:'Privacy',        icon:'eye' },
  { id:'export',        label:'Export Data',    icon:'file-down' },
  { id:'blocked',       label:'Blocked Members',icon:'user-x' },
  { id:'scheduled',     label:'Scheduled Posts',icon:'calendar-clock' },
  { id:'saved',         label:'Saved',          icon:'bookmark' },
  { id:'funding',       label:'Funding',        icon:'hand-coins', group:'Funding' },
  { id:'calculator',    label:'Loan calculator',icon:'calculator' },
  { id:'events',        label:'Events',         icon:'calendar-days', group:'Events' },
  { id:'guides',        label:'Guides',         icon:'book-open', group:'Learn' },
  { id:'podcast',       label:'Podcast',        icon:'mic' },
  { id:'stories',       label:'Founder stories',icon:'sparkles' },
  { id:'library',       label:'Library',        icon:'folder-open' }
];
/* My Orders shows only for a member who has bought something (Joel, 2026-10-13): most members never have.
   Demo a buyer with ?orders=1 (the tab and the Orders menu item then appear with the sample orders). */
const HAS_ORDERS = /[?&]orders=1\b/.test(location.search);
function settingsNav(){ return SETTINGS_NAV.filter(s => s.id !== 'orders' || HAS_ORDERS); }
function renderSettingsNav(){
  document.getElementById('settings-nav').innerHTML = settingsNav().map(s=>`${s.group?`<p class="hidden lg:block px-3.5 pt-4 pb-1 text-[10px] font-bold uppercase tracking-widest text-slate-400">${s.group}</p><span class="lg:hidden w-px self-stretch my-2 bg-slate-200 shrink-0" aria-hidden="true"></span>`:''}
    <button data-sid="${s.id}" ${state.settingsTab===s.id?'aria-current="page"':''} onclick="setSettingsTab('${s.id}')" class="snav ${state.settingsTab===s.id?'active':'text-slate-600 hover:bg-slate-50'} shrink-0 lg:w-full flex items-center gap-3 px-3.5 min-h-[44px] rounded-xl text-sm font-semibold text-left whitespace-nowrap transition">
      <i data-lucide="${s.icon}" class="w-4.5 h-4 text-slate-500"></i> <span>${s.label}</span>
      <button onclick="event.stopPropagation();openBrief('set_${s.id}')" class="dev-badge w-4 h-4 rounded-full bg-[#DC183C] text-white items-center justify-center text-[9px] font-bold leading-none animate-pulse ml-auto" title="Implementation notes">i</button>
    </button>`).join('');
  lucide.createIcons();
  /* phones: the menu is one swipeable row; keep the open item in view */
  const on = document.querySelector('#settings-nav [data-sid="'+state.settingsTab+'"]');

function checkPw(){
  const a=document.getElementById('pw-new'), b=document.getElementById('pw-conf'), m=document.getElementById('pw-msg');
  if(!a||!b||!m) return;
  if(a.value && a.value.length<8){ m.textContent='New password must be at least 8 characters.'; m.className='text-xs text-[#DC183C]'; }
  else if(a.value && b.value && a.value!==b.value){ m.textContent='Passwords do not match.'; m.className='text-xs text-[#DC183C]'; }
  else if(a.value && a.value===b.value){ m.textContent='Passwords match.'; m.className='text-xs text-[#29A37A]'; }
  else { m.textContent=''; }
}

function phPick(f){
  const err = document.getElementById('ph-err');
  if(!f) return;
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){ err.textContent = 'Use a JPG, PNG or WebP photo.'; err.classList.remove('hidden'); return; }
  if(f.size > 5 * 1024 * 1024){ err.textContent = 'That photo is over 5 MB. Choose a smaller one.'; err.classList.remove('hidden'); return; }
  const r = new FileReader(); r.onload = () => {
    document.getElementById('ph-body').innerHTML = `<div class="relative w-56 h-56 mx-auto rounded-full overflow-hidden bg-slate-100 ring-4 ring-slate-100"><img id="ph-img" src="${r.result}" alt="Your new photo" class="absolute inset-0 w-full h-full object-cover origin-center"></div>
      <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mt-5">Zoom</label><input type="range" min="1" max="2.5" step="0.01" value="1" oninput="document.getElementById('ph-img').style.transform='scale('+this.value+')'" class="w-full accent-[#DC183C]">
      <div class="mt-5 flex gap-3"><button onclick="document.getElementById('ov-photo').remove();showToast('Profile photo updated.',null)" class="flex-1 h-11 rounded-full bg-[#DC183C] hover:bg-[#B0142F] text-white font-bold text-sm">Save photo</button><button onclick="openPhotoModal()" class="h-11 px-5 rounded-full border border-slate-200 text-sm font-bold">Choose another</button></div>`;
  }; r.readAsDataURL(f);
}

/* ===================== TOAST ===================== */
function showToast(msg, kind){
  const el = document.getElementById('toast');
  const t = TYPES[kind]; const color = t ? t.color : '#0C1F31';
  el.classList.remove('hidden');
  el.innerHTML = `<div class="toast-in bg-[#0C1F31] text-white rounded-full pl-3 pr-5 py-2.5 shadow-2xl flex items-center gap-2 text-sm font-semibold" style="border-left:4px solid ${color}">
    <i data-lucide="check-circle" class="w-4 h-4" style="color:${color}"></i><span>${esc(msg)}</span></div>`;
  lucide.createIcons();
  setTimeout(()=>{ const inner=el.firstElementChild; if(inner){ inner.classList.remove('toast-in'); inner.classList.add('toast-out'); } setTimeout(()=>{ el.classList.add('hidden'); el.innerHTML=''; },250); }, 2400);
}

/* ---------- Loan calculator ---------- */
function setCalculator(){
  const rng = (id,label,min,max,step,val,fmt)=>`<div><div class="flex items-center justify-between mb-1.5"><label for="${id}" class="text-[11px] font-bold uppercase tracking-wider text-slate-500">${label}</label><span id="${id}-v" class="font-jakarta font-bold text-sm text-[#121A21]"></span></div><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}" oninput="calcUpdate()" class="w-full h-11 accent-[#DC183C]"></div>`;
  const body = `
    <div class="grid lg:grid-cols-2 gap-6">
      <div class="space-y-4">
        ${rng('c-amt','Amount',20000,2000000,10000,250000)}
        ${rng('c-term','Term (months)',3,60,1,12)}
        ${rng('c-rate','Interest rate (yearly)',10,40,0.5,18)}
      </div>
      <div class="rounded-2xl bg-[#0C1F31] text-white p-5 relative overflow-hidden">
        <div class="absolute inset-0 opacity-40 pointer-events-none" style="background:radial-gradient(circle at 85% 15%, #DC183C 0%, transparent 55%)"></div>
        <p class="relative text-[11px] font-bold uppercase tracking-widest text-white/70">Estimated monthly repayment</p>
        <p id="c-out" class="relative font-jakarta font-extrabold text-4xl mt-2"></p>
        <p id="c-tot" class="relative text-sm text-white/75 mt-2"></p>
        <a href="public-funding-apply.html" class="relative mt-5 inline-flex items-center gap-2 h-11 px-5 rounded-full bg-[#DC183C] hover:bg-[#B0142F] font-jakarta font-bold text-sm">Apply for funding <i data-lucide="arrow-right" class="w-4 h-4"></i></a>
      </div>
    </div>
    <p class="text-xs text-slate-500 mt-4">An estimate only. The rate and fees you are offered depend on the funding partner and your business.</p>`;
  return settingsCard('Loan calculator', 'Compare repayments before you apply.', body);
}
function calcUpdate(){
  const g = id => document.getElementById(id); if(!g('c-amt')) return;
  const P = +g('c-amt').value, n = +g('c-term').value, r = +g('c-rate').value/1200;
  const m = r ? P*r/(1-Math.pow(1+r,-n)) : P/n;
  const R = v => 'R' + Math.round(v).toLocaleString('en-ZA').replace(/,/g,' ');
  g('c-amt-v').textContent = R(P); g('c-term-v').textContent = n + ' months'; g('c-rate-v').textContent = (+g('c-rate').value).toFixed(1) + '%';
  g('c-out').textContent = R(m); g('c-tot').textContent = 'Total repaid ' + R(m*n) + ' over ' + n + ' months';
}

function pager(key, page, pages, total){
  if(pages <= 1) return total ? `<p class="text-sm text-slate-500 text-center mt-5">Showing 1 to ${total} of ${total}</p>` : '';
  const start = (page-1)*PAGE_SIZE + 1, end = Math.min(total, page*PAGE_SIZE);
  let nums = [];
  for(let n=1;n<=pages;n++){ if(n===1||n===pages||Math.abs(n-page)<=2) nums.push(n); else if(nums[nums.length-1]!=='…') nums.push('…'); }
  const num = n => n==='…' ? `<span class="w-11 h-11 grid place-items-center text-slate-400">…</span>` : `<button onclick="setListPage('${key}',${n})" class="w-11 h-11 rounded-xl text-sm font-bold ${n===page?'bg-[#DC183C] text-white':'bg-white border border-slate-200 text-[#121A21] hover:border-[#0C1F31]'}" ${n===page?'aria-current="page"':''}>${n}</button>`;
  const nav = (lbl, p, dis, icon, after) => `<button ${dis?'disabled':''} onclick="setListPage('${key}',${p})" class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1 h-11 px-5 rounded-xl border border-slate-200 bg-white text-sm font-bold ${dis?'text-slate-300 cursor-not-allowed':'text-[#121A21] hover:border-[#0C1F31]'}">${after?'':`<i data-lucide="${icon}" class="w-4 h-4"></i>`}${lbl}${after?`<i data-lucide="${icon}" class="w-4 h-4"></i>`:''}</button>`;
  return `<div class="mt-6 pt-5 border-t border-slate-100">
    <p class="text-sm text-slate-500 text-center">Showing <b class="text-[#121A21]">${start} to ${end}</b> of ${total}</p>
    <div class="mt-3 flex flex-wrap items-center justify-center gap-2">
      <span class="order-2 sm:order-1 w-[calc(50%-4px)] sm:w-auto flex">${nav('Previous', page-1, page===1, 'chevron-left', false)}</span>
      <span class="order-1 sm:order-2 w-full sm:w-auto flex flex-wrap justify-center gap-1.5">${nums.map(num).join('')}</span>
      <span class="order-3 w-[calc(50%-4px)] sm:w-auto flex">${nav('Next', page+1, page===pages, 'chevron-right', true)}</span>
    </div></div>`;
}
function renderListResults(){
  const key = state.settingsTab, L = LISTS[key], host = document.getElementById('list-results');
  if(!L || !host) return;
  const st = lstate(key), q = st.q.trim().toLowerCase();
  const list = L.items.filter(e => L.match(e, st.f) && (!q || e.title.toLowerCase().includes(q)));
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  st.page = Math.min(st.page, pages);
  const slice = list.slice((st.page-1)*PAGE_SIZE, st.page*PAGE_SIZE);
  host.innerHTML = list.length
    ? `<div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">${slice.map((e,i)=>listCard(key,e,(st.page-1)*PAGE_SIZE+i)).join('')}</div>${pager(key, st.page, pages, list.length)}`
    : `<div class="bg-white rounded-2xl border border-slate-100 py-12 text-center text-slate-500"><i data-lucide="search-x" class="w-8 h-8 mx-auto mb-2"></i><p class="text-sm font-semibold">Nothing matches that search.</p><button onclick="LSTATE['${key}']=null;renderSettingsContent()" class="mt-2 h-11 px-4 text-sm font-bold text-[#DC183C]">Clear filters</button></div>`;
  lucide.createIcons();
}
