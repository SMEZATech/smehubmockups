  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            jakarta: ['Plus Jakarta Sans', 'sans-serif'],
            inter: ['Inter', 'system-ui', 'sans-serif'],
            mono: [ 'ui-monospace', 'monospace']
          },
          colors: { primary:'#DC183C', accent:'#FF9900', navy:'#0C1F31', success:'#29A37A', ink:'#121A21' }
        }
      }
    };

  <style>
    :root{
      --primary:349 80% 48%; --accent:36 100% 50%; --navy:210 60% 12%; --success:160 60% 40%;
      --foreground:210 30% 10%; --muted-foreground:210 10% 45%; --border:210 20% 92%;
      --background:0 0% 99%; --card:0 0% 100%; --radius:0.75rem;
      --shadow-card:0 2px 8px rgba(12,31,49,.08); --shadow-card-hover:0 8px 24px rgba(12,31,49,.12);
    }
    html, body { font-family:'Inter', system-ui, sans-serif; }
    .font-jakarta { font-family:'Plus Jakarta Sans', sans-serif; letter-spacing:.005em; }

    .no-scrollbar::-webkit-scrollbar { display:none; }
    .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }

    /* Reveal */
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .reveal { animation: fadeUp .45s cubic-bezier(.2,.7,.2,1) backwards; }

    /* Toast */
    @keyframes toastIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes toastOut { to { opacity:0; transform:translateY(20px); } }
    .toast-in { animation: toastIn .25s ease forwards; }
    .toast-out { animation: toastOut .25s ease forwards; }

    /* Type stripes */
    .stripe-ask   { box-shadow: inset 4px 0 0 0 #DC183C; }
    .stripe-win   { box-shadow: inset 4px 0 0 0 #29A37A; }
    .stripe-share { box-shadow: inset 4px 0 0 0 #FF9900; }

    /* Card lift */
    .card-lift { transition: box-shadow .2s, transform .2s; }
    .card-lift:hover { box-shadow:0 8px 20px -8px rgba(10,44,61,.12); transform:translateY(-1px); }


    /* Settings sidebar item */
    .snav.active { background:#FDECEF; color:#DC183C; }
    .snav.active i { color:#DC183C; }

    /* Segmented control */
    .seg.active { background:#0C1F31; color:#fff; }

    /* Toggle switch */
    .switch { width:42px; height:24px; border-radius:9999px; background:#CBD5E1; position:relative; transition:background .2s; flex:none; cursor:pointer; }
    .switch::after { content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:9999px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s; }
    .switch.on { background:#29A37A; }
    .switch.on::after { transform:translateX(18px); }
    .switch.disabled { opacity:.45; cursor:not-allowed; }

    /* Chip select (radio cards) */
    .rcard { transition:border-color .15s, background-color .15s; cursor:pointer; }
    .rcard.sel { border-color:#DC183C; background:#FDECEF; }

    /* Overlays */
    #overlay-root:empty { display:none; }
    .ov { position:fixed; inset:0; z-index:60; }
    .ov-bg { position:absolute; inset:0; background:rgba(12,31,49,.45); backdrop-filter:blur(2px); opacity:0; transition:opacity .3s; }
    .ov.open .ov-bg { opacity:1; }
    .drawer { position:absolute; right:0; top:0; height:100%; width:100%; max-width:440px; background:#fff; box-shadow:-12px 0 40px rgba(12,31,49,.25); overflow-y:auto; transform:translateX(100%); transition:transform .3s cubic-bezier(.2,.7,.2,1); }
    .ov.open .drawer { transform:translateX(0); }

    /* Dev Mode */
    .dev-badge { display:none; }
    body.dev-on .dev-badge { display:inline-flex; }
    #devToggle.on { background:#DC183C; color:#fff; border-color:#DC183C; }

      /* HEADER-SEARCH-CSS */
    .search-overlay { position:absolute; inset:0; background:white; z-index:50; display:flex; align-items:center; justify-content:center; padding:0 1rem; opacity:0; pointer-events:none; transform:translateY(-10px); transition:all .3s cubic-bezier(.2,.8,.2,1); }
    .search-overlay.active { opacity:1; pointer-events:auto; transform:translateY(0); }
    @media (min-width:640px){ .search-overlay{ padding:0 1.5rem; } }
</style>

<script>
/* ===================== HELPERS ===================== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function monogram(initials, size=44){
  const fs = Math.max(10, Math.floor(size*0.38));
  return `<div class="rounded-full bg-gradient-to-br from-[#DC183C] to-[#FF9900] grid place-items-center font-jakarta font-bold text-white shrink-0" style="width:${size}px;height:${size}px;font-size:${fs}px">${esc(initials)}</div>`;
}
const TYPES = {
  ask:   { color:'#DC183C', bgTint:'bg-[#DC183C]/10', text:'text-[#DC183C]', label:'Ask',   icon:'help-circle', headerBg:'#FDECEF' },
  win:   { color:'#29A37A', bgTint:'bg-[#29A37A]/10', text:'text-[#29A37A]', label:'Win',   icon:'trophy',      headerBg:'#E4F5EE' },
  share: { color:'#FF9900', bgTint:'bg-[#FF9900]/15', text:'text-[#AE6B0A]', label:'Share', icon:'megaphone',   headerBg:'#FFF1E0' }
};

let BLOCKED = [
  { name:'Spam Account', initials:'SA', reason:'Repeated promotional DMs', date:'1 month ago' }
];

const PROFILE = {
  initials:'NM', firstName:'Naledi', lastName:'Mokoena', handle:'naledi', email:'naledi@greentrace.africa',
  interest:'Funding', province:'Western Cape', city:'Cape Town',
  bio:"Naledi founded GreenTrace in 2021 to help SA agri-exporters track sustainability compliance without the spreadsheet chaos.",
  jobTitle:'Founder', company:'GreenTrace', sector:'Cleantech', stage:'Growing',
  yearsInBusiness:'2 - 4 Years', companySize:'11 - 50 employees', turnover:'R10M+',
  challenge:'Other', bankAccount:'yes',
  tools:{ excel:false, accounting:false, hrPayroll:true, pos:false, none:false, other:false }
};
const INTERESTS = ['Networking','Funding','Mentorship','Marketing','Sales','Operations','Tech'];
const PROVINCES = ['Gauteng','Western Cape','KwaZulu-Natal','Eastern Cape','Free State','Limpopo','Mpumalanga','North West','Northern Cape'];
const SECTORS = ['Fintech','SaaS','Retail','Agritech','Cleantech','AI','Construction','Food','Other'];
const STAGES = ['Idea','Just Launched','Growing','Established'];
const YEARS_IN_BUSINESS = ['Less than 1 year','1 - 2 Years','2 - 4 Years','5 - 10 Years','10+ Years'];
const COMPANY_SIZES = ['Just me','2 - 10 employees','11 - 50 employees','51 - 200 employees','200+ employees'];
const TURNOVERS = ['Under R1M','R1M - R5M','R5M - R10M','R10M+'];
const CHALLENGES = ['Funding & Cash Flow','Sales & Marketing','Hiring & Team','Operations & Compliance','Supply Chain','Other'];

/* ===================== STATE ===================== */
const state = {
  settingsTab:'profile',
  notif:{ digest:'weekly', reply:true, mention:true, sectorAsk:true, winConn:true, event:true, suggested:false },
  newsletter:{ weekly:true, funding:true, solutions:false, events:false },
  orders:{ page:1 }
};
/* ===================== SCREEN B: SETTINGS ===================== */
const SETTINGS_NAV = [
  { id:'login',         label:'Login Information', icon:'key-round' },
  { id:'profile',       label:'Profile',        icon:'user-round' },
  { id:'newsletter',    label:'Newsletter',     icon:'mail-open' },
  { id:'orders',        label:'My Orders',      icon:'shopping-bag' },
  { id:'invites',       label:'Group Invites',  icon:'mail-plus' },
  { id:'membership',    label:'Membership',     icon:'crown' },
  { id:'notifications', label:'Notification Preferences', icon:'bell' },
  { id:'privacy',       label:'Privacy',        icon:'eye' },
  { id:'export',        label:'Export Data',    icon:'file-down' },
  { id:'blocked',       label:'Blocked Members',icon:'user-x' }
];
function renderSettingsNav(){
  document.getElementById('settings-nav').innerHTML = SETTINGS_NAV.map(s=>`
    <button onclick="setSettingsTab('${s.id}')" class="snav ${state.settingsTab===s.id?'active':'text-slate-600 hover:bg-slate-50'} shrink-0 w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold text-left transition">
      <i data-lucide="${s.icon}" class="w-4.5 h-4 text-slate-500"></i> <span>${s.label}</span>
      <button onclick="event.stopPropagation();openBrief('set_${s.id}')" class="dev-badge w-4 h-4 rounded-full bg-[#DC183C] text-white items-center justify-center text-[9px] font-bold leading-none animate-pulse ml-auto" title="Implementation notes">i</button>
    </button>`).join('');
  lucide.createIcons();
}
function setSettingsTab(id){ state.settingsTab=id; renderSettingsNav(); renderSettingsContent(); window.scrollTo({top:120,behavior:'smooth'}); }

function settingsCard(title, sub, body){
  return `<div class="bg-white rounded-2xl border border-slate-100 overflow-hidden reveal">
    <div class="px-5 sm:px-6 py-4 border-b border-slate-100">
      <h2 class="font-jakarta font-extrabold text-lg text-[#121A21] tracking-tight">${esc(title)}</h2>
      ${sub?`<p class="text-sm text-slate-500 mt-0.5">${sub}</p>`:''}
    </div>
    <div class="p-5 sm:p-6">${body}</div>
  </div>`;
}
function field(label, inputHTML, hint){
  return `<div><label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">${esc(label)}</label>${inputHTML}${hint?`<p class="text-xs text-slate-500 mt-1">${hint}</p>`:''}</div>`;
}
function inp(id,val,ph=''){ return `<input id="${id}" value="${esc(val||'')}" placeholder="${esc(ph)}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-[#DC183C] focus:bg-white transition">`; }
function sel(id,opts,cur){ return `<select id="${id}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-[#DC183C] focus:bg-white transition">${opts.map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}</select>`; }
function toggleRow(label, sub, on, onclick){
  return `<div class="flex items-center justify-between gap-4 py-3.5">
    <div class="min-w-0"><p class="text-sm font-semibold text-[#121A21]">${esc(label)}</p>${sub?`<p class="text-xs text-slate-500 mt-0.5">${esc(sub)}</p>`:''}</div>
    <div onclick="${onclick}" class="switch ${on?'on':''}"></div>
  </div>`;
}

function renderSettingsContent(){
  const host = document.getElementById('settings-content');
  const map = { login:setLogin, profile:setProfile, notifications:setNotifications, newsletter:setNewsletter, privacy:setPrivacy, blocked:setBlocked, invites:setInvites, membership:setMembership, orders:setOrders, export:setExportData };
  host.innerHTML = (map[state.settingsTab]||setLogin)();
  lucide.createIcons();
}

function setNotifications(){
  const n = state.notif;
  const digest = ['daily','weekly','none'];
  const digestUI = `<div class="grid sm:grid-cols-3 gap-2">${digest.map(d=>`
    <div onclick="setDigest('${d}')" class="rcard ${n.digest===d?'sel':''} border border-slate-200 rounded-xl p-3 text-center">
      <p class="font-jakarta font-bold text-sm text-[#121A21] capitalize">${d}</p>
      <p class="text-[11px] text-slate-500 mt-0.5">${d==='daily'?'Every morning':d==='weekly'?'Monday digest':'No email digest'}</p>
    </div>`).join('')}</div>`;
  const events = [
    ['reply','New reply to your post',"When someone replies to your Ask, Win or Share"],
    ['mention','Mentions',"When a member @mentions you"],
    ['sectorAsk','New Ask in your sector',"Fresh Asks from your sector so you can help"],
    ['winConn','Win from a connection',"Celebrate milestones from people you know"],
    ['event','Event reminders',"Upcoming SME events and summit alerts"],
    ['suggested','New suggested connection',"When we find a founder worth meeting"]
  ];
  const body = `
    <div class="pb-5 mb-5 border-b border-slate-100">
      <h3 class="font-jakarta font-bold uppercase text-sm text-[#121A21] tracking-wide mb-1">Email digest</h3>
      <p class="text-xs text-slate-500 mb-3">Batched email summary — sent via Kit (ConvertKit), staggered to protect deliverability.</p>
      ${digestUI}
    </div>
    <h3 class="font-jakarta font-bold uppercase text-sm text-[#121A21] tracking-wide mb-1">In-app notifications</h3>
    <div class="divide-y divide-slate-100">
      ${events.map(([k,l,s])=>toggleRow(l,s,n[k],`toggleNotif('${k}')`)).join('')}
    </div>`;
  return settingsCard('Notifications', 'Choose what reaches you, and how.', body);
}
function setDigest(d){ state.notif.digest=d; renderSettingsContent(); showToast('Email digest: '+d+'.', null); }
function toggleNotif(k){ state.notif[k]=!state.notif[k]; renderSettingsContent(); }

/* ===================== SETTINGS · NEWSLETTER (SME Brief) ===================== */
// Same four editions as the public SME Brief archive (newsletter.html) — this tab is
// just that subscription, managed from inside the account instead of via an email link.
const NEWSLETTER_EDITIONS = [

function toggleNewsletterEdition(k){ state.newsletter[k]=!state.newsletter[k]; renderSettingsContent(); }

  NEWSLETTER_EDITIONS.forEach(([k])=> state.newsletter[k]=false);

function newsletterRow(k,label,day,sub){
  const on = state.newsletter[k];

    </div>

}
function setNewsletter(){
  const anyOn = NEWSLETTER_EDITIONS.some(([k])=>state.newsletter[k]);
  const rows = NEWSLETTER_EDITIONS.map(([k,label,day,sub])=>newsletterRow(k,label,day,sub)).join('');

function checkPw(){
  const a=document.getElementById('pw-new'), b=document.getElementById('pw-conf'), m=document.getElementById('pw-msg');
  if(!a||!b||!m) return;
  if(a.value && a.value.length<8){ m.textContent='New password must be at least 8 characters.'; m.className='text-xs text-[#DC183C]'; }
  else if(a.value && b.value && a.value!==b.value){ m.textContent='Passwords do not match.'; m.className='text-xs text-[#DC183C]'; }
  else if(a.value && a.value===b.value){ m.textContent='Passwords match.'; m.className='text-xs text-[#29A37A]'; }
  else { m.textContent=''; }
}

function toggleDevMode(){
  const on = document.body.classList.toggle('dev-on');
  const btn = document.getElementById('devToggle');
  if(btn) btn.classList.toggle('on', on);
  if(on) showToast('Dev Mode on — tap any ⓘ for implementation notes.', null);
  lucide.createIcons();
}
function closeOverlay(id){
  const el = document.getElementById(id); if(!el) return;
  el.classList.remove('open');
  setTimeout(()=>{ if(el && el.parentNode) el.remove(); }, 300);
}
function openBrief(id){
  const b = BRIEFS[id]; if(!b) return;
  const sec = (icon,label,html) => `
    <div class="px-6 py-4 border-t border-slate-100">
      <p class="text-[10px] font-bold uppercase tracking-widest text-[#DC183C] flex items-center gap-1.5 mb-2"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${label}</p>
      <div class="text-sm text-slate-600 leading-relaxed">${html}</div>
    </div>`;
  document.getElementById('overlay-root').innerHTML = `
    <div class="ov" id="ov-brief">
      <div class="ov-bg" onclick="closeOverlay('ov-brief')"></div>
      <div class="drawer">
        <div class="sticky top-0 z-10 bg-[#0C1F31] text-white px-6 py-5 flex items-start justify-between">
          <div class="min-w-0"><p class="text-[10px] font-bold uppercase tracking-widest text-[#FF9900] mb-1">Dev Brief</p><h3 class="font-jakarta font-extrabold text-lg leading-tight">${b.title}</h3><p class="text-xs text-white/60 mt-1">${b.sub}</p></div>
          <button onclick="closeOverlay('ov-brief')" class="text-white/60 hover:text-white shrink-0 ml-3"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        ${sec('target','Purpose', b.purpose)}
        ${sec('database','Data model', b.data)}
        ${sec('git-branch','Logic', b.logic)}
        ${b.specs ? sec('ruler','Spec values', b.specs) : ''}
        ${sec('boxes','Components', b.components)}
        <div class="px-6 py-4 border-t border-slate-100"><p class="text-[11px] text-slate-500 flex items-center gap-1.5"><i data-lucide="info" class="w-3.5 h-3.5"></i> Spec lives beside the feature — toggle Dev Mode off for the clean stakeholder view.</p></div>
      </div>
    </div>`;
  requestAnimationFrame(()=>{ const o=document.getElementById('ov-brief'); if(o) o.classList.add('open'); });
  lucide.createIcons();
}

/* ===================== TOAST ===================== */
function showToast(msg, kind){
  const el = document.getElementById('toast');
  const t = TYPES[kind]; const color = t ? t.color : '#0C1F31';
  el.classList.remove('hidden');
  el.innerHTML = `<div class="toast-in bg-[#0C1F31] text-white rounded-full pl-3 pr-5 py-2.5 shadow-2xl flex items-center gap-2 text-sm font-semibold" style="border-left:4px solid ${color}">
    <i data-lucide="check-circle" class="w-4 h-4" style="color:${color}"></i><span>${esc(msg)}</span></div>`;
  lucide.createIcons();
  setTimeout(()=>{ const inner=el.firstElementChild; if(inner){ inner.classList.remove('toast-in'); inner.classList.add('toast-out'); } setTimeout(()=>{ el.classList.add('hidden'); el.innerHTML=''; },250); }, 2400);
}

/* ===================== INIT ===================== */
document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.querySelectorAll('.ov.open').forEach(o=>closeOverlay(o.id)); });

/* Deep-link support: #funding, #profile, etc. — lets other pages (e.g. the member workspace) land straight on a settings tab */
(function(){
  var hashId = (location.hash || '').replace('#','');
  if(hashId && SETTINGS_NAV.some(function(s){ return s.id === hashId; })) state.settingsTab = hashId;
})();

renderSettingsNav();
renderSettingsContent();
lucide.createIcons();
  /* HEADER-SEARCH-JS */
  function toggleHeaderSearch(){
    var o=document.getElementById('headerSearchOverlay'); if(!o) return;
    var open=o.classList.toggle('active');
    var i=document.getElementById('headerSearchInput');
    if(open){ if(i) setTimeout(function(){ i.focus(); },100); } else if(i){ i.value=''; }
  }
  document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ var o=document.getElementById('headerSearchOverlay'); if(o&&o.classList.contains('active')) toggleHeaderSearch(); } });
</script>
