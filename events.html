<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Events &amp; Webinars — SME South Africa</title>
  <meta name="description" id="meta-desc" content="Explore upcoming and past SME South Africa events and webinars. Learn, network, and grow your business." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <script>tailwind.config={theme:{extend:{fontFamily:{jakarta:['Plus Jakarta Sans','sans-serif'],inter:['Inter','system-ui','sans-serif']}}}};</script>

  <style>
    html,body{font-family:'Inter',system-ui,sans-serif;} .font-jakarta{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:.005em;}
    *{ -webkit-tap-highlight-color: transparent; }
    .hero-bg{background:linear-gradient(115deg,#0C1F31 0%,#0C1F31 50%,#2b1626 80%,#5e1a2c 115%);}
    .dot-pattern{background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px);background-size:22px 22px;}
    .no-scrollbar::-webkit-scrollbar{ display:none; } .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }

    @keyframes fadeUp{ from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none} }
    .reveal{ opacity:0; animation:fadeUp .65s cubic-bezier(.2,.7,.2,1) forwards; }

    .dev-badge{display:none;} body.dev-on .dev-badge{display:inline-flex;} #devToggle.on{background:#DC183C;color:#fff;border-color:#DC183C;}
    .ov{position:fixed;inset:0;z-index:80;} .ov-bg{position:absolute;inset:0;background:rgba(12,31,49,.45);backdrop-filter:blur(2px);opacity:0;transition:opacity .3s;} .ov.open .ov-bg{opacity:1;}
    .drawer{position:absolute;right:0;top:0;height:100%;width:100%;max-width:440px;background:#fff;box-shadow:-12px 0 40px rgba(12,31,49,.25);overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.7,.2,1);} .ov.open .drawer{transform:translateX(0);}
  </style>
</head>
<body class="bg-[#FCFCFC] text-[#121A21] antialiased">
<header class="bg-slate-100 border-b-2 border-dashed border-slate-400 relative overflow-hidden">
  <div class="absolute inset-0 opacity-30 pointer-events-none" style="background:repeating-linear-gradient(45deg,transparent,transparent 8px,rgba(100,116,139,.18) 8px,rgba(100,116,139,.18) 16px)"></div>
  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center gap-3 sm:gap-4">
    <a href="public-home.html" class="flex items-center gap-2 shrink-0 opacity-70 hover:opacity-100 transition">
      <img src="assets/logo-icon.png" alt="SME South Africa" class="w-7 h-7" />
      <span class="font-jakarta font-extrabold text-[13px] tracking-tight text-slate-700 hidden sm:inline">SME South Africa</span>
    </a>
    <span class="mx-1 hidden sm:inline w-px h-5 bg-slate-300"></span>
    <p class="text-[10px] sm:text-[11px] font-bold uppercase tracking-widest text-slate-600 flex items-center gap-1.5">
      <i data-lucide="construction" class="w-3.5 h-3.5 text-slate-500"></i>
      Header placeholder &middot; design pending
    </p>
    <div class="ml-auto flex items-center gap-2">
      <button id="devToggle" onclick="toggleDevMode()" class="inline-flex items-center gap-1.5 px-2.5 h-8 rounded-full bg-white border border-slate-300 hover:border-[#DC183C] hover:text-[#DC183C] text-[11px] font-bold uppercase tracking-wider text-slate-600 transition" title="Toggle implementation notes"><i data-lucide="code-2" class="w-3.5 h-3.5"></i><span class="hidden sm:inline">Dev</span></button>
      <a href="index.html" class="inline-flex items-center gap-1.5 px-3 h-8 rounded-full bg-white border border-slate-300 hover:border-slate-500 text-[11px] font-bold text-slate-700 transition">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i><span class="hidden sm:inline">Launcher</span>
      </a>
    </div>
  </div>
</header>

<div id="app"></div>
<div id="overlay-root"></div>
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[90]"></div>

<footer class="bg-slate-100 border-t-2 border-dashed border-slate-400 relative overflow-hidden">
  <div class="absolute inset-0 opacity-30 pointer-events-none" style="background:repeating-linear-gradient(45deg,transparent,transparent 8px,rgba(100,116,139,.18) 8px,rgba(100,116,139,.18) 16px)"></div>
  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 py-6 text-center">
    <p class="text-[10px] sm:text-[11px] font-bold uppercase tracking-widest text-slate-600 flex items-center justify-center gap-1.5">
      <i data-lucide="construction" class="w-3.5 h-3.5 text-slate-500"></i>
      Footer placeholder &middot; design pending
    </p>
    <p class="text-[11px] text-slate-500 mt-2">&copy; 2026 SME South Africa</p>
  </div>
</footer>

  <script>
    const esc = (s)=> String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    function showToast(m){const el=document.getElementById('toast');el.classList.remove('hidden');el.innerHTML=`<div class="bg-[#0C1F31] text-white rounded-full pl-3 pr-5 py-2.5 shadow-2xl flex items-center gap-2 text-sm font-semibold" style="border-left:4px solid #29A37A"><i data-lucide="check-circle" class="w-4 h-4" style="color:#29A37A"></i><span>${esc(m)}</span></div>`;if(window.lucide)lucide.createIcons();setTimeout(()=>{el.classList.add('hidden');el.innerHTML='';},2400);}

    const PLACEHOLDER_IMAGE = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPSc2NDAnIGhlaWdodD0nNDAwJyB2aWV3Qm94PScwIDAgNjQwIDQwMCc+PHJlY3Qgd2lkdGg9JzY0MCcgaGVpZ2h0PSc0MDAnIGZpbGw9JyMwQzFGMzEnLz48ZyBmaWxsPSdub25lJyBzdHJva2U9JyM0NzY0NzInIHN0cm9rZS13aWR0aD0nNicgc3Ryb2tlLWxpbmVjYXA9J3JvdW5kJyBzdHJva2UtbGluZWpvaW49J3JvdW5kJz48cmVjdCB4PScyNTAnIHk9JzEzOCcgd2lkdGg9JzE0MCcgaGVpZ2h0PScxMDAnIHJ4PScxMCcvPjxjaXJjbGUgY3g9JzI5MicgY3k9JzE3NCcgcj0nMTMnLz48cGF0aCBkPSdNMjYyIDIzMGwzOC0zOCAzMCAzMCAyNi0yNiAyOCAyOCcvPjwvZz48L3N2Zz4=';
    const OE_IM = `onerror="this.onerror=null;this.src='${PLACEHOLDER_IMAGE}'"`;

    const TITLES = [
      'Annual SME Funding Gala 2026', 'How to Use Predictive Analytics to Forecast Growth', 'Alternate Channels To Achieve Business Growth', 'How to Create a Market Penetration Strategy',
      'Marketing Your Event Management Business', 'The Township Economy Playbook', 'Tax & Accounting Basics for 2027', 'Social Media Marketing for B2B',
      'Pitching to Venture Capitalists', 'Alternative Finance & Grant Options', 'Managing Cash Flow in a Downturn', 'Building a Remote Culture',
      'Mental Health for Startup Founders', 'B-BBEE Compliance Strategies', 'Legal Structuring for Early Startups', 'E-commerce Expansion Workshop'
    ];
    const IMAGES = [
      'https://images.unsplash.com/photo-1556761175-5973dc0f32e7', 'https://images.unsplash.com/photo-1551288049-bebda4e38f71',
      'https://images.unsplash.com/photo-1552664730-d307ca884978', 'https://images.unsplash.com/photo-1542744173-8e7e53415bb0',
      'https://images.unsplash.com/photo-1511795409834-ef04bbd61622', 'https://images.unsplash.com/photo-1600880292203-757bb62b4baf',
      'https://images.unsplash.com/photo-1554224155-6726b3ff858f', 'https://images.unsplash.com/photo-1611162617474-5b21e879e113',
      'https://images.unsplash.com/photo-1559523161-0fc0d8b38a7a', 'https://images.unsplash.com/photo-1553729459-efe14ef6055d',
      'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40', 'https://images.unsplash.com/photo-1522071820081-009f0129c71c',
      'https://images.unsplash.com/photo-1505373877841-8d25f7d46678', 'https://images.unsplash.com/photo-1450101499163-c8848c66ca85',
      'https://images.unsplash.com/photo-1589829085413-56de8ae18c73', 'https://images.unsplash.com/photo-1556742049-0cfed4f6a45d'
    ];
    const CATEGORIES = ['Funding & Investment', 'Tech & Innovation', 'Business Planning', 'Marketing & Sales', 'Operations', 'Strategy & Growth', 'Finance & Compliance', 'HR & People'];

    const MOCK_EVENTS = Array.from({length: 16}, (_, i) => ({
      id: i + 1,
      featured: i === 0,
      type: i % 3 === 0 ? 'IN-PERSON' : 'ONLINE',
      category: CATEGORIES[i % CATEGORIES.length],
      title: TITLES[i],
      description: 'Join industry experts to learn actionable strategies and frameworks designed specifically for South African small businesses ready to scale.',
      hero_image: IMAGES[i] + '?auto=format&fit=crop&q=80&w=600',
      logistics: {},
      venue: i % 3 === 0 ? { name:'Focus Rooms' } : { platform:'Zoom' },
      vault: {}
    }));

    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const fmtDate = (d)=> `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    const fmtTime = (d)=> {
      let h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0'), p=h>=12?'pm':'am';
      return `${h%12||12}:${m} ${p}`;
    };
    const atTime = (base,h,m)=>{ const d=new Date(base); d.setHours(h,m,0,0); return d; };

    function applyTimes(ev, start, end){
      ev.logistics.startMs = start.getTime();
      ev.logistics.endMs = end ? end.getTime() : null;
      ev.logistics.display_date = fmtDate(start);
      ev.logistics.display_time = end ? `${fmtTime(start)} - ${fmtTime(end)}` : 'Recording available';
    }

    function seedDemoDates(){
      const now = new Date();
      const plus = (days)=>{ const d=new Date(now); d.setDate(d.getDate()+days); return d; };
      MOCK_EVENTS.forEach((ev, i) => {
        if (i === 1) {
          // Currently LIVE — started 10 minutes ago, ends 90 minutes from now.
          const start = new Date(now.getTime() - 10*60000);
          const end   = new Date(now.getTime() + 90*60000);
          applyTimes(ev, start, end);
          return;
        }
        let d;
        if (i % 4 === 0) d = plus(-10 - i); // Past events
        else d = plus(5 + i*2);              // Upcoming events
        applyTimes(ev, atTime(d, 10, 0), atTime(d, 12, 0));
      });
    }

    function computeStatus(ev){
      const s = ev.logistics.startMs ?? null;
      const e = ev.logistics.endMs ?? (s ? s + 2*3600000 : null);
      const now = Date.now();
      if(s == null) return 'Past';
      if(now < s) return 'Upcoming';
      if(now >= s && now <= e) return 'LIVE NOW';
      return 'Past';
    }

    function eventDetailUrl(ev){
      return ev.type === 'IN-PERSON' ? 'event-single-in-person.html' : 'event-single-online.html';
    }

    let state = { view:'directory', params:{}, statusFilter:'All', typeFilter:'All', categoryFilter:'All', sort:'priority', search:'', page:1, perPage:12 };
    function setState(patch){ Object.assign(state, patch); renderApp(); }
    function goPage(p){ setState({page:p}); window.scrollTo({top:document.getElementById('feedTop').offsetTop-80,behavior:'smooth'}); }

    function statusChip(status){
      if(status==='LIVE NOW') return `<span class="px-3 py-1.5 rounded-full text-[10px] font-bold bg-[#DC183C] text-white shadow-lg inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-white animate-pulse"></span> LIVE NOW</span>`;
      if(status==='Upcoming') return `<span class="px-3 py-1.5 rounded-full text-[10px] font-bold bg-[#FF9900] text-[#0C1F31] shadow-lg uppercase tracking-wider">Upcoming</span>`;
      return '';
    }

    function chip(label, active, onclick){ return `<button onclick="${onclick}" class="shrink-0 px-4 py-2 rounded-full text-sm font-semibold border transition-colors ${active?'bg-[#DC183C] text-white border-[#DC183C]':'bg-white text-slate-600 border-[#E7EBEF] hover:bg-slate-50'}">${label}</button>`; }

    function statusWeight(s){ return s==='LIVE NOW' ? 0 : s==='Upcoming' ? 1 : 2; }
    function getFilteredEvents(){
      return MOCK_EVENTS.map(ev=> ({ ev, status:computeStatus(ev) }))
        .filter(({ev,status})=>{
          if(state.statusFilter!=='All' && status!==state.statusFilter) return false;
          if(state.typeFilter!=='All' && ev.type!==state.typeFilter) return false;
          if(state.categoryFilter!=='All' && ev.category!==state.categoryFilter) return false;
          if(state.search && !(`${ev.title} ${ev.description} ${ev.category}`.toLowerCase().includes(state.search.toLowerCase()))) return false;
          return true;
        })
        .sort((a,b)=>{
          // Default: LIVE NOW first, then Upcoming (soonest first), then Past (most recent first)
          const wa = statusWeight(a.status), wb = statusWeight(b.status);
          if(wa !== wb) return wa - wb;
          const am=a.ev.logistics.startMs||0, bm=b.ev.logistics.startMs||0;
          // Within Past bucket flip to descending — most recent past first
          if(a.status==='Past') return bm - am;
          return am - bm;
        });
    }

    function emptyState(){
      return `<div class="reveal bg-white border border-dashed border-[#E7EBEF] rounded-2xl py-16 px-6 text-center col-span-full">
        <div class="w-16 h-16 mx-auto rounded-full bg-slate-100 grid place-items-center mb-5"><i data-lucide="calendar-x" class="w-7 h-7 text-slate-400"></i></div>
        <h3 class="font-jakarta text-2xl font-extrabold text-[#0C1F31] mb-2">No events match your filters</h3>
        <p class="text-slate-500 max-w-sm mx-auto mb-6">Try widening your search or clearing the filters to see everything we have on.</p>
        <button onclick="setState({statusFilter:'All',typeFilter:'All',categoryFilter:'All',search:''})" class="bg-[#DC183C] hover:bg-[#B0142F] text-white font-bold px-6 py-3 rounded-xl transition-colors">Clear all filters</button>
      </div>`;
    }

    function renderDirectory(){
      const allList = getFilteredEvents();
      const totalPages = Math.max(1, Math.ceil(allList.length / state.perPage));
      if(state.page > totalPages) state.page = 1;
      const startIdx = (state.page-1) * state.perPage;
      const list = allList.slice(startIdx, startIdx + state.perPage);
      const grid = list.length ? `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
        ${list.map(({ev,status}, i)=>`
          <article class="reveal bg-white rounded-2xl shadow-sm border border-[#E7EBEF] overflow-hidden relative flex flex-col hover:shadow-xl hover:-translate-y-1 transition-all duration-300 group" style="animation-delay:${(i%16)*40}ms">
            <div class="h-56 bg-[#0C1F31] relative overflow-hidden">
              <img src="${ev.hero_image}" ${OE_IM} alt="${ev.title}" class="w-full h-full object-cover opacity-90 group-hover:scale-105 transition-all duration-500" />
              <div class="absolute top-3 left-3 z-10 flex items-center gap-2">
                <span class="px-3 py-1 rounded-full text-[11px] font-bold bg-[#FDECEF] text-[#DC183C] shadow-sm">${ev.category}</span>
                ${statusChip(status)}
              </div>
            </div>
            <div class="p-5 flex-1 flex flex-col">
              <div class="flex justify-between items-center mb-3">
                <span class="text-slate-500 font-bold text-xs tracking-widest inline-flex items-center gap-1.5"><i data-lucide="${ev.type==='IN-PERSON'?'map-pin':'video'}" class="w-3.5 h-3.5"></i> ${ev.type}</span>
              </div>
              <h3 class="text-lg font-jakarta font-extrabold text-[#0C1F31] leading-tight mb-2 group-hover:text-[#DC183C] transition-colors">${ev.title}</h3>
              <p class="text-slate-500 text-sm leading-relaxed line-clamp-3 mb-6 flex-1">${ev.description}</p>
              <div class="mt-auto">
                <p class="font-extrabold text-[#121A21] text-sm mb-4">${ev.logistics.display_date} • ${ev.logistics.display_time}</p>
                <a href="${eventDetailUrl(ev)}" class="w-full inline-flex items-center justify-center bg-[#0C1F31] hover:bg-[#091621] text-white font-bold text-sm py-3 rounded-xl transition-colors shadow-sm">Learn more</a>
              </div>
            </div>
          </article>`).join('')}
      </div>

      ${list.length > 0 ? `
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-8 mt-8 border-t border-[#E7EBEF]">
        <span class="text-sm text-slate-500 font-medium">Showing <b class="text-[#121A21]">${startIdx+1}–${startIdx+list.length}</b> of ${allList.length} events</span>
        <div class="flex items-center gap-2">
          <button ${state.page===1?'disabled':''} onclick="goPage(${state.page-1})" class="w-10 h-10 rounded-lg border border-[#E7EBEF] ${state.page===1?'text-slate-300 cursor-not-allowed':'text-slate-600 hover:bg-slate-50'} grid place-items-center transition"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
          ${Array.from({length: totalPages}, (_, i)=>{
            const p = i+1;
            return `<button onclick="goPage(${p})" class="w-10 h-10 rounded-lg ${p===state.page?'bg-[#DC183C] text-white':'border border-[#E7EBEF] text-slate-600 hover:bg-slate-50'} font-bold text-sm shadow-sm transition">${p}</button>`;
          }).join('')}
          <button ${state.page===totalPages?'disabled':''} onclick="goPage(${state.page+1})" class="w-10 h-10 rounded-lg border border-[#E7EBEF] ${state.page===totalPages?'text-slate-300 cursor-not-allowed':'text-slate-600 hover:bg-slate-50'} grid place-items-center transition"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
        </div>
      </div>` : ''}
      ` : emptyState();

      return `
      <section class="hero-bg text-white relative overflow-hidden">
        <div class="absolute inset-0 dot-pattern opacity-70 pointer-events-none"></div>
        <div class="max-w-[1200px] mx-auto px-4 sm:px-6 py-14 relative">
          <nav aria-label="Breadcrumb" class="text-xs text-white/55 flex items-center flex-wrap gap-x-1.5 mb-4"><a href="public-home.html" class="hover:text-white transition">Home</a><span class="text-white/30">›</span><span class="text-white/85 font-medium truncate">Events</span></nav>
          <h1 class="font-jakarta font-extrabold text-3xl sm:text-5xl mt-1 tracking-tight">Learn, network &amp; grow <button onclick="openBrief()" class="dev-badge align-middle ml-1 w-6 h-6 rounded-full bg-[#FF9900] text-[#0C1F31] items-center justify-center text-[11px] font-bold">i</button></h1>
          <p class="mt-3 text-white/70 max-w-2xl text-lg">Explore our upcoming and past events. Join in-person summits, live webinars and on-demand replays built for South African SMEs.</p>
        </div>
      </section>

      <main id="feedTop" class="max-w-[1200px] mx-auto px-4 sm:px-6 py-8 md:py-12">
        <div class="reveal bg-white rounded-2xl shadow-sm border border-[#E7EBEF] p-4 sm:p-5 mb-8" style="animation-delay:120ms">
          <div class="flex flex-col gap-4">
            <div class="flex flex-col lg:flex-row lg:items-center gap-4">
              <div class="flex items-center gap-2 overflow-x-auto no-scrollbar -mx-1 px-1">
                <span class="shrink-0 text-xs font-bold text-slate-400 uppercase tracking-wide pr-1">Type</span>
                ${['All','ONLINE','IN-PERSON'].map(t=>chip(t, state.typeFilter===t, `setState({typeFilter:'${t}',page:1})`)).join('')}
              </div>
              <div class="hidden lg:block w-px h-7 bg-[#E7EBEF]"></div>
              <div class="flex items-center gap-2 lg:ml-auto">
                <div class="relative flex-1 lg:flex-initial lg:w-56"><i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i><input id="searchInput" type="text" placeholder="Search events…" value="${esc(state.search)}" oninput="state.search=this.value; state.page=1; renderApp();" class="w-full pl-9 pr-3 py-2.5 rounded-lg border border-[#E7EBEF] text-sm bg-slate-50 outline-none focus:border-[#DC183C]" /></div>
                <button onclick="setState({typeFilter:'All',categoryFilter:'All',search:'',page:1})" aria-label="Reset filters" class="shrink-0 w-11 h-11 grid place-items-center rounded-lg text-slate-500 bg-white border border-[#E7EBEF] hover:bg-slate-50"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></button>
              </div>
            </div>
            <div class="border-t border-[#E7EBEF] pt-3 flex items-center gap-2 overflow-x-auto no-scrollbar -mx-1 px-1">
              <span class="shrink-0 text-xs font-bold text-slate-400 uppercase tracking-wide pr-1">Topic</span>
              ${['All',...CATEGORIES].map(c=>chip(c, state.categoryFilter===c, `setState({categoryFilter:'${c.replace(/'/g,"\\'")}',page:1})`)).join('')}
            </div>
          </div>
        </div>

        ${grid}
      </main>`;
    }

    function renderApp(){
      const app = document.getElementById('app');
      app.innerHTML = renderDirectory();
      if(window.lucide) lucide.createIcons();
    }

    const BRIEF = {
      title:'Events &amp; Webinars (Archive)',
      sub:'WordPress CPT — <code>event</code>',
      purpose:'Public archive of upcoming, live and past events (in-person summits + online webinars). Feed grid + filters + search + 12/page pagination. Filterable by <b>type</b> (Online / In-Person) and by <b>topic</b> (8 categories). Default sort: <b>LIVE NOW → Upcoming (soonest first) → Past (most recent first)</b>. Presentations and photo galleries live inside each event page — no standalone library template.',
      data:'Event (CPT <code>event</code>): <code>{ post_title, post_name, post_excerpt, meta_type ("IN-PERSON"|"ONLINE"), meta_start (datetime), meta_end (datetime), meta_venue (name/address for IN-PERSON) or meta_platform ("Zoom"/"Teams"…), taxonomy_category, meta_hero_image, meta_featured (bool) }</code>. Status computed at render — Upcoming / LIVE NOW / Past.',
      logic:'Archive template = <code>archive-event.php</code>. Query all published events, sort featured→date-asc. Filter chips (type, category), search string. "Learn more" routes to <code>event-single-in-person.html</code> or <code>event-single-online.html</code> based on <code>meta_type</code>. Past-event replays and photo galleries are separate templates — see BRIEFs in those files.',
      components:'hero + breadcrumb · filter/search bar (type chips row + topic chips row + search + reset) · event card grid (image + category chip + status chip + type + title + date/time + Learn more) · pagination · empty state.',
      specs:'<b>Hero:</b> hero-bg gradient, max-w-[1200px], py-14. H1 Plus Jakarta 800, 30/48px, leading-tight. Sub 18px white/70.<br/><b>Filter bar:</b> rounded-2xl border #E7EBEF p-5. Chips h-9 px-4 rounded-full, active #DC183C white, inactive white/slate-500 border #E7EBEF. Search input h-11 pl-9 pr-3 rounded-lg bg slate-50 border #E7EBEF, focus border #DC183C.<br/><b>Event card:</b> rounded-2xl border #E7EBEF shadow-sm; hover shadow-xl + translateY(-4px). Image 224px cover, category chip absolute top-3 left-3 (#FDECEF/#DC183C). Type row 12px uppercase slate-500 with map-pin/video icon. Title Plus Jakarta 800 18px #0C1F31 hover #DC183C. Description slate-500 line-clamp-3. Date/time weight 800 14px #121A21. CTA h-12 rounded-xl #0C1F31 hover #091621.<br/><b>Past-events band:</b> 2-col md, rounded-2xl border #E7EBEF p-6. 48&times;48 rounded-xl icon tile. Eyebrow 10px uppercase (#DC183C or #AE6B0A) + title 18px 800 + description slate-500.'
    };

    function toggleDevMode(){const on=document.body.classList.toggle('dev-on');const b=document.getElementById('devToggle');if(b)b.classList.toggle('on',on);if(on)showToast('Dev Mode on — tap ⓘ for the BRIEF.');if(window.lucide)lucide.createIcons();}
    function closeOverlay(id){const el=document.getElementById(id);if(!el)return;el.classList.remove('open');setTimeout(()=>{if(el&&el.parentNode)el.remove();},300);}
    function openBrief(){
      const b=BRIEF;
      const sec=(i,l,h)=>`<div class="px-6 py-4 border-t border-slate-100"><p class="text-[10px] font-bold uppercase tracking-widest text-[#DC183C] flex items-center gap-1.5 mb-2"><i data-lucide="${i}" class="w-3.5 h-3.5"></i>${l}</p><div class="text-sm text-slate-600 leading-relaxed">${h}</div></div>`;
      document.getElementById('overlay-root').innerHTML=`<div class="ov" id="ov"><div class="ov-bg" onclick="closeOverlay('ov')"></div><div class="drawer"><div class="sticky top-0 z-10 bg-[#0C1F31] text-white px-6 py-5 flex items-start justify-between"><div><p class="text-[10px] font-bold uppercase tracking-widest text-[#FF9900] mb-1">Dev Brief</p><h3 class="font-jakarta font-extrabold text-lg leading-tight">${b.title}</h3><p class="text-xs text-white/60 mt-1">${b.sub}</p></div><button onclick="closeOverlay('ov')" class="text-white/60 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>${sec('target','Purpose',b.purpose)}${sec('database','Data model',b.data)}${sec('git-branch','Logic',b.logic)}${sec('boxes','Components',b.components)}${sec('ruler','Spec values',b.specs)}</div></div>`;
      requestAnimationFrame(()=>{const o=document.getElementById('ov');if(o)o.classList.add('open');});
      if(window.lucide)lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', ()=>{
      seedDemoDates();
      renderApp();
    });
  </script>
</body>
</html>
