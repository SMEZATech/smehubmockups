    { id: 'FA-4830', date: '25 Sep', biz: 'Kopano Catering', who: 'Kopano Rapoo', email: 'kopano@kopanocatering.co.za', phone: '071 330 8841', ind: 'Food service', prov: 'Free State', turn: 'R250k - R1M', yrs: 'Under 1 year', type: 'Working capital', reg: '2025/118834/07', amt: 120000, partner: 'Retail Capital', status: 'Declined', age: 12, pq: 0, sent: { retail: '26 Sep' } },
    { id: 'FA-4838', date: '29 Sep', biz: 'Zinhle Print & Pack', who: 'Zinhle Ndlovu', email: 'zinhle@zinhleprint.co.za', phone: '083 551 0027', ind: 'Manufacturing', prov: 'KwaZulu-Natal', turn: 'R1M - R5M', yrs: '3-5 years', type: 'Equipment finance', reg: '2021/220145/07', amt: 480000, partner: 'Retail + Mzansi', status: 'In Review', age: 6, pq: 1, sent: { retail: '30 Sep', mzansi: '30 Sep' } },
    { id: 'FA-4841', date: '30 Sep', biz: 'Mokoena Logistics', who: 'Thabo Mokoena', email: 'thabo@mokoenalogistics.co.za', phone: '076 902 1188', ind: 'Transport', prov: 'Gauteng', turn: 'R5M - R10M', yrs: '5+ years', type: 'Asset finance', reg: '2016/091772/07', amt: 900000, partner: 'Mzansi Capital', status: 'On Hold', age: 5, pq: 1, sent: { mzansi: '1 Oct' } },
    { id: 'FA-4849', date: '1 Oct', biz: 'Naledi Beauty Studio', who: 'Naledi Khumalo', email: 'naledi@nalediglow.co.za', phone: '060 774 3310', ind: 'Beauty', prov: 'Western Cape', turn: 'Under R250k', yrs: '1-2 years', type: 'Working capital', reg: '2024/330901/07', amt: 85000, partner: '-', status: 'Pending', age: 4, pq: 0, sent: {} },
    { id: 'FA-4853', date: '1 Oct', biz: 'Thandi Bakery Collective', who: 'Thandi Zulu', email: 'thandi@thandibakes.co.za', phone: '072 665 9012', ind: 'Food service', prov: 'Eastern Cape', turn: 'R250k - R1M', yrs: '2-3 years', type: 'Working capital', reg: '2022/145220/07', amt: 150000, partner: 'Lula', status: 'In Review', age: 4, pq: 1, sent: { lula: '2 Oct' } },
    { id: 'FA-4857', date: '2 Oct', biz: 'Ubuntu Tech Repairs', who: 'Sipho Dube', email: 'sipho@ubunturepairs.co.za', phone: '084 220 6671', ind: 'Services', prov: 'Gauteng', turn: 'Under R250k', yrs: '1-2 years', type: 'Business loan', reg: '2024/009118/07', amt: 60000, partner: '-', status: 'Pending', age: 3, pq: 0, sent: {} },
    { id: 'FA-4862', date: '2 Oct', biz: 'Karoo Farm Supplies', who: 'Hendrik van Wyk', email: 'hendrik@karoofarm.co.za', phone: '079 441 2005', ind: 'Agriculture', prov: 'Northern Cape', turn: 'R5M - R10M', yrs: '5+ years', type: 'Invoice finance', reg: '2012/331870/07', amt: 700000, partner: 'Retail Capital', status: 'In Review', age: 3, pq: 1, sent: { retail: '3 Oct' } },
    { id: 'FA-4866', date: '3 Oct', biz: 'Dlamini Civils', who: 'Bheki Dlamini', email: 'bheki@dlaminicivils.co.za', phone: '081 330 4417', ind: 'Construction', prov: 'Mpumalanga', turn: 'R10M+', yrs: '5+ years', type: 'Asset finance', reg: '2014/228340/07', amt: 1200000, partner: '-', status: 'Pending', age: 2, pq: 1, sent: {} },
    { id: 'FA-4870', date: '3 Oct', biz: "Jabu's Barber Co", who: 'Jabulani Sithole', email: 'jabu@jabusbarber.co.za', phone: '063 118 9902', ind: 'Beauty', prov: 'Gauteng', turn: 'Under R250k', yrs: 'Under 1 year', type: 'Working capital', reg: '2025/221093/07', amt: 45000, partner: '-', status: 'Not Yet Eligible', age: 2, pq: 0, sent: {} },
    { id: 'FA-4874', date: '4 Oct', biz: 'Pretoria Pet Provisions', who: 'Annelie Botha', email: 'annelie@pretoriapets.co.za', phone: '082 770 1156', ind: 'Retail', prov: 'Gauteng', turn: 'R1M - R5M', yrs: '3-5 years', type: 'Working capital', reg: '2020/120987/07', amt: 220000, partner: 'Retail Capital', status: 'Approved', age: 1, pq: 1, sent: { retail: '4 Oct' } },
    { id: 'FA-4879', date: '4 Oct', biz: 'Soweto Solar Installs', who: 'Lerato Molefe', email: 'lerato@sowetosolar.co.za', phone: '078 330 6120', ind: 'Energy', prov: 'Gauteng', turn: 'R1M - R5M', yrs: '2-3 years', type: 'Equipment finance', reg: '2022/301166/07', amt: 640000, partner: '-', status: 'Pending', age: 1, pq: 1, sent: {} },
    { id: 'FA-4881', date: '4 Oct', biz: 'Cape Coast Coffee', who: 'Marcus Adams', email: 'marcus@capecoastcoffee.co.za', phone: '073 884 2299', ind: 'Food service', prov: 'Western Cape', turn: 'R250k - R1M', yrs: '1-2 years', type: 'Working capital', reg: '2024/188402/07', amt: 95000, partner: 'Bridgement', status: 'Declined', age: 1, pq: 0, sent: { bridgement: '4 Oct' } },
    { id: 'FA-4884', date: 'Today', biz: 'Tshwane Tutors', who: 'Palesa Mahlangu', email: 'palesa@tshwanetutors.co.za', phone: '061 905 1143', ind: 'Education', prov: 'Gauteng', turn: 'Under R250k', yrs: '1-2 years', type: 'Business loan', reg: '2024/077120/07', amt: 70000, partner: '-', status: 'Pending', age: 0, pq: 0, sent: {} }
  ];
  var appByid = {}; apps.forEach(function (a) { appByid[a.id] = a; });
  var st = function (s) { return MC.chip(s, STATUS[s] || '', true); };
  var pq = function (a) { return a.pq ? MC.chip('Pre-qualified', 'green') : MC.chip('Not yet', ''); };

  /* ---------- briefs ---------- */
  B.f_desk = { title: 'Funding Desk', purpose: 'The VIP screen. A working queue where every funding application is reviewed, given a status and routed to a partner in one click. Mirrors the live Desk (tshepho-ops-suite, Funding_Desk module) so nothing the owner uses today goes missing.',
    data: ['CPT <code>funding-applications</code>; status in meta <code>fa_application_status</code>. The status list is every distinct value found in the data (excluding "Partner Referral"), falling back to New, In Review, Approved, Declined, On Hold.', 'Closed statuses: Approved, Declined, Closed, Not Yet Eligible. Anything else counts as open.', 'Partner sends are recorded per application: <code>fa_sent_retail_capital</code>, <code>fa_sent_mzansi_capital</code>, <code>fa_sent_lula</code>, <code>fa_sent_bridgement</code> (also <code>fa_sent_genfin</code>, <code>fa_sent_sourcefin</code> for reports).', 'Columns: Date, Applicant, Contact, Turnover, Years, Funding Type, Status, Route by default; Funding Amount and Registration Number optional. Choice stored in option <code>smesa_fd_columns_visible</code>.'],
    logic: ['<b>Route buttons per row:</b> Send to Retail + Mzansi (both sheets in one click), Send to Retail Capital, Send to Mzansi Capital, Send Lula referral, Send Bridgement referral, Delete (moves to Trash). Each shows "Re-send" once sent and records who/when in the row message (Retail: sent 3 Oct, Mzansi: sent 3 Oct, Lula: sent ...).', '<b>Retail Capital and Mzansi Capital</b> are sheet routes: the mapped row is POSTed to a Google Apps Script web-app URL bound to the partner\'s online sheet (302-redirect-to-content-URL pattern). Mzansi additionally carries Funding Amount and Lead Status and has no bank-statement column.', '<b>Lula and Bridgement</b> are referral-only: a branded email goes to the applicant with the affiliate link (Bridgement via <code>/go/bridgement/?s=desk</code>). No client data is passed to them. These two buttons are disabled while applicant emails are switched off.', '<b>Genfin and Sourcefin</b> are not routed from the Desk (low volume, high requirements) but are tracked in reports and the Weekly Outcome Review.', '<b>Bulk:</b> tick rows or Select all shown, then Apply status, Send selected to Retail Capital, Send selected to Mzansi Capital (server endpoint exists), Email selected Lula referral. Capped per request; the UI loops for the rest.', '<b>Status change</b> writes the meta and clears the post cache so Uncanny Automator recipes fire: Approved sends the approval email, Declined sends the decline email.', '<b>Stale view:</b> open applications with no status change or partner send for 14, 30, 60 or 90+ days, oldest first, filterable by "Sent to ..." partner. It never contacts anyone.', '<b>Update from a partner report:</b> paste up to 500 lines (email, registration number, phone or #application number), set one status and an optional decision date, preview matches, apply in chunks of 50. Emails stay off unless ticked.', '<b>Quiet mode:</b> switch applicant emails off for 2 hours while doing bulk updates from a partner report.'],
    components: 'Sticky bulk toolbar, row route cluster, inline status select, column picker, partner settings, paste-a-report panel, quiet-mode bar, stale view with partner chips, optional pipeline view.',
    api: 'admin-ajax actions: <code>smesa_funding_send_retail</code>, <code>..._send_mzansi</code>, <code>..._send_both</code>, <code>..._send_lula</code>, <code>..._send_bridgement</code>, bulk variants, status set, columns save, settings save. Nonce and manage_options on every call.', rules: 'Funding approvals are manual: nothing here automates, reconciles or chases partners. Confirm before every send ("Upload this lead to Retail Capital\'s sheet?"). Production only: partner URLs and secrets never exist on a local clone.' };
  B.f_ledger = { title: 'Applications & Outcomes', purpose: 'The single place to set a status and outcome for any lead, searchable and sortable.', data: 'Same records as the Desk. Outcome fields: approved amount, decision date, decline reason.', logic: 'Inline status change writes immediately and logs who/when. Export respects the active filters.', components: 'Data table with search, status and partner filters, row drawer.' };
  B.f_chase = { title: 'Weekly Outcome Review', purpose: 'A manual weekly review of applications sent to a partner more than 7 days ago with no outcome recorded. Nothing here emails partners or applicants.', data: '<code>smesa_oc_stale_counts()</code> per partner; stale = status With partner and sent_at older than 7 days.', logic: 'Export a CSV per partner, email it to them, they fill Outcome + amount + date and send it back, then update inline. When the list is empty the loop is closed.', rules: 'Funding approvals are manual, never automated or chased by the platform.' };
  B.f_declines = { title: 'Declines', purpose: 'Why are applicants being declined, and is any of it fixable upstream (better pre-qualification, better routing)?', data: 'Decline reason captured at outcome time; grouped by partner and industry.', logic: 'Top reasons ranked by count; "fixable" reasons (docs, trading history) feed the Front Door copy and the nudge emails.' };
  B.f_front = { title: 'Front Door', purpose: 'The public funding entry flow, as a funnel: where do visitors drop out before they become an application?', data: 'Step events from the funding form plus GTM events; conversion per step.', logic: 'Routing rules decide which partner sees which applicant (amount, industry, trading months).', components: 'Funnel, routing rule list.' };
  B.f_lula = { title: 'Lula Pre-Qual', purpose: 'Applicants Lula has already matched on bureau data, so they can be routed with confidence.', data: '<code>wp_smesa_lula_pq</code>: email hash, matched flag, score band, checked_at.', rules: 'Outbound Lula API calls only on production. Never run on a local clone.' };
  B.f_docreq = { title: 'Request Documents', purpose: 'Ask an applicant for the exact documents a partner needs, with a secure upload link, in one click.', logic: 'Checklist drives the email body. Link expires in 7 days. Status moves to Docs requested.', components: 'Composer with checklist, live email preview, sent requests table.', api: 'Email goes through wp_mail and the Comms Governor.' };
  B.f_share = { title: 'Statement Share', purpose: 'Send a bank statement to a partner securely: one-time link, expiry, access log. Replaces emailing PDFs.', data: 'Secure link record: token hash, expires_at, downloads, partner.', rules: 'Never attach statements to email. Links are single-use by default.' };
  B.f_vault = { title: 'Statement Vault', purpose: 'Encrypted storage for statements received, with retention and a visible access log.', data: 'Files stored outside the web root, AES-256; metadata in <code>wp_smesa_statement_vault</code>.', rules: 'POPIA: auto-delete after the retention period; every view is logged.' };
  B.f_aff = { title: 'Affiliate Tracking', purpose: 'Which referrers send applications that actually get approved?', data: 'Referral source captured at form submit, joined to final outcome.', logic: 'Ranked by approved value, not clicks.' };
  B.f_nudge = { title: 'Complete-application Nudge', purpose: 'Bring back applicants who started and did not finish.', logic: 'Two emails at 24 hours and 5 days, then stop. Respects the lifecycle cap and the Comms Governor.', api: 'Cron every 15 minutes; staggered sends only.' };
  B.f_money = { title: 'Commission', purpose: 'The money ledger: commission earned on approved applications, invoiced and paid.', data: '<code>smesa_ce_unbilled()</code> and the commission ledger table.', logic: 'Earned when a partner confirms an approval; invoiced monthly; paid when matched to a bank line.' };
  B.f_rec = { title: 'Recurring Funding', purpose: 'Businesses that have funded before are the cheapest next deal. This tracks renewal windows.', logic: 'Renewal window opens at 70% of term; owner sees who to approach and when.' };

  /* ---------- drawers ---------- */
  var appDrawer = function (a) {
    return { title: a.biz, sub: a.id + ' &middot; ' + a.who,
      html: '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">' + st(a.status) + pq(a) + MC.chip(R(a.amt), 'navy') + '</div>' +
        '<dl class="kv"><dt>Industry</dt><dd>' + a.ind + '</dd><dt>Province</dt><dd>' + a.prov + '</dd><dt>Amount asked</dt><dd>' + R(a.amt) + '</dd><dt>Partner</dt><dd>' + a.partner + '</dd><dt>Waiting</dt><dd>' + a.age + ' days</dd></dl>' +
        '<div class="sec-h" style="margin-top:26px">Timeline</div><div class="tl"><div><b>Application received</b><small>' + a.age + ' days ago &middot; via funding hub</small></div><div><b>Bureau pre-check</b><small>' + (a.pq ? 'Lula matched, band B' : 'No match yet') + '</small></div><div><b>Documents</b><small>Bank statements 3 of 6 months</small></div></div>' +
        '<div class="sec-h">Actions</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri sm" data-act="Routed to partner" data-ico="send">' + MC.icon('send') + 'Route to partner</button><button class="btn sm" data-act="Document request drafted" data-ico="file-text">' + MC.icon('file-text') + 'Request docs</button><button class="btn sm" data-act="Outcome form opened" data-ico="check-check">' + MC.icon('check-check') + 'Record outcome</button></div>' };
  };
  MC._dr.app = function () { return appDrawer(appByid[window.__app]); };
  window.openApp = function (id) { window.__app = id; var d = appDrawer(appByid[id]); MC.drawer(d.title, d.sub, d.html); };

  /* ---------- panels ---------- */
  var cols = ['Pending', 'In Review', 'On Hold', 'Approved', 'Declined'];
  var kcard = function (a) { return '<div class="kcard" onclick="openApp(\'' + a.id + '\')"><b>' + MC.esc(a.biz) + '</b><small>' + a.type + ' &middot; ' + a.prov + '</small><div class="row"><b style="font-family:Plus Jakarta Sans">' + R(a.amt) + '</b>' + (a.pq ? MC.chip('Lula pre-qual', 'green') : '') + '</div><div class="row"><small>' + (a.partner === '-' ? 'Not routed' : a.partner) + '</small><small>' + (a.age ? a.age + 'd waiting' : 'Today') + '</small></div></div>'; };

  /* ----- the live Funding Desk: columns, route buttons, bulk, stale view, paste report, quiet mode ----- */
  var DCOLS = [['date', 'Date', 1], ['applicant', 'Applicant', 1], ['contact', 'Contact', 1], ['turnover', 'Turnover', 1], ['years', 'Years', 1], ['type', 'Funding Type', 1], ['status', 'Status', 1], ['route', 'Route', 1], ['amount', 'Funding Amount', 0], ['reg', 'Registration Number', 0]];
  var deskCell = {
    date: function (a) { return a.date; },
    applicant: function (a) { return '<b>' + MC.esc(a.who) + '</b><br><small style="color:var(--muted)">' + MC.esc(a.biz) + '</small>'; },
    contact: function (a) { return MC.esc(a.email) + '<br><small style="color:var(--muted)">' + a.phone + '</small>'; },
    turnover: function (a) { return a.turn; }, years: function (a) { return a.yrs; }, type: function (a) { return a.type; },
    status: function (a) { return '<select class="sel fd-status" style="height:34px;min-width:116px">' + Object.keys(STATUS).map(function (o) { return '<option' + (o === a.status ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select>'; },
    route: function (a) {
      var s = a.sent, both = s.retail && s.mzansi, parts = [];
      if (s.retail) { parts.push('Retail: sent ' + s.retail); } if (s.mzansi) { parts.push('Mzansi: sent ' + s.mzansi); } if (s.lula) { parts.push('Lula: sent ' + s.lula); } if (s.bridgement) { parts.push('Bridgement: sent ' + s.bridgement); }
      return '<div class="fd-route" data-id="' + a.id + '"><button type="button" class="btn sm pri" data-r="both">' + (both ? 'Re-send to both' : 'Send to Retail + Mzansi') + '</button> <button type="button" class="btn sm" data-r="retail">' + (s.retail ? 'Re-send to Retail Capital' : 'Send to Retail Capital') + '</button> <button type="button" class="btn sm" data-r="mzansi">' + (s.mzansi ? 'Re-send to Mzansi Capital' : 'Send to Mzansi Capital') + '</button> <button type="button" class="btn sm fd-mail" data-r="lula">' + (s.lula ? 'Re-send Lula referral' : 'Send Lula referral') + '</button> <button type="button" class="btn sm fd-mail" data-r="bridgement">' + (s.bridgement ? 'Re-send Bridgement referral' : 'Send Bridgement referral') + '</button> <button type="button" class="fd-del" data-r="delete">&times; Delete</button><div class="fd-msg">' + parts.join(' &middot; ') + '</div></div>';
    },
    amount: function (a) { return R(a.amt); }, reg: function (a) { return '<span style="font-family:ui-monospace,Menlo,monospace;font-size:12px">' + a.reg + '</span>'; }
  };
  var STALE = apps.filter(function (a) { return ['Approved', 'Declined', 'Closed', 'Not Yet Eligible'].indexOf(a.status) < 0 && a.age >= 3; });
  var statusOpts = Object.keys(STATUS).map(function (o) { return '<option>' + o + '</option>'; }).join('');
  var deskTable = function () {
    return '<div class="card" style="margin-bottom:16px"><div class="fd-bar">' +
      '<label class="fd-chk"><input type="checkbox" id="fd-all"> Select all shown</label><span id="fd-count" class="fd-count">0 selected</span><span style="flex:1"></span>' +
      '<label class="fd-lab">Bulk set status: <select class="sel" id="fd-bs" style="height:34px"><option value="">&mdash; choose &mdash;</option>' + statusOpts + '</select></label>' +
      '<button class="btn sm" id="fd-bsa" disabled>Apply status</button><button class="btn sm dark" id="fd-bretail" disabled>Send selected to Retail Capital</button><button class="btn sm dark" id="fd-bmz" disabled>Send selected to Mzansi Capital</button><button class="btn sm fd-mail" id="fd-blula" disabled>Email selected Lula referral</button></div>' +
      '<div class="twrap" style="margin-top:0"><table class="t" id="fd-table"><thead><tr><th style="width:36px"></th>' + DCOLS.map(function (c) { return '<th data-col="' + c[0] + '"' + (c[2] ? '' : ' hidden') + '>' + c[1] + '</th>'; }).join('') + '</tr></thead><tbody>' +
      apps.map(function (a) { return '<tr data-id="' + a.id + '" data-stale="' + (STALE.indexOf(a) >= 0 ? 1 : 0) + '" data-s="' + (a.biz + ' ' + a.who + ' ' + a.email + ' ' + a.phone + ' ' + a.reg + ' ' + a.id).toLowerCase() + '" data-status="' + a.status + '"><td><input type="checkbox" class="fd-pick" aria-label="Select ' + MC.esc(a.biz) + '"></td>' + DCOLS.map(function (c) { return '<td data-col="' + c[0] + '"' + (c[2] ? '' : ' hidden') + '>' + deskCell[c[0]](a) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div><div class="tfoot"><span id="fd-shown">Showing ' + apps.length + ' of 73 applications</span><div class="pager"><button class="on">1</button><button>2</button><button>3</button><button>4</button><button>5</button></div></div></div>';
  };
  var desk =
    '<style>.fd-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 18px;position:sticky;top:64px;z-index:12;background:#fff;border-radius:18px 18px 0 0;border-bottom:1px solid var(--line)}.fd-chk,.fd-lab{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}.fd-count{font-size:12px;color:var(--muted)}' +
    '#fd-table th,#fd-table td{padding:11px 9px;font-size:12.5px}#fd-table td[data-col=date],#fd-table td[data-col=years],#fd-table td[data-col=turnover]{white-space:nowrap}#fd-table td[data-col=applicant]{min-width:130px}#fd-table td[data-col=contact]{min-width:176px;word-break:break-all}#fd-table .fd-status{min-width:116px}.fd-route{width:292px}.fd-route .btn{margin:0 3px 5px 0;padding:0 10px;font-size:11.5px;height:30px}.fd-route .btn[disabled]{opacity:.45;cursor:not-allowed}.fd-del{border:0;background:none;color:var(--red);font-size:12px;font-weight:700;margin-left:4px}.fd-msg{font-size:11.5px;color:var(--green-d);font-weight:600;margin-top:2px}' +
    '.fd-det{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 16px;margin-bottom:12px}.fd-det summary{cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px}.fd-det summary small{color:var(--muted);font-weight:500}.fd-det[open] summary{margin-bottom:12px}' +
    '.fd-chip{border:1px solid var(--line);background:#F6F8FA;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600}.fd-chip.on{background:var(--navy);border-color:var(--navy);color:#fff}.fd-quiet{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:#fff;margin-bottom:14px}.fd-quiet.off{background:var(--amber-t);border-color:#f0cf9a}</style>' +
    '<div class="grid g4" style="margin-bottom:16px">' +
      MC.kpi({ label: 'Pending', icon: 'inbox', value: '73', tone: 'red', dir: 'up', delta: '+9', sub: 'this week', spark: [3, 4, 5, 4, 6, 7, 8, 9] }) +
      MC.kpi({ label: 'Sent to a partner', icon: 'send', value: '41', tone: 'blue', dir: 'up', delta: '+6', spark: [2, 3, 3, 4, 4, 5, 5, 6] }) +
      MC.kpi({ label: 'Approved this month', icon: 'badge-check', value: '17', tone: 'green', dir: 'up', delta: '+5', spark: [1, 2, 2, 3, 4, 4, 5, 6] }) +
      MC.kpi({ label: 'Value in play', icon: 'wallet', value: 'R18.4M', tone: 'navy', dir: 'up', delta: '+R2.1M', spark: [4, 5, 5, 6, 7, 7, 8, 9] }) +

      MC.card({ title: 'Email 1 preview' }, '<div style="border:1px solid var(--line);border-radius:14px;overflow:hidden"><div style="background:#0C1F31;color:#fff;padding:14px 18px;font-weight:800;font-family:Plus Jakarta Sans">SME South Africa</div><div style="padding:18px;font-size:13.5px;line-height:1.7"><b>You are two minutes from done</b><br><br>Hi Naledi, your funding application is saved. Pick up where you left off.<br><br><span class="btn pri sm">Finish my application</span></div></div>') + '</div>';

  var money =
    '<div class="grid g4" style="margin-bottom:16px">' + MC.kpi({ label: 'Earned, not invoiced', icon: 'receipt', value: 'R48 200', tone: 'red', dir: 'up', delta: '+R12k', spark: [2, 3, 3, 4, 5, 6, 7] }) + MC.kpi({ label: 'Invoiced, unpaid', icon: 'file-clock', value: 'R31 500', tone: 'amber', dir: 'flat', delta: '2 invoices' }) + MC.kpi({ label: 'Paid this month', icon: 'circle-check', value: 'R64 900', tone: 'green', dir: 'up', delta: '+18%', spark: [3, 3, 4, 5, 5, 7, 8] }) + MC.kpi({ label: 'Pipeline value', icon: 'trending-up', value: 'R210k', tone: 'navy', dir: 'up', delta: '+R40k' }) + '</div>' +
    '<div class="grid g-21"><div class="card flush"><div class="card-h"><div><h3>Commission ledger</h3><small>Earned on partner-confirmed approvals</small></div><div class="r">' + MC.dev('f_money') + '<button class="btn sm pri" data-act="Invoices for 3 partners drafted" data-ico="file-plus-2">' + MC.icon('file-plus-2') + 'Generate invoices</button></div></div>' + MC.table({ perPage: 6, search: false, rows: [
      { biz: 'Langa Holdings', partner: 'Lula', amt: 350000, comm: 8750, s: 'Earned' }, { biz: 'Pretoria Pet Provisions', partner: 'Retail Capital', amt: 220000, comm: 6600, s: 'Earned' }, { biz: 'Nkosi Freight', partner: 'Mzansi Capital', amt: 640000, comm: 10300, s: 'Invoiced' }, { biz: 'Bloem Bricks', partner: 'Genfin', amt: 410000, comm: 9100, s: 'Invoiced' }, { biz: 'Amanzi Water Tech', partner: 'Lula', amt: 520000, comm: 12100, s: 'Paid' }, { biz: 'Rustenburg Retail', partner: 'Retail Capital', amt: 300000, comm: 9000, s: 'Paid' }],
      filters: [{ k: 's', label: 'All states', opts: ['Earned', 'Invoiced', 'Paid'] }],
      cols: [{ k: 'biz', label: 'Business', render: function (r) { return MC.person(r.biz); } }, { k: 'partner', label: 'Partner' }, { k: 'amt', label: 'Approved', cls: 'num', render: function (r) { return R(r.amt); } }, { k: 'comm', label: 'Commission', cls: 'num', render: function (r) { return R(r.comm); } }, { k: 's', label: 'State', render: function (r) { return MC.chip(r.s, r.s === 'Paid' ? 'green' : r.s === 'Invoiced' ? 'blue' : 'amber', true); } }] }) + '</div>' +
      MC.card({ title: 'Unbilled by partner' }, '<div style="display:grid;gap:16px">' + [['Retail Capital', 15800, 33], ['Mzansi Capital', 12300, 26], ['Genfin', 11350, 23], ['Lula', 8750, 18]].map(function (p) { return '<div><div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px"><span>' + p[0] + '</span><span>' + R(p[1]) + '</span></div>' + MC.prog([{ v: p[2], c: '#DC183C' }]) + '</div>'; }).join('') + '</div>') + '</div>';

  var recurring =
    '<div class="grid g-21"><div class="card flush"><div class="card-h"><div><h3>Renewal windows</h3><small>Businesses funded before, ranked by when they are likely to need more</small></div><div class="r">' + MC.dev('f_rec') + '</div></div>' + MC.table({ perPage: 6, search: false, rows: [
      { biz: 'Langa Holdings', last: R(350000), win: 'Opens in 12 days', pct: 68, s: 'Soon' }, { biz: 'Amanzi Water Tech', last: R(520000), win: 'Open now', pct: 84, s: 'Open' }, { biz: 'Rustenburg Retail', last: R(300000), win: 'Open now', pct: 79, s: 'Open' }, { biz: 'Bloem Bricks', last: R(410000), win: 'Opens in 5 weeks', pct: 41, s: 'Later' }, { biz: 'Nkosi Freight', last: R(640000), win: 'Opens in 9 weeks', pct: 28, s: 'Later' }],
      cols: [{ k: 'biz', label: 'Business', render: function (r) { return MC.person(r.biz); } }, { k: 'last', label: 'Last facility', cls: 'num' }, { k: 'pct', label: 'Term used', render: function (r) { return '<div style="min-width:130px">' + r.pct + '%' + MC.prog([{ v: r.pct, c: r.pct > 65 ? '#29A37A' : '#0C1F31' }]) + '</div>'; } }, { k: 'win', label: 'Window' }, { k: 's', label: 'Status', render: function (r) { return MC.chip(r.s, r.s === 'Open' ? 'green' : r.s === 'Soon' ? 'amber' : '', true); } }, { k: 'x', label: '', sort: false, render: function () { return '<button class="btn sm" data-act="Renewal outreach drafted" data-ico="mail">' + MC.icon('mail') + 'Approach</button>'; } }] }) + '</div>' +
      MC.card({ title: 'Why this matters' }, MC.callout('green', 'repeat', 'A repeat deal costs almost nothing to win', 'These businesses already trust a partner and already have their documents with us. Approach the two open windows this week.')) + '</div>';

  function deskInit() {
    var $ = MC.$, $$ = MC.$$, quiet = false, table = $('#fd-table');
    if (!table) { return; }
    var picks = function () { return $$('.fd-pick:checked', table); };
    var sync = function () { var n = picks().length; $('#fd-count').textContent = n + ' selected'; ['fd-bsa', 'fd-bretail', 'fd-bmz', 'fd-blula'].forEach(function (id) { $('#' + id).disabled = n === 0 || (id === 'fd-blula' && quiet); }); };
    var nameOf = function (tr) { return appByid[tr.getAttribute('data-id')].biz; };
    var setMsg = function (tr, k, label) { var a = appByid[tr.getAttribute('data-id')]; a.sent[k] = 'Today'; var box = $('.fd-route', tr), btn = box.querySelector('[data-r="' + k + '"]'); if (btn) { btn.textContent = 'Re-send' + btn.textContent.replace(/^(Send|Re-send)/, ''); } var parts = []; if (a.sent.retail) { parts.push('Retail: sent ' + a.sent.retail); } if (a.sent.mzansi) { parts.push('Mzansi: sent ' + a.sent.mzansi); } if (a.sent.lula) { parts.push('Lula: sent ' + a.sent.lula); } if (a.sent.bridgement) { parts.push('Bridgement: sent ' + a.sent.bridgement); } $('.fd-msg', tr).innerHTML = parts.join(' &middot; '); };
    var MSG = { retail: 'Sent to Retail Capital: row added to the sheet.', mzansi: 'Sent to Mzansi Capital: row added to the sheet.', lula: 'Lula referral emailed.', bridgement: 'Bridgement referral emailed.' };
    var CONF = { both: 'Upload this lead to BOTH Retail Capital and Mzansi Capital sheets?', retail: 'Upload this lead to Retail Capital’s sheet?', mzansi: 'Upload this lead to Mzansi Capital’s sheet?', lula: 'Email this applicant their Lula referral?', bridgement: 'Email this applicant their Bridgement referral?', delete: 'Move this application to Trash?' };
    table.addEventListener('click', function (e) {
      var b = e.target.closest('[data-r]'); if (!b || b.disabled) { return; }
      var tr = b.closest('tr'), r = b.getAttribute('data-r');
      if (!window.confirm(CONF[r])) { return; }
      if (r === 'delete') { tr.remove(); MC.toast(nameOf(tr) + ' moved to Trash', 'trash-2'); return; }
      if (r === 'both') { setMsg(tr, 'retail'); setMsg(tr, 'mzansi'); var bb = $('.fd-route [data-r="both"]', tr); bb.textContent = 'Re-send to both'; MC.toast('Retail Capital: sent | Mzansi Capital: sent', 'send'); return; }
      setMsg(tr, r); MC.toast(MSG[r], r === 'lula' || r === 'bridgement' ? 'mail' : 'send');
    });
    table.addEventListener('change', function (e) {
      if (e.target.matches('.fd-status')) { var tr = e.target.closest('tr'), v = e.target.value; tr.setAttribute('data-status', v); MC.toast(v + ' saved and synced to the funding application' + (!quiet && (v === 'Approved' || v === 'Declined') ? ' (the ' + v.toLowerCase().replace('approved', 'approval').replace('declined', 'decline') + ' email will send)' : ''), 'check-circle-2'); }
      if (e.target.matches('.fd-pick')) { sync(); }
    });
    $('#fd-all').addEventListener('change', function (e) { $$('.fd-pick', table).forEach(function (c) { if (!c.closest('tr').hidden) { c.checked = e.target.checked; } }); sync(); });
    $('#fd-bs').addEventListener('change', function () { });
    $('#fd-bsa').addEventListener('click', function () { var v = $('#fd-bs').value; if (!v) { MC.toast('Choose a status first', 'info'); return; } var n = picks().length; picks().forEach(function (c) { var tr = c.closest('tr'); $('.fd-status', tr).value = v; tr.setAttribute('data-status', v); }); MC.toast(v + ' applied to ' + n + ' application' + (n === 1 ? '' : 's'), 'check-check'); });
    [['fd-bretail', 'retail', 'Retail Capital'], ['fd-bmz', 'mzansi', 'Mzansi Capital'], ['fd-blula', 'lula', 'Lula']].forEach(function (x) { $('#' + x[0]).addEventListener('click', function () { var n = picks().length; if (!window.confirm((x[1] === 'lula' ? 'Email ' : 'Upload ') + n + ' selected to ' + x[2] + (x[1] === 'lula' ? ' (referral email)?' : '’s sheet?'))) { return; } picks().forEach(function (c) { setMsg(c.closest('tr'), x[1]); }); MC.toast(n + ' sent to ' + x[2], x[1] === 'lula' ? 'mail' : 'send'); }); });
    var filt = function () { var q = $('#fd-search').value.toLowerCase(), sf = $('#fd-sf').value, stale = $('#fd-view .on').dataset.v === 'stale', shown = 0; $$('tbody tr', table).forEach(function (tr) { var ok = (!q || tr.getAttribute('data-s').indexOf(q) >= 0) && (!sf || tr.getAttribute('data-status') === sf) && (!stale || tr.getAttribute('data-stale') === '1'); tr.hidden = !ok; if (ok) { shown++; } }); $('#fd-shown').textContent = 'Showing ' + shown + ' of 73 applications'; };
    $('#fd-search').addEventListener('input', filt); $('#fd-sf').addEventListener('change', filt);
    $('#fd-clear').addEventListener('click', function () { $('#fd-search').value = ''; $('#fd-sf').value = ''; filt(); });
    $('#fd-view').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) { return; } $$('#fd-view button').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); var v = b.dataset.v; $('#fd-tablewrap').style.display = v === 'pipeline' ? 'none' : ''; $('#fd-pipe').style.display = v === 'pipeline' ? '' : 'none'; $('#fd-stalebar').style.display = v === 'stale' ? '' : 'none'; filt(); });
    $('#fd-cols').addEventListener('change', function (e) { var c = e.target.value; $$('[data-col="' + c + '"]', table).forEach(function (el) { el.hidden = !e.target.checked; }); });
    $('#fd-q').addEventListener('click', function () { quiet = !quiet; var q = $('#fd-quiet'); q.classList.toggle('off', quiet); var t = new Date(Date.now() + 2 * 3600 * 1000); $('#fd-q-t').innerHTML = MC.icon('bell-off') + (quiet ? 'Applicant emails are OFF until ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0') : 'Applicant emails are on'); $('#fd-q').textContent = quiet ? 'Switch emails back on' : 'Switch off for quiet updates (2 hours)'; $$('.fd-mail', table).forEach(function (b) { b.disabled = quiet; b.title = quiet ? 'Applicant emails are switched off' : ''; }); sync(); MC.refreshIcons(); MC.toast(quiet ? 'Applicant emails off for 2 hours' : 'Applicant emails back on', quiet ? 'bell-off' : 'bell'); });
    $('#fd-pp').addEventListener('click', function () { var lines = $('#fd-pt').value.split(/\n/).map(function (x) { return x.trim(); }).filter(Boolean), hit = [], miss = []; lines.forEach(function (l) { var f = apps.filter(function (a) { return l.toLowerCase().indexOf(a.email) >= 0 || l.indexOf(a.reg) >= 0 || l.replace(/\s/g, '').indexOf(a.phone.replace(/\s/g, '')) >= 0 || l.indexOf('#' + a.id.replace('FA-', '')) >= 0; })[0]; (f ? hit : miss).push(f ? f : l); }); var sv = $('#fd-ps').value; $('#fd-pr').innerHTML = !lines.length ? '<div class="callout amber"><div class="ic">' + MC.icon('clipboard') + '</div><div><b>Paste a list first</b><p>One applicant per line.</p></div></div>' : '<div class="callout ' + (miss.length ? 'amber' : 'green') + '"><div class="ic">' + MC.icon('list-checks') + '</div><div><b>' + hit.length + ' of ' + lines.length + ' lines matched' + (sv ? ' &middot; will be set to ' + sv : '') + '</b><p>' + hit.map(function (a) { return MC.esc(a.biz); }).join(', ') + (miss.length ? '<br>No match: ' + miss.map(MC.esc).join(', ') : '') + '</p><p style="margin-top:8px"><button class="btn sm pri" id="fd-pa">Apply to ' + hit.length + '</button> <small style="color:var(--muted)">Emails ' + ($('#fd-pn').checked ? 'will' : 'will NOT') + ' send.</small></p></div></div>'; MC.refreshIcons(); var pa = $('#fd-pa'); if (pa) { pa.addEventListener('click', function () { if (!sv) { MC.toast('Choose a status first', 'info'); return; } hit.forEach(function (a) { var tr = $('tr[data-id="' + a.id + '"]', table); if (tr) { $('.fd-status', tr).value = sv; tr.setAttribute('data-status', sv); } }); MC.toast(sv + ' applied to ' + hit.length + ' applications', 'check-check'); }); } });
  }

  var tabs = [
    { k: 'desk', label: 'Funding Desk', icon: 'layout-kanban', n: 73, html: desk, dev: 'f_desk' }, { k: 'ledger', label: 'Applications & Outcomes', icon: 'table-2', html: ledger, dev: 'f_ledger' }, { k: 'chase', label: 'Weekly Outcome Review', icon: 'clipboard-check', n: 4, html: chase, dev: 'f_chase' },
    { k: 'declines', label: 'Declines', icon: 'circle-x', html: declines }, { k: 'frontdoor', label: 'Front Door', icon: 'door-open', html: frontdoor }, { k: 'lula', label: 'Lula Pre-Qual', icon: 'badge-check', html: lula, dev: 'f_lula' },
    { k: 'docreq', label: 'Request Docs', icon: 'file-text', html: docreq }, { k: 'share', label: 'Statement Share', icon: 'share-2', html: share }, { k: 'vault', label: 'Statement Vault', icon: 'archive', html: vault },
    { k: 'affiliate', label: 'Affiliate Tracking', icon: 'link-2', html: affiliate }, { k: 'nudge', label: 'Complete-app Nudge', icon: 'bell-ring', html: nudge }, { k: 'money', label: 'Commission', icon: 'receipt', html: money }, { k: 'recurring', label: 'Recurring Funding', icon: 'repeat', html: recurring }
  ];

  var html =
    '<section class="hero"><div class="hero-in"><div><span class="eyebrow"><i></i> Funding workspace &middot; mockup, illustrative data</span><h1>Everything funding, in one place</h1><p>The Desk, routing, outcomes, declines, statements, affiliates and commission. One door, every tool a tab.</p></div>' +
    '<div class="hero-stats"><div class="hs r"><b>73</b><small>Pending</small></div><div class="hs"><b>41</b><small>With partners</small></div><div class="hs g"><b>17</b><small>Approved MTD</small></div><div class="hs a"><b>R48k</b><small>Unbilled</small></div></div></div></section>' +
    MC.tabs('ws', tabs) + tabs.map(function (t) { return '<div class="panel" data-k="' + t.k + '">' + t.html + '</div>'; }).join('');

  MC.page({ active: 'funding', crumbs: ['Workspaces', 'Funding'], html: html, workspace: tabs, after: function () {
    deskInit();
    var seg = document.getElementById('chase-seg'); if (seg) { seg.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { seg.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); window.mcChase(b.getAttribute('data-p')); } }); }
    tabs.forEach(function (t) { if (t.dev) { var p = document.querySelector('.panel[data-k="' + t.k + '"]'); p.insertAdjacentHTML('afterbegin', '<div style="display:flex;justify-content:flex-end;margin:-6px 0 8px">' + MC.dev(t.dev) + '</div>'); } });
  } });
})();
