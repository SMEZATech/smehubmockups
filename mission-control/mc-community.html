    { k: 'members', label: 'Member Report', icon: 'users' }, { k: 'rescue', label: 'Connection Rescue', icon: 'life-buoy', n: 6 }, { k: 'lifecycle', label: 'Lifecycle Engine', icon: 'workflow' }, { k: 'engagement', label: 'Member Engagement', icon: 'activity' }, { k: 'reply', label: 'Reply-Rate', icon: 'reply' }, { k: 'feedback', label: 'Feedback Hub', icon: 'message-circle-heart', n: 2 },

  var html =
    '<section class="hero"><div class="hero-in"><div><span class="eyebrow"><i></i> Community workspace &middot; mockup, illustrative data</span><h1>Everything community, in one place</h1><p>The re-engagement engine, who is active, the reply-rate KPI, member feedback, the funnel and moderation.</p></div>' +
    '<div class="hero-stats"><div class="hs"><b>2 605</b><small>Members</small></div><div class="hs a"><b>38</b><small>Cooling</small></div><div class="hs g"><b>+41</b><small>NPS</small></div><div class="hs r"><b>6</b><small>To review</small></div></div></div></section>' +
    MC.tabs('ws', tabs) + tabs.map(function (t) { return '<div class="panel" data-k="' + t.k + '"><div style="display:flex;justify-content:flex-end;margin:-6px 0 8px">' + MC.dev(devKey[t.k]) + '</div>' + panel[t.k] + '</div>'; }).join('');

  MC.page({ active: 'community', crumbs: ['Workspaces', 'Community'], html: html, workspace: tabs, after: function () {
    var s = document.getElementById('lc-seg'); if (s) { s.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) { return; } s.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); x.style.color = ''; }); b.classList.add('on'); b.style.color = b.dataset.s === 'Live' ? 'var(--green-d)' : b.dataset.s === 'Dry-run' ? 'var(--amber-d)' : ''; MC.toast('Lifecycle engine set to ' + b.dataset.s + (b.dataset.s === 'Live' ? ' (confirmation required in the real build)' : ''), 'workflow'); }); }
  } });
