<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify your email | SME South Africa</title>
  <meta name="description" content="Verify your email to finish creating your SME South Africa account." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            jakarta: ['Plus Jakarta Sans', 'sans-serif'],
            inter: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style>
    html, body { font-family: 'Inter', system-ui, sans-serif; }
    .font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: 0.005em; }

    /* Scrollbars */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Reveal */
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .reveal { animation: fadeUp .45s cubic-bezier(.2,.7,.2,1) backwards; }

    /* Composer expand */
    @keyframes expandDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .expand-down { animation: expandDown .3s cubic-bezier(.2,.7,.2,1); }

    /* Toast */
    @keyframes toastIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes toastOut { to { opacity:0; transform:translateY(20px); } }
    .toast-in { animation: toastIn .25s ease forwards; }
    .toast-out { animation: toastOut .25s ease forwards; }

    /* Type stripes, the visual signal that makes the feed scannable */
    .stripe-ask   { box-shadow: inset 4px 0 0 0 #DC183C; }
    .stripe-win   { box-shadow: inset 4px 0 0 0 #29A37A; }
    .stripe-share { box-shadow: inset 4px 0 0 0 #FF9900; }

    /* Card hover lift */
    .card-lift { transition: box-shadow .2s, transform .2s; }
    .card-lift:hover { box-shadow: 0 8px 20px -8px rgba(10,44,61,0.12); transform: translateY(-1px); }

    /* Print-portal hiding (parity with events module) */
    #overlay-root:empty { display:none; }

    /* ===== Dev Mode (implementation notes) ===== */
    .dev-badge { display:none; }
    body.dev-on .dev-badge { display:inline-flex; }
    #devToggle.on { background:#DC183C; color:#fff; border-color:#DC183C; }
    /* Overlays: right drawer (briefs) + centre modal (contribution) */
    .ov { position:fixed; inset:0; z-index:60; }
    .ov-bg { position:absolute; inset:0; background:rgba(12,31,49,.45); backdrop-filter:blur(2px); opacity:0; transition:opacity .3s; }
    .ov.open .ov-bg { opacity:1; }
    .drawer { position:absolute; right:0; top:0; height:100%; width:100%; max-width:440px; background:#fff; box-shadow:-12px 0 40px rgba(12,31,49,.25); overflow-y:auto; transform:translateX(100%); transition:transform .3s cubic-bezier(.2,.7,.2,1); }
    .ov.open .drawer { transform:translateX(0); }
    .modalbox { position:absolute; left:50%; top:50%; transform:translate(-50%,-46%); width:calc(100% - 2rem); max-width:420px; background:#fff; border-radius:1rem; box-shadow:0 24px 60px rgba(12,31,49,.3); opacity:0; transition:transform .25s, opacity .25s; }
    .ov.open .modalbox { transform:translate(-50%,-50%); opacity:1; }
    
    /* Full Header Search Overlay */
    .search-overlay {
      position: absolute;
      inset: 0;
      background: white;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 1rem;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .search-overlay.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    @media (min-width: 640px) {
      .search-overlay { padding: 0 1.5rem; }
    }
  </style>
</head>
<body class="bg-[#FCFCFC] text-[#121A21] antialiased relative">

<header class="bg-white border-b border-slate-200"><div class="max-w-xl mx-auto px-4 h-16 flex items-center justify-between"><a href="public-home.html" class="flex items-center py-2"><img src="assets/logo-v1-lockup.svg" alt="SME South Africa" class="h-[42px] lg:h-[50px] w-auto"></a><div class="flex items-center gap-4"><a href="public-help.html" class="text-xs font-bold text-slate-500 hover:text-[#DC183C]">Need help?</a><span class="flex items-center gap-2 text-[10px] font-bold uppercase tracking-widest text-slate-400">Dev <button id="devToggle" type="button" onclick="toggleDevMode()" class="w-8 h-4 rounded-full bg-slate-200 relative transition-colors" aria-pressed="false" aria-label="Dev Mode"><span class="absolute left-0.5 top-0.5 w-3 h-3 rounded-full bg-white shadow-sm"></span></button></span></div></div></header>

<main class="max-w-xl mx-auto px-4 sm:px-6 py-10 sm:py-14">

<div class="text-center">
  <div id="ve-states" class="mb-6 flex flex-wrap justify-center gap-1.5 text-[11px]"><span class="font-bold uppercase tracking-widest text-slate-400 self-center mr-1">Mockup state</span></div>
  <div id="ve-card" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-7 sm:p-9"></div>
  <p class="text-[12.5px] text-slate-400 mt-5">Need help? <a href="public-help.html" class="font-bold text-[#DC183C] hover:underline">Contact support</a></p>
</div>

</main>
<footer class="text-center text-xs text-slate-400 pb-10">&copy; 2026 SME South Africa &middot; <a href="public-privacy.html" class="hover:text-[#DC183C]">Privacy</a> &middot; <a href="public-terms.html" class="hover:text-[#DC183C]">Terms</a></footer>

<div id="overlay-root"></div><div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[100]"></div>
<script>
  const BRIEFS = {
    verify: { title:'Email verification', sub:'Pending, verified, expired and already-verified states',
      purpose:'<b>Live today:</b> BuddyBoss activation, <a href="https://smesouthafrica.co.za/activate/" target="_blank" rel="noopener">smesouthafrica.co.za/activate/</a>, with the verify emails from the mu-plugin smesa-verify.php. This design replaces that screen. Every sign-up passes through here. Today the live screens are scattered; this is the one design for all four outcomes so no member is left on a dead end.',
      data:'users.email_verified_at, verification_tokens(user_id, token_hash, expires_at, used_at), resend log for rate limiting.',
      logic:'Pending: show the address, a one-tap link to Gmail or Outlook where the domain matches, tips for spam folders, Resend with a 60-second cooldown and a Use a different email option that invalidates the old token. Verified: next steps are photo and finish profile, with a clear Skip. Expired: one button to send a new link. Already verified: send to sign in. Decided (Joel, 2026-10-02): token is single use, hashed at rest and lasts 24 hours. Resend limited per address and per IP. Wording avoids saying whether an email exists (no account enumeration) on the public resend path.',
      components:'Centre card, state switcher (mockup only), email chip, provider shortcut, resend with countdown, change-email dialog, next-step tiles.' }
  };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  function showToast(msg){
    const el = document.getElementById('toast'); el.classList.remove('hidden');
    el.innerHTML = `<div class="toast-in bg-[#0C1F31] text-white rounded-full pl-3 pr-5 py-2.5 shadow-2xl flex items-center gap-2 text-sm font-semibold" style="border-left:4px solid #29A37A"><i data-lucide="check-circle" class="w-4 h-4" style="color:#29A37A"></i><span>${esc(msg)}</span></div>`;
    lucide.createIcons(); clearTimeout(window.__t); window.__t = setTimeout(() => { el.classList.add('hidden'); el.innerHTML=''; }, 2600);
  }
  function toggleDevMode(){ const on = document.body.classList.toggle('dev-on'); const b = document.getElementById('devToggle'); if(b) b.classList.toggle('on', on); if(on) showToast('Dev Mode on, tap any (i) for implementation notes.'); lucide.createIcons(); }
  function closeOverlay(id){ const el = document.getElementById(id); if(!el) return; el.classList.remove('open'); setTimeout(() => { if(el && el.parentNode) el.remove(); }, 300); }
  function dialog(id, html){ document.getElementById('overlay-root').innerHTML = `<div class="ov" id="${id}"><div class="ov-bg" onclick="closeOverlay('${id}')"></div><div class="modalbox" role="dialog" aria-modal="true">${html}</div></div>`; requestAnimationFrame(() => { const o = document.getElementById(id); if(o) o.classList.add('open'); }); lucide.createIcons(); }
  function confirmDialog(title, body, cta, fn, danger){
    window.__cf = fn;
    dialog('ov-confirm', `<div class="p-6"><p class="font-jakarta font-extrabold text-lg">${esc(title)}</p><p class="text-sm text-slate-500 mt-2 leading-relaxed">${esc(body)}</p><div class="mt-5 flex gap-3 justify-end"><button onclick="closeOverlay('ov-confirm')" class="h-10 px-5 rounded-full border border-slate-200 text-sm font-bold hover:border-[#0C1F31] transition">Cancel</button><button onclick="closeOverlay('ov-confirm'); window.__cf()" class="h-10 px-5 rounded-full ${danger === false ? 'bg-[#0C1F31] hover:bg-[#16324a]' : 'bg-[#DC183C] hover:bg-[#B0142F]'} text-white text-sm font-bold transition">${esc(cta)}</button></div></div>`);
  }
  function openBrief(id){
    const b = BRIEFS[id]; if(!b) return;
    const sec = (icon, label, html) => `<div class="px-6 py-4 border-t border-slate-100"><p class="text-[10px] font-bold uppercase tracking-widest text-[#DC183C] flex items-center gap-1.5 mb-2"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${label}</p><div class="text-sm text-slate-600 leading-relaxed">${html}</div></div>`;
    document.getElementById('overlay-root').innerHTML = `<div class="ov" id="ov-brief"><div class="ov-bg" onclick="closeOverlay('ov-brief')"></div><div class="drawer"><div class="sticky top-0 z-10 bg-[#0C1F31] text-white px-6 py-5 flex items-start justify-between"><div class="min-w-0"><p class="text-[10px] font-bold uppercase tracking-widest text-[#FF9900] mb-1">Dev Brief</p><h3 class="font-jakarta font-extrabold text-lg leading-tight">${b.title}</h3><p class="text-xs text-white/60 mt-1">${b.sub}</p></div><button onclick="closeOverlay('ov-brief')" aria-label="Close" class="text-white/60 hover:text-white shrink-0 ml-3"><i data-lucide="x" class="w-5 h-5"></i></button></div>${sec('target','Purpose',b.purpose)}${sec('database','Data model',b.data)}${sec('git-branch','Logic',b.logic)}${sec('boxes','Components',b.components)}</div></div>`;
    requestAnimationFrame(() => { const o = document.getElementById('ov-brief'); if(o) o.classList.add('open'); }); lucide.createIcons();
  }
  function toggleHeaderSearch(){ var o = document.getElementById('headerSearchOverlay'); if(!o) return; var open = o.classList.toggle('active'); var i = document.getElementById('headerSearchInput'); if(open){ if(i) setTimeout(function(){ i.focus(); }, 100); } else if(i){ i.value = ''; } }
  function toggleHeaderDrop(name){ var el = document.getElementById('drop' + name.charAt(0).toUpperCase() + name.slice(1)); if(el) el.classList.toggle('hidden'); }
  function closeHeaderDrop(name){ var el = document.getElementById('drop' + name.charAt(0).toUpperCase() + name.slice(1)); if(el) el.classList.add('hidden'); }
  document.addEventListener('click', function(e){ if(!e.target.closest('#dropCommunity') && !e.target.closest('[onclick*=toggleHeaderDrop]')) closeHeaderDrop('community'); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ document.querySelectorAll('.ov.open').forEach(o => closeOverlay(o.id)); } });

  const STATES = { pending:'Check your inbox', verified:'Verified', expired:'Link expired', already:'Already verified' };
  let st = new URLSearchParams(location.search).get('state'); if(!STATES[st]) st = 'pending';
  let email = 'tshepho@example.com', cd = 0, timer = null;
  function states(){ const h = document.getElementById('ve-states'); h.innerHTML = '<span class="font-bold uppercase tracking-widest text-slate-400 self-center mr-1">Mockup state</span>' + Object.keys(STATES).map(k => `<button onclick="st='${k}';render()" class="h-7 px-3 rounded-full font-bold ${st === k ? 'bg-[#0C1F31] text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${STATES[k]}</button>`).join(''); }
  function mailLink(){ const d = email.split('@')[1] || ''; if(/gmail|googlemail/i.test(d)) return ['Open Gmail', 'https://mail.google.com']; if(/outlook|hotmail|live/i.test(d)) return ['Open Outlook', 'https://outlook.live.com']; return null; }
  function render(){
    states(); const c = document.getElementById('ve-card'); const ml = mailLink();
    const icon = (n, bg, fg) => `<div class="w-16 h-16 rounded-2xl mx-auto grid place-items-center" style="background:${bg};color:${fg}"><i data-lucide="${n}" class="w-8 h-8"></i></div>`;
    if(st === 'pending') c.innerHTML = `${icon('mail', '#FDECEF', '#DC183C')}<h1 class="font-jakarta font-extrabold text-2xl tracking-tight mt-5 flex items-center justify-center gap-2">Check your inbox <button onclick="openBrief('verify')" class="dev-badge w-5 h-5 rounded-full bg-[#DC183C] text-white items-center justify-center text-[10px] font-bold leading-none animate-pulse" title="Implementation notes">i</button></h1>
      <p class="text-slate-500 mt-2 leading-relaxed">We sent a verification link to<br><b class="text-[#121A21]" id="ve-mail">${esc(email)}</b></p>
      ${ml ? `<a href="${ml[1]}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 mt-5 h-11 px-6 rounded-full bg-[#DC183C] hover:bg-[#B0142F] text-white font-jakarta font-bold text-sm transition">${ml[0]} <i data-lucide="arrow-up-right" class="w-4 h-4"></i></a>` : ''}
      <div class="mt-6 rounded-xl bg-slate-50 border border-slate-200 p-4 text-left text-[13px] text-slate-600"><p class="font-bold text-[#121A21] mb-1">Not there after a minute?</p><ul class="list-disc pl-5 space-y-1"><li>Look in Spam or Promotions.</li><li>Check the address above for a typo.</li><li>The link works once and expires in 24 hours.</li></ul></div>
      <div class="mt-5 flex flex-col sm:flex-row gap-2 justify-center"><button id="ve-resend" onclick="resend()" class="h-11 px-5 rounded-full border border-slate-200 text-sm font-bold hover:border-[#0C1F31] transition disabled:opacity-50 disabled:cursor-not-allowed">Resend email</button><button onclick="changeEmail()" class="h-11 px-5 rounded-full text-sm font-bold text-[#DC183C] hover:bg-[#FDECEF] transition">Use a different email</button></div><p id="ve-note" class="text-[12.5px] text-slate-400 mt-3 h-4"></p>`;
    if(st === 'verified') c.innerHTML = `${icon('badge-check', '#E4F5EE', '#29A37A')}<h1 class="font-jakarta font-extrabold text-2xl tracking-tight mt-5">Email verified</h1><p class="text-slate-500 mt-2 leading-relaxed">You are in. Two quick things will make the community useful from day one.</p>
      <div class="mt-6 space-y-2.5 text-left"><a href="member-account.html#profile" class="flex items-center gap-3 rounded-xl border border-slate-200 hover:border-[#0C1F31] p-4 transition"><i data-lucide="camera" class="w-5 h-5 text-[#DC183C]"></i><div><p class="font-jakarta font-bold text-sm">Add a profile photo</p><p class="text-[12.5px] text-slate-500">Members connect with people they can see.</p></div></a><a href="member-account.html" class="flex items-center gap-3 rounded-xl border border-slate-200 hover:border-[#0C1F31] p-4 transition"><i data-lucide="user-round-check" class="w-5 h-5 text-[#DC183C]"></i><div><p class="font-jakarta font-bold text-sm">Finish your profile</p><p class="text-[12.5px] text-slate-500">One short form, about a minute.</p></div></a></div>
      <a href="member-hub.html" class="inline-block mt-5 text-sm font-bold text-slate-500 hover:text-[#DC183C]">Skip, take me to the community</a>`;
    if(st === 'expired') c.innerHTML = `${icon('timer-off', '#FFF1E0', '#AE6B0A')}<h1 class="font-jakarta font-extrabold text-2xl tracking-tight mt-5">That link has expired</h1><p class="text-slate-500 mt-2 leading-relaxed">Verification links work once and last 24 hours. We can send a fresh one to <b class="text-[#121A21]">${esc(email)}</b>.</p><button onclick="st='pending';render();resend()" class="mt-6 h-11 px-6 rounded-full bg-[#DC183C] hover:bg-[#B0142F] text-white font-jakarta font-bold text-sm transition">Send a new link</button><div><button onclick="changeEmail()" class="mt-3 text-sm font-bold text-slate-500 hover:text-[#DC183C]">Use a different email</button></div>`;
    if(st === 'already') c.innerHTML = `${icon('check-circle-2', '#E4F5EE', '#29A37A')}<h1 class="font-jakarta font-extrabold text-2xl tracking-tight mt-5">You are already verified</h1><p class="text-slate-500 mt-2 leading-relaxed">This link has been used, so there is nothing more to do. Sign in to carry on.</p><a href="public-auth.html" class="inline-block mt-6 h-11 leading-[44px] px-7 rounded-full bg-[#0C1F31] hover:bg-[#16324a] text-white font-jakarta font-bold text-sm transition">Sign in</a>`;
    lucide.createIcons(); tickUi();
  }
  function tickUi(){ const b = document.getElementById('ve-resend'); if(!b) return; b.disabled = cd > 0; b.textContent = cd > 0 ? 'Resend in ' + cd + 's' : 'Resend email'; }
  function resend(){ if(cd > 0) return; cd = 60; showToast('A new link is on its way.'); const n = document.getElementById('ve-note'); if(n) n.textContent = 'Sent just now. Only the newest link works.'; clearInterval(timer); timer = setInterval(() => { cd--; tickUi(); if(cd <= 0) clearInterval(timer); }, 1000); tickUi(); }
  function changeEmail(){ dialog('ov-ce', `<div class="p-6"><p class="font-jakarta font-extrabold text-lg">Use a different email</p><p class="text-sm text-slate-500 mt-1">We will send the link to the new address and the old one stops working.</p><input id="ce-in" type="email" placeholder="you@business.co.za" class="mt-4 w-full h-11 rounded-lg border border-slate-200 px-3 text-sm outline-none focus:border-[#DC183C]"><p id="ce-err" class="text-[12.5px] text-[#DC183C] font-semibold mt-2 hidden">Enter a valid email address.</p><div class="mt-4 flex gap-3 justify-end"><button onclick="closeOverlay('ov-ce')" class="h-10 px-5 rounded-full border border-slate-200 text-sm font-bold">Cancel</button><button onclick="saveEmail()" class="h-10 px-5 rounded-full bg-[#DC183C] text-white text-sm font-bold">Send link</button></div></div>`); }
  function saveEmail(){ const v = document.getElementById('ce-in').value.trim(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ document.getElementById('ce-err').classList.remove('hidden'); return; } email = v; closeOverlay('ov-ce'); st = 'pending'; cd = 0; render(); resend(); }
  render();

  lucide.createIcons();
</script>
<script src="status.js"></script>
<script src="gate-links.js"></script>
</body>
</html>
