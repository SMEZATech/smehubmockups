<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Something went wrong | SME South Africa</title>
  <meta name="description" content="SME South Africa, error and offline page." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            jakarta: ['Plus Jakarta Sans', 'sans-serif'],
            inter: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style>
    html, body { font-family: 'Inter', system-ui, sans-serif; }
    .font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: 0.005em; }

    /* Scrollbars */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Reveal */
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .reveal { animation: fadeUp .45s cubic-bezier(.2,.7,.2,1) backwards; }

    /* Composer expand */
    @keyframes expandDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .expand-down { animation: expandDown .3s cubic-bezier(.2,.7,.2,1); }

    /* Toast */
    @keyframes toastIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes toastOut { to { opacity:0; transform:translateY(20px); } }
    .toast-in { animation: toastIn .25s ease forwards; }
    .toast-out { animation: toastOut .25s ease forwards; }

    /* Type stripes, the visual signal that makes the feed scannable */
    .stripe-ask   { box-shadow: inset 4px 0 0 0 #DC183C; }
    .stripe-win   { box-shadow: inset 4px 0 0 0 #29A37A; }
    .stripe-share { box-shadow: inset 4px 0 0 0 #FF9900; }

    /* Card hover lift */
    .card-lift { transition: box-shadow .2s, transform .2s; }
    .card-lift:hover { box-shadow: 0 8px 20px -8px rgba(10,44,61,0.12); transform: translateY(-1px); }

    /* Print-portal hiding (parity with events module) */
    #overlay-root:empty { display:none; }

    /* ===== Dev Mode (implementation notes) ===== */
    .dev-badge { display:none; }
    body.dev-on .dev-badge { display:inline-flex; }
    #devToggle.on { background:#DC183C; color:#fff; border-color:#DC183C; }
    /* Overlays: right drawer (briefs) + centre modal (contribution) */
    .ov { position:fixed; inset:0; z-index:60; }
    .ov-bg { position:absolute; inset:0; background:rgba(12,31,49,.45); backdrop-filter:blur(2px); opacity:0; transition:opacity .3s; }
    .ov.open .ov-bg { opacity:1; }
    .drawer { position:absolute; right:0; top:0; height:100%; width:100%; max-width:440px; background:#fff; box-shadow:-12px 0 40px rgba(12,31,49,.25); overflow-y:auto; transform:translateX(100%); transition:transform .3s cubic-bezier(.2,.7,.2,1); }
    .ov.open .drawer { transform:translateX(0); }
    .modalbox { position:absolute; left:50%; top:50%; transform:translate(-50%,-46%); width:calc(100% - 2rem); max-width:420px; background:#fff; border-radius:1rem; box-shadow:0 24px 60px rgba(12,31,49,.3); opacity:0; transition:transform .25s, opacity .25s; }
    .ov.open .modalbox { transform:translate(-50%,-50%); opacity:1; }
    
    /* Full Header Search Overlay */
    .search-overlay {
      position: absolute;
      inset: 0;
      background: white;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 1rem;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .search-overlay.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    @media (min-width: 640px) {
      .search-overlay { padding: 0 1.5rem; }
    }
  </style>
</head>
<body class="bg-[#FCFCFC] text-[#121A21] antialiased relative">

<header class="bg-white border-b border-slate-200"><div class="max-w-xl mx-auto px-4 h-16 flex items-center justify-between"><a href="public-home.html" class="flex items-center py-2"><img src="assets/logo-v1-lockup.svg" alt="SME South Africa" class="h-[42px] lg:h-[50px] w-auto"></a><div class="flex items-center gap-4"><a href="public-help.html" class="text-xs font-bold text-slate-500 hover:text-[#DC183C]">Need help?</a><span class="flex items-center gap-2 text-[10px] font-bold uppercase tracking-widest text-slate-400">Dev <button id="devToggle" type="button" onclick="toggleDevMode()" class="w-8 h-4 rounded-full bg-slate-200 relative transition-colors" aria-pressed="false" aria-label="Dev Mode"><span class="absolute left-0.5 top-0.5 w-3 h-3 rounded-full bg-white shadow-sm"></span></button></span></div></div></header>

<main class="max-w-xl mx-auto px-4 sm:px-6 py-10 sm:py-14">

<div class="text-center">
  <div id="er-states" class="mb-6 flex flex-wrap justify-center gap-1.5 text-[11px]"></div>
  <div id="er-card" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-7 sm:p-9"></div>
  <p class="text-[12.5px] text-slate-400 mt-5">Still stuck? <a href="public-help.html" class="font-bold text-[#DC183C] hover:underline">Help Centre</a> or email <span class="font-semibold text-slate-500">support@smesouthafrica.co.za</span></p>
</div>

</main>
<footer class="text-center text-xs text-slate-400 pb-10">&copy; 2026 SME South Africa &middot; <a href="public-privacy.html" class="hover:text-[#DC183C]">Privacy</a> &middot; <a href="public-terms.html" class="hover:text-[#DC183C]">Terms</a></footer>

<div id="overlay-root"></div><div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[100]"></div>
<script>
  const BRIEFS = {
    errors: { title:'Error, offline and maintenance', sub:'500, 429, 503 and no connection, one calm page',
      purpose:'<b>Live today:</b> no custom page (WP Engine and theme defaults). New design. A member who hits an error should know whether it is them or us, what happened to their work, and what to do next, without blame or jargon.',
      data:'Error reference (request id) for 500s, logged with the URL and member id so support can find it.',
      logic:'500: our fault, show a reference. Offline: detected by the browser, the page retries on reconnect and keeps form input. 429: ask to wait. 503: maintenance window with an honest time. Never show stack traces. The 404 page stays separate (public-404.html). Applies to the public site and the community.',
      components:'State switch (mockup only), icon, message, Try again, home link, reference.' }
  };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  function showToast(msg){
    const el = document.getElementById('toast'); el.classList.remove('hidden');
    el.innerHTML = `<div class="toast-in bg-[#0C1F31] text-white rounded-full pl-3 pr-5 py-2.5 shadow-2xl flex items-center gap-2 text-sm font-semibold" style="border-left:4px solid #29A37A"><i data-lucide="check-circle" class="w-4 h-4" style="color:#29A37A"></i><span>${esc(msg)}</span></div>`;
    lucide.createIcons(); clearTimeout(window.__t); window.__t = setTimeout(() => { el.classList.add('hidden'); el.innerHTML=''; }, 2600);
  }
  function toggleDevMode(){ const on = document.body.classList.toggle('dev-on'); const b = document.getElementById('devToggle'); if(b) b.classList.toggle('on', on); if(on) showToast('Dev Mode on, tap any (i) for implementation notes.'); lucide.createIcons(); }
  function closeOverlay(id){ const el = document.getElementById(id); if(!el) return; el.classList.remove('open'); setTimeout(() => { if(el && el.parentNode) el.remove(); }, 300); }
  function dialog(id, html){ document.getElementById('overlay-root').innerHTML = `<div class="ov" id="${id}"><div class="ov-bg" onclick="closeOverlay('${id}')"></div><div class="modalbox" role="dialog" aria-modal="true">${html}</div></div>`; requestAnimationFrame(() => { const o = document.getElementById(id); if(o) o.classList.add('open'); }); lucide.createIcons(); }
  function confirmDialog(title, body, cta, fn, danger){
    window.__cf = fn;
    dialog('ov-confirm', `<div class="p-6"><p class="font-jakarta font-extrabold text-lg">${esc(title)}</p><p class="text-sm text-slate-500 mt-2 leading-relaxed">${esc(body)}</p><div class="mt-5 flex gap-3 justify-end"><button onclick="closeOverlay('ov-confirm')" class="h-10 px-5 rounded-full border border-slate-200 text-sm font-bold hover:border-[#0C1F31] transition">Cancel</button><button onclick="closeOverlay('ov-confirm'); window.__cf()" class="h-10 px-5 rounded-full ${danger === false ? 'bg-[#0C1F31] hover:bg-[#16324a]' : 'bg-[#DC183C] hover:bg-[#B0142F]'} text-white text-sm font-bold transition">${esc(cta)}</button></div></div>`);
  }
  function openBrief(id){
    const b = BRIEFS[id]; if(!b) return;
    const sec = (icon, label, html) => `<div class="px-6 py-4 border-t border-slate-100"><p class="text-[10px] font-bold uppercase tracking-widest text-[#DC183C] flex items-center gap-1.5 mb-2"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${label}</p><div class="text-sm text-slate-600 leading-relaxed">${html}</div></div>`;
    document.getElementById('overlay-root').innerHTML = `<div class="ov" id="ov-brief"><div class="ov-bg" onclick="closeOverlay('ov-brief')"></div><div class="drawer"><div class="sticky top-0 z-10 bg-[#0C1F31] text-white px-6 py-5 flex items-start justify-between"><div class="min-w-0"><p class="text-[10px] font-bold uppercase tracking-widest text-[#FF9900] mb-1">Dev Brief</p><h3 class="font-jakarta font-extrabold text-lg leading-tight">${b.title}</h3><p class="text-xs text-white/60 mt-1">${b.sub}</p></div><button onclick="closeOverlay('ov-brief')" aria-label="Close" class="text-white/60 hover:text-white shrink-0 ml-3"><i data-lucide="x" class="w-5 h-5"></i></button></div>${sec('target','Purpose',b.purpose)}${sec('database','Data model',b.data)}${sec('git-branch','Logic',b.logic)}${sec('boxes','Components',b.components)}</div></div>`;
    requestAnimationFrame(() => { const o = document.getElementById('ov-brief'); if(o) o.classList.add('open'); }); lucide.createIcons();
  }
  function toggleHeaderSearch(){ var o = document.getElementById('headerSearchOverlay'); if(!o) return; var open = o.classList.toggle('active'); var i = document.getElementById('headerSearchInput'); if(open){ if(i) setTimeout(function(){ i.focus(); }, 100); } else if(i){ i.value = ''; } }
  function toggleHeaderDrop(name){ var el = document.getElementById('drop' + name.charAt(0).toUpperCase() + name.slice(1)); if(el) el.classList.toggle('hidden'); }
  function closeHeaderDrop(name){ var el = document.getElementById('drop' + name.charAt(0).toUpperCase() + name.slice(1)); if(el) el.classList.add('hidden'); }
  document.addEventListener('click', function(e){ if(!e.target.closest('#dropCommunity') && !e.target.closest('[onclick*=toggleHeaderDrop]')) closeHeaderDrop('community'); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ document.querySelectorAll('.ov.open').forEach(o => closeOverlay(o.id)); } });

  const ER = {
    server:  { t:'Something went wrong on our side', icon:'server-crash', c:['#FDECEF','#DC183C'], b:'It is not you. We have been told and are on it. Your work is saved up to your last action.', ref:true },
    offline: { t:'You are offline', icon:'wifi-off', c:['#FFF1E0','#AE6B0A'], b:'Check your data or Wi-Fi. We will reconnect automatically and anything you typed is kept on this page.' },
    busy:    { t:'We are busier than usual', icon:'hourglass', c:['#E5EFFB','#3B82F6'], b:'Too many requests right now. Wait a few seconds and try again.' },
    maint:   { t:'Back shortly', icon:'wrench', c:['#F0F5F9','#0C1F31'], b:'We are making improvements and will be back within the hour. Funding applications already sent are not affected.' }
  };
  let er = new URLSearchParams(location.search).get('state'); if(!ER[er]) er = 'server';
  function erRender(){
    document.getElementById('er-states').innerHTML = '<span class="font-bold uppercase tracking-widest text-slate-400 self-center mr-1">Mockup state</span>' + [['server','Server error (500)'],['offline','Offline'],['busy','Too many requests (429)'],['maint','Maintenance (503)']].map(x => `<button onclick="er='${x[0]}';erRender()" class="h-7 px-3 rounded-full font-bold ${er === x[0] ? 'bg-[#0C1F31] text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${x[1]}</button>`).join('');
    const e = ER[er], ref = 'Ref ' + Math.random().toString(36).slice(2, 8).toUpperCase();
    document.getElementById('er-card').innerHTML = `<div class="w-16 h-16 rounded-2xl mx-auto grid place-items-center" style="background:${e.c[0]};color:${e.c[1]}"><i data-lucide="${e.icon}" class="w-8 h-8"></i></div><h1 class="font-jakarta font-extrabold text-2xl tracking-tight mt-5 flex items-center justify-center gap-2">${e.t} <button onclick="openBrief('errors')" class="dev-badge w-5 h-5 rounded-full bg-[#DC183C] text-white items-center justify-center text-[10px] font-bold leading-none animate-pulse" title="Implementation notes">i</button></h1><p class="text-slate-500 mt-2 leading-relaxed max-w-md mx-auto">${e.b}</p>
      <div class="mt-6 flex flex-col sm:flex-row gap-2 justify-center"><button onclick="erRetry(this)" class="h-11 px-6 rounded-full bg-[#DC183C] hover:bg-[#B0142F] text-white font-jakarta font-bold text-sm transition">${er === 'maint' ? 'Check again' : 'Try again'}</button><a href="public-home.html" class="h-11 leading-[44px] px-6 rounded-full border border-slate-200 text-sm font-bold hover:border-[#0C1F31] transition">Go to the home page</a></div>
      ${e.ref ? `<p class="text-[11px] text-slate-400 mt-5 font-mono">${ref}. Quote this if you contact us.</p>` : ''}`;
    lucide.createIcons();
  }
  function erRetry(b){ b.disabled = true; b.textContent = 'Trying...'; setTimeout(() => { b.disabled = false; b.textContent = 'Try again'; showToast(er === 'offline' ? 'Still offline. We will keep trying.' : 'Still not ready. Try again in a moment.'); }, 900); }
  window.addEventListener('offline', () => { er = 'offline'; erRender(); });
  erRender();

  lucide.createIcons();
</script>
<script src="status.js"></script>
<script src="gate-links.js"></script>
</body>
</html>
