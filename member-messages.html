<head>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            jakarta: ['Plus Jakarta Sans', 'sans-serif'],
            inter: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style>
    html, body { font-family: 'Inter', system-ui, sans-serif; }
    .font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: 0.005em; }

    /* Scrollbars */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Reveal */
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .reveal { animation: fadeUp .45s cubic-bezier(.2,.7,.2,1) backwards; }

    /* Composer expand */
    @keyframes expandDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .expand-down { animation: expandDown .3s cubic-bezier(.2,.7,.2,1); }

    /* Toast */
    @keyframes toastIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes toastOut { to { opacity:0; transform:translateY(20px); } }
    .toast-in { animation: toastIn .25s ease forwards; }
    .toast-out { animation: toastOut .25s ease forwards; }

    /* Type stripes, the visual signal that makes the feed scannable */
    .stripe-ask   { box-shadow: inset 4px 0 0 0 #DC183C; }
    .stripe-win   { box-shadow: inset 4px 0 0 0 #29A37A; }
    .stripe-share { box-shadow: inset 4px 0 0 0 #FF9900; }

    /* Card hover lift */
    .card-lift { transition: box-shadow .2s, transform .2s; }
    .card-lift:hover { box-shadow: 0 8px 20px -8px rgba(10,44,61,0.12); transform: translateY(-1px); }

    /* Print-portal hiding (parity with events module) */
    #overlay-root:empty { display:none; }

    /* ===== Dev Mode (implementation notes) ===== */
    .dev-badge { display:none; }
    body.dev-on .dev-badge { display:inline-flex; }
    #devToggle.on { background:#DC183C; color:#fff; border-color:#DC183C; }
    /* Overlays: right drawer (briefs) + centre modal (contribution) */
    .ov { position:fixed; inset:0; z-index:60; }
    .ov-bg { position:absolute; inset:0; background:rgba(12,31,49,.45); backdrop-filter:blur(2px); opacity:0; transition:opacity .3s; }
    .ov.open .ov-bg { opacity:1; }
    .drawer { position:absolute; right:0; top:0; height:100%; width:100%; max-width:440px; background:#fff; box-shadow:-12px 0 40px rgba(12,31,49,.25); overflow-y:auto; transform:translateX(100%); transition:transform .3s cubic-bezier(.2,.7,.2,1); }
    .ov.open .drawer { transform:translateX(0); }
    .modalbox { position:absolute; left:50%; top:50%; transform:translate(-50%,-46%); width:calc(100% - 2rem); max-width:420px; background:#fff; border-radius:1rem; box-shadow:0 24px 60px rgba(12,31,49,.3); opacity:0; transition:transform .25s, opacity .25s; }
    .ov.open .modalbox { transform:translate(-50%,-50%); opacity:1; }
    
    /* Full Header Search Overlay */
    .search-overlay {
      position: absolute;
      inset: 0;
      background: white;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 1rem;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .search-overlay.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    @media (min-width: 640px) {
      .search-overlay { padding: 0 1.5rem; }
    }
  </style>
</head>

<div class="lg:hidden" style="height:calc(64px + env(safe-area-inset-bottom))"></div>
<div id="overlay-root"></div>
<script>
  const BRIEFS = {
    messages: { title:'Messages', sub:'Private one-to-one conversations',
      purpose:'A private inbox between connected members, with a requests tray so strangers cannot land in the main inbox. Replaces the header inbox icon that went nowhere.',
      data:'conversations(id, user_a, user_b, status accepted|request|blocked), messages(id, conversation_id, sender_id, body, image_id, created_at, read_at), blocks(user_id, blocked_id), message_reports.',
      logic:'Connections go straight to the inbox. A message from a non-connection arrives as a Request: the recipient can Accept, Decline or Block, and the sender cannot see read receipts until accepted. Read receipts show Seen on the sender\u2019s last message. Deleting a conversation is for the deleting user only. Blocking hides both ways. Photo attachment (JPG/PNG, 5 MB) is included here but the live decision on message photos is still open (BuddyBoss message-photo decision). Every thread shows a safety line about up-front fees and OTPs. Rate limit new conversations to stop spam. Mail notification for new messages must obey the comms ceiling (transactional class).',
      components:'Conversation list, search, All/Unread/Requests tabs, thread, request banner, composer with photo, new message dialog, conversation menu, report dialog, empty states.' }
  };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  function showToast(msg){
    const el = document.getElementById('toast'); el.classList.remove('hidden');
    el.innerHTML = `<div class="toast-in bg-[#0C1F31] text-white rounded-full pl-3 pr-5 py-2.5 shadow-2xl flex items-center gap-2 text-sm font-semibold" style="border-left:4px solid #29A37A"><i data-lucide="check-circle" class="w-4 h-4" style="color:#29A37A"></i><span>${esc(msg)}</span></div>`;
    lucide.createIcons(); clearTimeout(window.__t); window.__t = setTimeout(() => { el.classList.add('hidden'); el.innerHTML=''; }, 2600);
  }
  function toggleDevMode(){ const on = document.body.classList.toggle('dev-on'); const b = document.getElementById('devToggle'); if(b) b.classList.toggle('on', on); if(on) showToast('Dev Mode on, tap any (i) for implementation notes.'); lucide.createIcons(); }
  function closeOverlay(id){ const el = document.getElementById(id); if(!el) return; el.classList.remove('open'); setTimeout(() => { if(el && el.parentNode) el.remove(); }, 300); }
  function dialog(id, html){ document.getElementById('overlay-root').innerHTML = `<div class="ov" id="${id}"><div class="ov-bg" onclick="closeOverlay('${id}')"></div><div class="modalbox" role="dialog" aria-modal="true">${html}</div></div>`; requestAnimationFrame(() => { const o = document.getElementById(id); if(o) o.classList.add('open'); }); lucide.createIcons(); }
  function confirmDialog(title, body, cta, fn, danger){
    window.__cf = fn;
    dialog('ov-confirm', `<div class="p-6"><p class="font-jakarta font-extrabold text-lg">${esc(title)}</p><p class="text-sm text-slate-500 mt-2 leading-relaxed">${esc(body)}</p><div class="mt-5 flex gap-3 justify-end"><button onclick="closeOverlay('ov-confirm')" class="h-10 px-5 rounded-full border border-slate-200 text-sm font-bold hover:border-[#0C1F31] transition">Cancel</button><button onclick="closeOverlay('ov-confirm'); window.__cf()" class="h-10 px-5 rounded-full ${danger === false ? 'bg-[#0C1F31] hover:bg-[#16324a]' : 'bg-[#DC183C] hover:bg-[#B0142F]'} text-white text-sm font-bold transition">${esc(cta)}</button></div></div>`);
  }
  function openBrief(id){
    const b = BRIEFS[id]; if(!b) return;
    const sec = (icon, label, html) => `<div class="px-6 py-4 border-t border-slate-100"><p class="text-[10px] font-bold uppercase tracking-widest text-[#DC183C] flex items-center gap-1.5 mb-2"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${label}</p><div class="text-sm text-slate-600 leading-relaxed">${html}</div></div>`;
    document.getElementById('overlay-root').innerHTML = `<div class="ov" id="ov-brief"><div class="ov-bg" onclick="closeOverlay('ov-brief')"></div><div class="drawer"><div class="sticky top-0 z-10 bg-[#0C1F31] text-white px-6 py-5 flex items-start justify-between"><div class="min-w-0"><p class="text-[10px] font-bold uppercase tracking-widest text-[#FF9900] mb-1">Dev Brief</p><h3 class="font-jakarta font-extrabold text-lg leading-tight">${b.title}</h3><p class="text-xs text-white/60 mt-1">${b.sub}</p></div><button onclick="closeOverlay('ov-brief')" aria-label="Close" class="text-white/60 hover:text-white shrink-0 ml-3"><i data-lucide="x" class="w-5 h-5"></i></button></div>${sec('target','Purpose',b.purpose)}${sec('database','Data model',b.data)}${sec('git-branch','Logic',b.logic)}${sec('boxes','Components',b.components)}</div></div>`;
    requestAnimationFrame(() => { const o = document.getElementById('ov-brief'); if(o) o.classList.add('open'); }); lucide.createIcons();
  }
  function toggleHeaderSearch(){ var o = document.getElementById('headerSearchOverlay'); if(!o) return; var open = o.classList.toggle('active'); var i = document.getElementById('headerSearchInput'); if(open){ if(i) setTimeout(function(){ i.focus(); }, 100); } else if(i){ i.value = ''; } }
  function toggleHeaderDrop(name){ var el = document.getElementById('drop' + name.charAt(0).toUpperCase() + name.slice(1)); if(el) el.classList.toggle('hidden'); }
  function closeHeaderDrop(name){ var el = document.getElementById('drop' + name.charAt(0).toUpperCase() + name.slice(1)); if(el) el.classList.add('hidden'); }
  document.addEventListener('click', function(e){ if(!e.target.closest('#dropCommunity') && !e.target.closest('[onclick*=toggleHeaderDrop]')) closeHeaderDrop('community'); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ document.querySelectorAll('.ov.open').forEach(o => closeOverlay(o.id)); } });

  const CONVOS = [
    { id:1, name:'Naledi Mokoena', ini:'NM', role:'Founder, Mokoena Catering', online:true, conn:true, unread:2, msgs:[
      ['them','Hi Tshepho, saw your win about the first corporate catering contract. Congratulations!','Mon 09:14'],
      ['me','Thank you Naledi. It took three months of follow-ups.','Mon 09:30'],
      ['them','How did you handle cash flow while waiting for them to pay?','Today 08:02'],
      ['them','Asking because I have a similar one coming up.','Today 08:02'] ] },
    { id:2, name:'Sipho Dlamini', ini:'SD', role:'Logistics, Dlamini Freight', online:false, conn:true, unread:0, msgs:[
      ['me','Are you joining the compliance webinar on the 29th?','Fri 14:20'],
      ['them','Yes, I have already registered. See you there.','Fri 16:45'] ] },
    { id:3, name:'Lerato Khumalo', ini:'LK', role:'Designer, Studio Lerato', online:false, conn:false, unread:1, request:true, msgs:[
      ['them','Hello, I am new here. I would love to ask you about invoice financing, I saw your post in the Funding group.','Yesterday 18:03'] ] },
    { id:4, name:'Thandi Mabasa', ini:'TM', role:'Bookkeeper', online:true, conn:true, unread:0, msgs:[
      ['them','I can send you the VAT checklist template I mentioned.','Wed 11:10'],
      ['me','That would be great, thank you.','Wed 11:12'] ] }
  ];
  let tab = 'all', active = null, mobileThread = false;

  function renderTabs(){
    const req = CONVOS.filter(c => c.request && !c.handled).length, unr = CONVOS.filter(c => c.unread && !c.request).length;
    document.getElementById('m-tabs').innerHTML = [['all','All'],['unread','Unread' + (unr ? ' (' + unr + ')' : '')],['requests','Requests' + (req ? ' (' + req + ')' : '')]].map(t => `<button onclick="tab='${t[0]}';renderTabs();renderList()" class="h-8 px-3.5 rounded-full text-[12.5px] font-bold transition ${tab === t[0] ? 'bg-[#0C1F31] text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${t[1]}</button>`).join('');
  }
  function renderList(){
    const q = document.getElementById('m-search').value.toLowerCase();
    let list = CONVOS.filter(c => !c.deleted);
    list = list.filter(c => tab === 'requests' ? (c.request && !c.handled) : (!c.request || c.handled));
    if(tab === 'unread') list = list.filter(c => c.unread);
    if(q) list = list.filter(c => (c.name + ' ' + c.msgs.map(m => m[1]).join(' ')).toLowerCase().includes(q));
    const el = document.getElementById('m-items');
    if(!list.length){ el.innerHTML = `<div class="p-8 text-center"><div class="w-12 h-12 rounded-full bg-slate-100 grid place-items-center mx-auto"><i data-lucide="${tab === 'requests' ? 'user-plus' : 'message-square'}" class="w-6 h-6 text-slate-400"></i></div><p class="font-jakarta font-bold mt-3">${tab === 'requests' ? 'No message requests' : q ? 'No matches' : 'No messages yet'}</p><p class="text-sm text-slate-500 mt-1">${tab === 'requests' ? 'When someone you are not connected to writes to you, it lands here first.' : q ? 'Try a different name or word.' : 'Find a member to start a conversation.'}</p>${!q && tab !== 'requests' ? '<a href="members.html" class="inline-block mt-4 h-10 leading-10 px-5 rounded-full bg-[#DC183C] text-white font-bold text-sm">Find members</a>' : ''}</div>`; lucide.createIcons(); return; }
    el.innerHTML = list.map(c => { const last = c.msgs[c.msgs.length - 1]; return `<button onclick="openConvo(${c.id})" class="w-full text-left flex gap-3 px-4 py-3.5 border-b border-slate-100 hover:bg-slate-50 transition ${active === c.id ? 'bg-[#FDECEF]/50' : ''}">
      <div class="relative shrink-0"><div class="w-11 h-11 rounded-full bg-gradient-to-br from-[#0C1F31] to-[#42505E] grid place-items-center text-white text-xs font-bold">${c.ini}</div>${c.online ? '<span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-[#29A37A] ring-2 ring-white"></span>' : ''}</div>
      <div class="min-w-0 flex-1"><div class="flex justify-between gap-2"><p class="font-jakarta text-[14px] ${c.unread ? 'font-extrabold' : 'font-bold'} truncate">${esc(c.name)}</p><span class="text-[11px] text-slate-400 shrink-0">${esc(last[2].split(' ').pop() === 'AM' ? last[2] : last[2].replace(/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun|Today|Yesterday) /, ''))}</span></div>
      <p class="text-[13px] ${c.unread ? 'text-[#121A21] font-semibold' : 'text-slate-500'} truncate">${last[0] === 'me' ? 'You: ' : ''}${esc(last[1])}</p></div>
      ${c.unread ? `<span class="shrink-0 self-center min-w-5 h-5 px-1.5 rounded-full bg-[#DC183C] text-white text-[11px] font-bold grid place-items-center">${c.unread}</span>` : ''}</button>`; }).join('');
    lucide.createIcons();
  }
  function openConvo(id){
    active = id; const c = CONVOS.find(x => x.id === id); c.unread = c.request && !c.handled ? c.unread : 0; mobileThread = true; renderTabs(); renderList(); renderThread();
    const t = document.getElementById('m-thread'); t.classList.remove('hidden'); t.classList.add('flex'); document.getElementById('m-list').classList.add('hidden', 'lg:flex');
  }
  function backToList(){ mobileThread = false; document.getElementById('m-thread').classList.add('hidden'); document.getElementById('m-thread').classList.remove('flex'); document.getElementById('m-list').classList.remove('hidden'); }
  function renderThread(){
    const t = document.getElementById('m-thread'); const c = CONVOS.find(x => x.id === active);
    if(!c){ t.innerHTML = `<div class="m-auto text-center p-8"><div class="w-14 h-14 rounded-full bg-slate-100 grid place-items-center mx-auto"><i data-lucide="messages-square" class="w-7 h-7 text-slate-400"></i></div><p class="font-jakarta font-bold mt-3">Select a conversation</p><p class="text-sm text-slate-500 mt-1">Or start a new one.</p></div>`; lucide.createIcons(); return; }
    const req = c.request && !c.handled;
    t.innerHTML = `<div class="flex items-center gap-3 px-4 py-3 border-b border-slate-200 bg-white"><button onclick="backToList()" aria-label="Back" class="lg:hidden p-1.5 -ml-1.5 text-slate-500"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-[#0C1F31] to-[#42505E] grid place-items-center text-white text-xs font-bold shrink-0">${c.ini}</div>
        <div class="min-w-0 flex-1"><a href="single-member.html" class="font-jakarta font-bold text-[14.5px] hover:text-[#DC183C] truncate block">${esc(c.name)}</a><p class="text-[12px] text-slate-500 truncate">${c.online ? '<span class="text-[#29A37A] font-semibold">Online</span> · ' : ''}${esc(c.role)}</p></div>
        <div class="relative"><button onclick="event.stopPropagation();document.getElementById('tmenu').classList.toggle('hidden')" aria-label="Conversation options" class="p-2 rounded-lg text-slate-500 hover:bg-slate-50"><i data-lucide="more-vertical" class="w-5 h-5"></i></button>
          <div id="tmenu" class="hidden absolute right-0 top-full mt-1 w-52 bg-white rounded-xl border border-slate-200 shadow-xl py-1.5 z-20 text-[13.5px] font-semibold text-slate-700">
            <a href="single-member.html" class="px-4 py-2 flex items-center gap-3 hover:bg-slate-50"><i data-lucide="user" class="w-4 h-4"></i>View profile</a>
            <button onclick="act('mute')" class="w-full text-left px-4 py-2 flex items-center gap-3 hover:bg-slate-50"><i data-lucide="bell-off" class="w-4 h-4"></i>Mute conversation</button>
            <button onclick="act('delete')" class="w-full text-left px-4 py-2 flex items-center gap-3 hover:bg-slate-50"><i data-lucide="trash-2" class="w-4 h-4"></i>Delete conversation</button>
            <div class="my-1 border-t border-slate-100"></div>
            <button onclick="act('block')" class="w-full text-left px-4 py-2 flex items-center gap-3 hover:bg-slate-50"><i data-lucide="ban" class="w-4 h-4"></i>Block ${esc(c.name.split(' ')[0])}</button>
            <button onclick="act('report')" class="w-full text-left px-4 py-2 flex items-center gap-3 hover:bg-slate-50 text-[#DC183C]"><i data-lucide="flag" class="w-4 h-4"></i>Report</button></div></div></div>
      ${req ? `<div class="bg-[#FFF8EC] border-b border-[#F5DDB0] px-4 py-3 text-[13px]"><p class="font-bold text-[#7A4B05]">${esc(c.name)} is not one of your connections.</p><p class="text-[#7A4B05]/80 mt-0.5">They cannot see when you read this. Accept to reply and move it to your inbox.</p><div class="mt-2.5 flex gap-2"><button onclick="act('accept')" class="h-9 px-4 rounded-full bg-[#0C1F31] text-white text-[13px] font-bold">Accept</button><button onclick="act('decline')" class="h-9 px-4 rounded-full border border-[#E5C98F] text-[13px] font-bold hover:bg-white">Decline</button><button onclick="act('block')" class="h-9 px-4 rounded-full text-[#DC183C] text-[13px] font-bold hover:bg-white">Block</button></div></div>` : ''}
      <div id="m-body" class="flex-1 overflow-y-auto px-4 py-4 space-y-2.5">${c.msgs.map((m, i) => bubble(m, i, c)).join('')}<div id="typing" class="hidden text-[12px] text-slate-400 pl-1">${esc(c.name.split(' ')[0])} is typing...</div></div>
      <div class="px-4 pb-1 text-[11.5px] text-slate-400 flex items-center gap-1.5"><i data-lucide="shield-alert" class="w-3.5 h-3.5 shrink-0"></i> Never pay an up-front fee or share a PIN, OTP or ID copy in a message. Report anything that looks suspicious.</div>
      ${req ? '<div class="p-4 text-center text-[13px] text-slate-500 border-t border-slate-200 bg-white">Accept this request to reply.</div>' : `<div class="p-3 border-t border-slate-200 bg-white"><div id="m-attach" class="hidden mb-2"></div><div class="flex items-end gap-2">
        <input id="m-file" type="file" accept="image/jpeg,image/png" class="hidden" onchange="attachPhoto(this.files[0])">
        <button onclick="document.getElementById('m-file').click()" aria-label="Attach photo" class="p-2.5 rounded-full text-slate-500 hover:bg-slate-100"><i data-lucide="image" class="w-5 h-5"></i></button>
        <textarea id="m-text" rows="1" placeholder="Write a message" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}" class="flex-1 max-h-32 resize-none rounded-2xl border border-slate-200 px-4 py-2.5 text-[14.5px] outline-none focus:border-[#DC183C]"></textarea>
        <button onclick="send()" aria-label="Send" class="h-11 w-11 rounded-full bg-[#DC183C] hover:bg-[#B0142F] text-white grid place-items-center transition"><i data-lucide="send" class="w-5 h-5"></i></button></div></div>`}`;
    lucide.createIcons(); const b = document.getElementById('m-body'); if(b) b.scrollTop = b.scrollHeight;
  }
  function bubble(m, i, c){
    const me = m[0] === 'me'; const last = i === c.msgs.length - 1;
    return `<div class="flex ${me ? 'justify-end' : 'justify-start'}"><div class="max-w-[78%]"><div class="${me ? 'bg-[#0C1F31] text-white rounded-2xl rounded-br-md' : 'bg-white border border-slate-200 rounded-2xl rounded-bl-md'} px-4 py-2.5 text-[14.5px] leading-snug">${m[3] ? `<img src="${m[3]}" alt="Photo" class="rounded-lg mb-2 max-h-48">` : ''}${esc(m[1])}</div><p class="text-[11px] text-slate-400 mt-1 ${me ? 'text-right' : ''}">${esc(m[2])}${me && last && c.seen ? ' · Seen' : ''}</p></div></div>`;
  }
  let pending = null;
  function attachPhoto(f){ if(!f) return; if(f.size > 5 * 1024 * 1024){ showToast('That photo is over 5 MB.'); return; } const r = new FileReader(); r.onload = () => { pending = r.result; const a = document.getElementById('m-attach'); a.classList.remove('hidden'); a.innerHTML = `<div class="relative inline-block"><img src="${pending}" class="h-20 rounded-lg border border-slate-200" alt="Photo to send"><button onclick="pending=null;document.getElementById('m-attach').classList.add('hidden')" aria-label="Remove photo" class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-[#0C1F31] text-white grid place-items-center"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></div>`; lucide.createIcons(); }; r.readAsDataURL(f); }
  function send(){
    const c = CONVOS.find(x => x.id === active); const ta = document.getElementById('m-text'); const v = ta.value.trim(); if(!v && !pending) return;
    c.msgs.push(['me', v || 'Photo', 'Now', pending]); pending = null; c.seen = false; renderThread(); renderList();
    setTimeout(() => { const ty = document.getElementById('typing'); if(ty && active === c.id) ty.classList.remove('hidden'); }, 700);
    setTimeout(() => { c.msgs.push(['them', 'Thanks, I will have a look and get back to you.', 'Now']); c.seen = true; if(active === c.id){ renderThread(); } renderList(); }, 2400);
  }
  function act(a){
    document.getElementById('tmenu') && document.getElementById('tmenu').classList.add('hidden');
    const c = CONVOS.find(x => x.id === active);
    if(a === 'mute') return showToast('Muted. You will not be notified, messages still arrive.');
    if(a === 'accept'){ c.handled = true; c.unread = 0; renderTabs(); renderList(); renderThread(); return showToast('Accepted. You can reply now.'); }
    if(a === 'decline'){ c.deleted = true; active = null; renderTabs(); renderList(); renderThread(); backToList(); return showToast('Request declined. They are not told.'); }
    if(a === 'delete') return confirmDialog('Delete this conversation?', 'It is removed for you only. ' + c.name.split(' ')[0] + ' keeps their copy.', 'Delete', () => { c.deleted = true; active = null; renderTabs(); renderList(); renderThread(); backToList(); showToast('Conversation deleted.'); });
    if(a === 'block') return confirmDialog('Block ' + c.name + '?', 'They can no longer message you or see your profile details. You can unblock in Account Settings, Privacy.', 'Block', () => { c.deleted = true; active = null; renderTabs(); renderList(); renderThread(); backToList(); showToast(c.name + ' blocked.'); });
    if(a === 'report') return dialog('ov-rep', `<div class="p-6"><p class="font-jakarta font-extrabold text-lg">Report this conversation</p><p class="text-sm text-slate-500 mt-1">A moderator reads the messages you report. The other person is not told.</p><div class="mt-4 space-y-1.5">${['Spam or self-promotion','Scam, or asks for money up front','Harassment or abuse','Shares private details','Something else'].map(r => `<label class="flex items-center gap-3 rounded-lg border border-slate-200 px-3 py-2.5 text-sm font-semibold cursor-pointer hover:border-[#0C1F31]"><input type="radio" name="r" onchange="document.getElementById('rg').disabled=false"> ${r}</label>`).join('')}</div><div class="mt-4 flex gap-3 justify-end"><button onclick="closeOverlay('ov-rep')" class="h-10 px-5 rounded-full border border-slate-200 text-sm font-bold">Cancel</button><button id="rg" disabled onclick="closeOverlay('ov-rep');showToast('Thanks. A moderator will review it.')" class="h-10 px-5 rounded-full bg-[#DC183C] text-white text-sm font-bold disabled:opacity-40">Send report</button></div></div>`);
  }
  function newMessage(){
    const people = [['Thandi Mabasa','Bookkeeper'],['Sipho Dlamini','Logistics'],['Naledi Mokoena','Catering'],['Zanele Ndlovu','Retail']];
    dialog('ov-new', `<div class="p-6"><p class="font-jakarta font-extrabold text-lg">New message</p><input id="nm-to" oninput="nmFilter()" placeholder="Search your connections" class="mt-3 w-full h-10 rounded-lg border border-slate-200 px-3 text-sm outline-none focus:border-[#DC183C]"><div id="nm-list" class="mt-2 max-h-48 overflow-y-auto"></div><textarea id="nm-text" rows="3" placeholder="Write a message" class="mt-3 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none focus:border-[#DC183C]"></textarea><p class="text-[11.5px] text-slate-400 mt-1.5">You can message your connections. Not connected yet? Send a connection request from their profile first.</p><div class="mt-4 flex gap-3 justify-end"><button onclick="closeOverlay('ov-new')" class="h-10 px-5 rounded-full border border-slate-200 text-sm font-bold">Cancel</button><button onclick="nmSend()" class="h-10 px-5 rounded-full bg-[#DC183C] hover:bg-[#B0142F] text-white text-sm font-bold">Send</button></div></div>`);
    window.__people = people; window.__to = null; nmFilter();
  }
  function nmFilter(){ const q = (document.getElementById('nm-to').value || '').toLowerCase(); document.getElementById('nm-list').innerHTML = window.__people.filter(p => p[0].toLowerCase().includes(q)).map(p => `<button onclick="window.__to='${p[0]}';document.getElementById('nm-to').value='${p[0]}';nmFilter()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-50 text-sm font-semibold ${window.__to === p[0] ? 'bg-[#FDECEF]' : ''}">${p[0]} <span class="text-slate-400 font-medium">· ${p[1]}</span></button>`).join('') || '<p class="text-sm text-slate-400 px-3 py-2">No connection with that name.</p>'; }
  function nmSend(){ if(!window.__to) return showToast('Choose who to message.'); const v = document.getElementById('nm-text').value.trim(); if(!v) return showToast('Write a message first.'); let c = CONVOS.find(x => x.name === window.__to); if(!c){ c = { id: 50 + CONVOS.length, name: window.__to, ini: window.__to.split(' ').map(w => w[0]).join(''), role:'Member', online:false, conn:true, unread:0, msgs:[] }; CONVOS.unshift(c); } c.msgs.push(['me', v, 'Now']); closeOverlay('ov-new'); tab = 'all'; renderTabs(); openConvo(c.id); showToast('Message sent.'); }
  document.addEventListener('click', () => { const m = document.getElementById('tmenu'); if(m) m.classList.add('hidden'); });
  renderTabs(); renderList(); renderThread();
  if(window.innerWidth >= 1024) openConvo(1);

  lucide.createIcons();
</script>
<script src="status.js"></script>
<script src="gate-links.js"></script>
<script>window.SME_MEMBER_PAGE=true;</script>
<script src="member-chrome.js"></script>
</body>
