<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forums | SME HUB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{jakarta:['Plus Jakarta Sans','sans-serif'],inter:['Inter','system-ui','sans-serif'],mono:['ui-monospace','monospace']},colors:{primary:'#DC183C',accent:'#FF9900',navy:'#0C1F31',success:'#29A37A',ink:'#121A21'}}}};</script>
  <style>
    html,body{font-family:'Inter',system-ui,sans-serif;} .font-jakarta{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:.005em;}
    .no-scrollbar::-webkit-scrollbar{display:none;} .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}} .reveal{animation:fadeUp .45s cubic-bezier(.2,.7,.2,1) backwards;}
    @keyframes toastIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}} @keyframes toastOut{to{opacity:0;transform:translateY(20px);}}
    .toast-in{animation:toastIn .25s ease forwards;} .toast-out{animation:toastOut .25s ease forwards;}
    .card-lift{transition:box-shadow .2s,transform .2s;} .card-lift:hover{box-shadow:0 8px 20px -8px rgba(10,44,61,.12);transform:translateY(-1px);}
    .cnav.active{color:#DC183C;border-color:#DC183C;} .seg.active{background:#0C1F31;color:#fff;}
    #overlay-root:empty{display:none;}
    .ov{position:fixed;inset:0;z-index:60;} .ov-bg{position:absolute;inset:0;background:rgba(12,31,49,.45);backdrop-filter:blur(2px);opacity:0;transition:opacity .3s;} .ov.open .ov-bg{opacity:1;}
    .drawer{position:absolute;right:0;top:0;height:100%;width:100%;max-width:440px;background:#fff;box-shadow:-12px 0 40px rgba(12,31,49,.25);overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.7,.2,1);} .ov.open .drawer{transform:translateX(0);}
    .dev-badge{display:none;} body.dev-on .dev-badge{display:inline-flex;} #devToggle.on{background:#DC183C;color:#fff;border-color:#DC183C;}
      /* HEADER-SEARCH-CSS */
    .search-overlay { position:absolute; inset:0; background:white; z-index:50; display:flex; align-items:center; justify-content:center; padding:0 1rem; opacity:0; pointer-events:none; transform:translateY(-10px); transition:all .3s cubic-bezier(.2,.8,.2,1); }
    .search-overlay.active { opacity:1; pointer-events:auto; transform:translateY(0); }
    @media (min-width:640px){ .search-overlay{ padding:0 1.5rem; } }
</style>
</head>
<body class="bg-[#FCFCFC] text-[#121A21] font-inter">

<header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm relative">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">

    <!-- Logo (Left) -->
    <a href="public-home.html" class="flex items-center shrink-0 group mr-6 py-2">
      <img src="https://smesouthafrica.co.za/wp-content/uploads/2025/10/Asset-1-1.webp" alt="SME South Africa" class="h-10 sm:h-11 w-auto object-contain group-hover:scale-105 transition-transform" />
    </a>

    <!-- Primary Navigation (Center - BuddyBoss Style) -->
    <nav class="hidden md:flex items-center justify-center gap-2 flex-1 px-4 h-full">
      <a href="member-hub.html" class="px-3 h-full text-[14px] font-semibold font-jakarta text-[#6A7581] hover:text-[#DC183C] border-b-[3px] border-transparent flex items-center gap-2 transition-colors"><i data-lucide="activity" class="w-4 h-4"></i> Home</a>
      <a href="members.html" class="px-3 h-full text-[14px] font-semibold font-jakarta text-[#6A7581] hover:text-[#DC183C] border-b-[3px] border-transparent flex items-center gap-2 transition-colors"><i data-lucide="user" class="w-4 h-4"></i> Members</a>
      <a href="groups.html" class="px-3 h-full text-[14px] font-semibold font-jakarta text-[#6A7581] hover:text-[#DC183C] border-b-[3px] border-transparent flex items-center gap-2 transition-colors"><i data-lucide="users" class="w-4 h-4"></i> Groups</a>
      <a href="forums.html" class="px-3 h-full text-[14px] font-bold font-jakarta text-[#DC183C] border-b-[3px] border-[#DC183C] flex items-center gap-2 transition-colors"><i data-lucide="message-square" class="w-4 h-4 text-[#DC183C]"></i> Forums <i data-lucide="chevron-down" class="w-3 h-3 ml-[-2px] opacity-50"></i></a>
    </nav>

    <!-- Utility & Profile (Right) -->
    <div class="flex items-center justify-end gap-4 shrink-0">

      <!-- Search Trigger -->
      <button onclick="toggleHeaderSearch()" class="text-slate-500 hover:text-[#121A21] transition-colors p-1.5" aria-label="Open search">
        <i data-lucide="search" class="w-5 h-5"></i>
      </button>

      <div class="w-px h-6 bg-slate-200 hidden sm:block mx-1"></div>

      <!-- Action Icons -->
      <div class="hidden sm:flex items-center gap-2">
        <button class="relative text-slate-500 hover:text-[#121A21] transition-colors p-1.5" aria-label="Messages">
          <i data-lucide="inbox" class="w-5 h-5"></i>
          <span class="absolute top-0 right-0 w-4 h-4 bg-[#DC183C] text-white text-[9px] font-bold rounded-full flex items-center justify-center ring-2 ring-white shadow-sm">1</span>
        </button>
        <button class="relative text-slate-500 hover:text-[#121A21] transition-colors p-1.5" aria-label="Notifications">
          <i data-lucide="bell" class="w-5 h-5"></i>
          <span class="absolute top-0 right-0 w-4 h-4 bg-[#DC183C] text-white text-[9px] font-bold rounded-full flex items-center justify-center ring-2 ring-white shadow-sm">8</span>
        </button>
        <button class="relative text-slate-500 hover:text-[#121A21] transition-colors p-1.5" aria-label="Cart">
          <i data-lucide="shopping-cart" class="w-5 h-5"></i>
          <span class="absolute top-0 right-0 w-4 h-4 bg-[#DC183C] text-white text-[9px] font-bold rounded-full flex items-center justify-center ring-2 ring-white shadow-sm">4</span>
        </button>
      </div>

      <!-- User Profile Dropdown -->
      <div class="relative ml-1 sm:ml-2 cursor-pointer group">
        <div class="flex items-center gap-3">
          <span class="font-jakarta font-bold text-[15px] text-[#121A21] hidden md:block">Tshepho</span>
          <div class="w-9 h-9 rounded-full bg-gradient-to-br from-[#DC183C] to-[#FF9900] grid place-items-center font-jakarta font-bold text-white text-xs ring-2 ring-white shadow-sm group-hover:scale-105 transition-transform">TJ</div>
        </div>

        <!-- Dropdown Menu -->
        <div class="absolute right-0 top-full mt-3 w-64 bg-white rounded-xl shadow-xl border border-slate-100 overflow-hidden z-50 transform origin-top-right scale-95 opacity-0 pointer-events-none transition-all duration-200 group-hover:scale-100 group-hover:opacity-100 group-hover:pointer-events-auto">
          <div class="p-4 border-b border-slate-100 flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-[#DC183C] to-[#FF9900] grid place-items-center font-jakarta font-bold text-white text-sm shrink-0">TJ</div>
            <div class="min-w-0">
              <p class="font-jakarta font-bold text-sm text-[#121A21] truncate">Tshepho Joel</p>
              <p class="text-xs text-slate-500 truncate">@tshephojoel</p>
            </div>
          </div>
          <div class="p-2 text-sm text-slate-700 font-medium">
            <a href="single-member.html" class="block px-3 py-2 rounded-lg hover:bg-slate-50 hover:text-[#DC183C] transition-colors">Profile</a>
            <a href="member-account.html" class="block px-3 py-2 rounded-lg hover:bg-slate-50 hover:text-[#DC183C] transition-colors">Account Settings</a>
            <a href="#" class="block px-3 py-2 rounded-lg hover:bg-slate-50 hover:text-[#DC183C] transition-colors flex items-center justify-between">Orders <span class="bg-slate-100 text-slate-500 text-[10px] font-bold px-2 py-0.5 rounded-full">4</span></a>
          </div>
          <div class="p-2 border-t border-slate-100">
            <a href="#" class="block px-3 py-2 text-sm font-semibold text-[#DC183C] hover:bg-[#FDECEF] rounded-lg transition-colors">Sign Out</a>
          </div>
          <div class="px-5 py-3 border-t border-slate-100 bg-slate-50 flex items-center justify-between">
            <span class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Dev Mode</span>
            <button id="devToggle" onclick="toggleDevMode()" class="w-8 h-4 rounded-full bg-slate-200 relative transition-colors focus:outline-none" aria-pressed="false">
              <span class="absolute left-0.5 top-0.5 w-3 h-3 rounded-full bg-white shadow-sm transition-transform duration-200"></span>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Full Header Search Overlay -->
  <div id="headerSearchOverlay" class="search-overlay">
    <div class="w-full max-w-4xl flex items-center gap-4">
      <div class="relative flex-1">
        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
        <input type="text" id="headerSearchInput" placeholder="Search members, groups, forums..." class="w-full h-12 pl-12 pr-4 text-base bg-slate-50 border border-[#DC183C] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#DC183C]/20 transition-all shadow-sm">
      </div>
      <button onclick="toggleHeaderSearch()" class="text-slate-500 hover:text-[#121A21] p-2 transition-colors shrink-0" aria-label="Close search">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
    </div>
  </div>
</header>

<div class="max-w-7xl mx-auto px-4 sm:px-6 pt-6">
  <!-- Breadcrumb (global pattern) -->
  <nav aria-label="Breadcrumb" class="text-xs text-[#6A7581] flex items-center flex-wrap gap-x-1.5"><a href="public-home.html" class="hover:text-[#DC183C] transition">Home</a><span class="text-slate-300">›</span><a href="member-hub.html" class="hover:text-[#DC183C] transition">Community</a><span class="text-slate-300">›</span><span class="text-[#121A21] font-medium truncate">Forums</span></nav>
</div>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
  <div class="flex items-end justify-between gap-3 mb-5 flex-wrap">
    <div>
      <h1 class="font-jakarta font-extrabold text-2xl text-[#121A21] tracking-tight flex items-center gap-2">Forums
        <button onclick="openBrief('forumsdir')" class="dev-badge w-4 h-4 rounded-full bg-[#DC183C] text-white items-center justify-center text-[9px] font-bold leading-none animate-pulse" title="Implementation notes">i</button>
      </h1>
      <p class="text-sm text-slate-500 mt-0.5">Long-form discussions across the community.</p>
    </div>
    <button onclick="openComposer()" class="bg-[#DC183C] hover:bg-[#B0142F] text-white rounded-full px-5 py-2.5 font-jakarta font-bold text-sm transition flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> New discussion</button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <!-- Forum categories -->
    <aside class="lg:col-span-4">
      <div class="lg:sticky lg:top-28">
        <div id="forum-list" class="bg-white rounded-2xl border border-slate-100 overflow-hidden"></div>
      </div>
    </aside>
    <!-- Discussions -->
    <section class="lg:col-span-8 min-w-0">
      <div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-4">
        <div id="segs" class="flex gap-2 overflow-x-auto no-scrollbar"></div>
        <div class="sm:ml-auto relative"><i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i><input id="d-search" oninput="render()" placeholder="Search discussions…" class="bg-white border border-slate-200 rounded-full pl-9 pr-3 py-2 text-sm outline-none focus:border-[#DC183C] w-full sm:w-56"></div>
      </div>
      <div id="discussions" class="space-y-3"></div>
    </section>
  </div>
</main>

<div id="overlay-root"></div>
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50"></div>

<!-- Discussion Composer Modal -->
<div id="composer-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#0C1F31]/60 backdrop-blur-sm" onclick="closeComposer()">
  <div class="bg-white rounded-[12px] w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col" onclick="event.stopPropagation()">
    <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-white">
      <h3 class="font-jakarta font-bold text-lg text-[#121A21]">Start a discussion</h3>
      <button onclick="closeComposer()" aria-label="Close" class="w-8 h-8 rounded-full hover:bg-slate-100 grid place-items-center text-slate-500 transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <form onsubmit="submitDiscussion(event)" class="flex flex-col flex-1">
      <div class="p-6 space-y-4">
        <div>
          <label class="block text-sm font-semibold text-[#0C1F31] mb-1.5">Select a Forum</label>
          <select required class="w-full h-11 rounded-lg border border-slate-200 px-3 text-sm bg-slate-50 outline-none focus:border-[#DC183C]">
            <option value="" disabled selected>Choose the best fit...</option>
            <option value="General Discussion">General Discussion</option>
            <option value="Fintech & Payments">Fintech & Payments</option>
            <option value="Funding & Investment">Funding & Investment</option>
            <option value="Marketing & Growth">Marketing & Growth</option>
            <option value="Operations & Compliance">Operations & Compliance</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-[#0C1F31] mb-1.5">Discussion Title</label>
          <input type="text" required placeholder="Keep it clear and concise..." class="w-full h-11 rounded-lg border border-slate-200 px-3 text-sm bg-slate-50 outline-none focus:border-[#DC183C]">
        </div>
        <div class="relative min-h-[160px] flex flex-col border border-slate-200 rounded-lg bg-slate-50 overflow-hidden focus-within:border-[#DC183C]">
          <div class="px-3 py-2 border-b border-slate-200 bg-white flex items-center gap-2 text-slate-400">
            <button type="button" class="hover:text-slate-600 transition-colors font-bold text-sm" title="Bold">B</button>
            <button type="button" class="hover:text-slate-600 transition-colors italic text-sm" title="Italic">I</button>
            <div class="w-px h-4 bg-slate-200 mx-1"></div>
            <button type="button" class="hover:text-slate-600 transition-colors" title="Link"><i data-lucide="link" class="w-4 h-4"></i></button>
            <button type="button" class="hover:text-slate-600 transition-colors" title="Image"><i data-lucide="image" class="w-4 h-4"></i></button>
          </div>
          <textarea required placeholder="Expand on your topic here..." class="w-full flex-1 p-3 text-[15px] text-[#121A21] placeholder-slate-400 outline-none resize-none bg-transparent leading-relaxed"></textarea>
        </div>
      </div>
      <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex items-center justify-end gap-3">
        <button type="button" onclick="closeComposer()" class="h-10 px-5 rounded-lg font-bold text-sm text-slate-500 hover:bg-slate-200 transition-colors">Cancel</button>
        <button type="submit" class="h-10 px-6 rounded-lg bg-[#DC183C] hover:bg-[#B0142F] text-white font-bold text-sm transition-colors shadow-sm">Post Discussion</button>
      </div>
    </form>
  </div>
</div>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function monogram(i,s=36){const fs=Math.max(10,Math.floor(s*0.38));return `<div class="rounded-full bg-gradient-to-br from-[#DC183C] to-[#FF9900] grid place-items-center font-jakarta font-bold text-white shrink-0" style="width:${s}px;height:${s}px;font-size:${fs}px">${esc(i)}</div>`;}

const FORUMS = [
  { name:'General Discussion', desc:'Anything and everything SME', topics:128, posts:642, last:'25m', color:'#0C1F31' },
  { name:'Fintech & Payments', desc:'Building financial products in SA', topics:54, posts:311, last:'1h', color:'#DC183C' },
  { name:'Funding & Investment', desc:'Raises, grants and investor intros', topics:73, posts:489, last:'3h', color:'#29A37A' },
  { name:'Marketing & Growth', desc:'Acquisition, brand and retention', topics:61, posts:402, last:'5h', color:'#FF9900' },
  { name:'Operations & Compliance', desc:'POPIA, CIPC, SARS, hiring', topics:47, posts:268, last:'1d', color:'#AE6B0A' }
];
const DISCUSSIONS = [
  { id:1, title:'Business advise', forum:'General Discussion', author:'Sipho N.', initials:'SN', replies:5, members:4, last:'2 days, 7 hours ago', pinned:true, locked:false, mine:false, replied:true, favorite:false, excerpt:'I need to start an investment business helping people invest in SATRIX/SA40 and SA bonds…' },
  { id:2, title:'What is your biggest business problem right now? Let\'s solve it together!', forum:'General Discussion', author:'Amahle H.', initials:'AH', replies:7, members:4, last:'2 weeks ago', pinned:false, locked:false, mine:false, replied:true, favorite:true, excerpt:'Drop your single biggest blocker below and the community will weigh in.' },
  { id:3, title:'Best POPIA-compliant payroll tools for under 15 staff?', forum:'Operations & Compliance', author:'Tshepho J.', initials:'TJ', replies:11, members:8, last:'5 days ago', pinned:false, locked:false, mine:true, replied:false, favorite:false, excerpt:'Looking for something affordable and POPIA-friendly. Gauteng-based recommendations welcome.' },
  { id:4, title:'SARB sandbox — who has been through it?', forum:'Fintech & Payments', author:'Tshepho J.', initials:'TJ', replies:9, members:6, last:'1 week ago', pinned:false, locked:false, mine:true, replied:true, favorite:true, excerpt:'Sharing my notes from the application. Section 4 caught us out…' },
  { id:5, title:'Group rules & introductions — start here', forum:'General Discussion', author:'Admin', initials:'AD', replies:48, members:212, last:'1 week ago', pinned:true, locked:true, mine:false, replied:false, favorite:false, excerpt:'Welcome! Please introduce yourself and read the community guidelines.' },
  { id:6, title:'How do you handle late-paying clients?', forum:'Operations & Compliance', author:'Karabo K.', initials:'KK', replies:23, members:15, last:'3 days ago', pinned:false, locked:false, mine:false, replied:true, favorite:false, excerpt:'We moved to 50% upfront and it changed everything. What works for you?' }
];

const SEGS = [['all','All discussions'],['mine','My discussions'],['replies','My replies']];
const state = { seg:'all', forum:'' };

function renderForums(){
  document.getElementById('forum-list').innerHTML = FORUMS.map(f=>`
    <button onclick="filterForum('${esc(f.name)}')" class="w-full text-left px-4 py-3.5 flex items-center gap-3 hover:bg-slate-50 transition border-b border-slate-100 last:border-0 ${state.forum===f.name?'bg-[#FDECEF]/50':''}">
      <div class="w-9 h-9 rounded-lg grid place-items-center shrink-0" style="background:${f.color}"><i data-lucide="messages-square" class="w-4 h-4 text-white"></i></div>
      <div class="min-w-0 flex-1"><p class="font-jakarta font-bold text-sm text-[#121A21] truncate">${esc(f.name)}</p><p class="text-[11px] text-slate-400">${f.topics} topics · ${f.posts} posts · active ${esc(f.last)}</p></div>
      ${state.forum===f.name?'<i data-lucide="x" class="w-4 h-4 text-slate-400"></i>':'<i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>'}
    </button>`).join('');
  lucide.createIcons();
}
function filterForum(name){ state.forum = state.forum===name ? '' : name; renderForums(); render(); }

function renderSegs(){ document.getElementById('segs').innerHTML = SEGS.map(([id,l])=>`<button onclick="setSeg('${id}')" class="seg ${state.seg===id?'active':''} shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold border ${state.seg===id?'border-[#0C1F31]':'border-slate-200 text-slate-600 hover:bg-slate-50'}">${l}</button>`).join(''); }
function setSeg(s){ state.seg=s; renderSegs(); render(); }

function row(d){
  return `<a href="single-discussion.html" class="block bg-white border border-slate-100 rounded-2xl p-4 card-lift">
    <div class="flex items-start gap-3">
      ${monogram(d.initials,40)}
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2">${d.pinned?'<i data-lucide="pin" class="w-3.5 h-3.5 text-[#AE6B0A] shrink-0"></i>':''}${d.locked?'<i data-lucide="lock" class="w-3.5 h-3.5 text-slate-400 shrink-0"></i>':''}${d.favorite?'<i data-lucide="star" class="w-3.5 h-3.5 text-[#FF9900] shrink-0 fill-current"></i>':''}<p class="font-jakarta font-bold text-[#121A21] truncate">${esc(d.title)}</p></div>
        <p class="text-sm text-slate-500 mt-0.5 leading-snug line-clamp-1">${esc(d.excerpt)}</p>
        <div class="flex items-center gap-3 mt-2 text-[11px] text-slate-400 flex-wrap">
          <span class="inline-flex items-center gap-1"><i data-lucide="messages-square" class="w-3.5 h-3.5"></i> ${esc(d.forum)}</span>
          <span>by ${esc(d.author)}</span>
          <span class="inline-flex items-center gap-1"><i data-lucide="message-circle" class="w-3.5 h-3.5"></i> ${d.replies}</span>
          <span class="inline-flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> ${esc(d.last)}</span>
        </div>
      </div>
    </div>
  </a>`;
}

function render(){
  const q = document.getElementById('d-search').value.toLowerCase();
  let list = DISCUSSIONS.slice();
  if(state.seg==='mine') list = list.filter(d=>d.mine);
  else if(state.seg==='replies') list = list.filter(d=>d.replied);
  if(state.forum) list = list.filter(d=>d.forum===state.forum);
  list = list.filter(d => !q || (d.title+' '+d.excerpt+' '+d.author).toLowerCase().includes(q));
  // pinned first
  list.sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0));
  const host = document.getElementById('discussions');
  const header = state.forum ? `<div class="flex items-center gap-2 mb-1 text-sm"><span class="text-slate-500">Filtered to</span><span class="font-bold text-[#121A21]">${esc(state.forum)}</span><button onclick="filterForum('${esc(state.forum)}')" class="text-[11px] font-bold text-[#DC183C] uppercase hover:underline">clear</button></div>` : '';
  host.innerHTML = header + (list.length ? list.map(row).join('')
    : `<div class="bg-white rounded-2xl border border-slate-100 py-16 text-center text-slate-400"><i data-lucide="message-square-dashed" class="w-8 h-8 mx-auto mb-2"></i><p class="font-semibold">No discussions here yet.</p><button onclick="openComposer()" class="mt-3 bg-[#DC183C] hover:bg-[#B0142F] text-white rounded-full px-4 py-2 text-sm font-bold transition">Start one</button></div>`);
  lucide.createIcons();
}

function openComposer() {
  const modal = document.getElementById('composer-modal');
  modal.classList.remove('hidden');
}

function closeComposer() {
  const modal = document.getElementById('composer-modal');
  modal.classList.add('hidden');
}

function submitDiscussion(e) {
  e.preventDefault();
  closeComposer();
  showToast('Your discussion has been posted.', 'win');
  e.target.reset();
}

const BRIEFS = { forumsdir:{ title:'Forums Directory', sub:'Forum archive & discussions', purpose:'The long-form home (bbPress). Browse forum categories, filter discussions by scope (All / Mine / My replies / Favorites), search, and start topics. Forums hold durable, searchable knowledge that the fast-moving feed can&rsquo;t — and they feed the resource library as member-authored content.', data:'<code>forums[] { id, name, topic_count, post_count, last_active }</code> · <code>topics[] { id, forum_id, title, author, reply_count, pinned, locked, last_active }</code> · per-user flags (mine / replied / favorited).', logic:'Pinned topics float to the top; locked topics disable replies. Scope filters query the viewer&rsquo;s relationship. Topic rows deep-link to the single-topic thread (single-discussion.html).', components:'Forum-category list · scope tabs · search · discussion rows · new-discussion.', specs:'<b>Layout:</b> breadcrumb bar container <code>max-w-7xl</code> = 1280px; main column <code>max-w-6xl</code> = 1152px; both padding-x 16px mobile / 24px desktop (<code>px-4 sm:px-6</code>), main vertical padding 24px (<code>py-6</code>).<br/><b>Breadcrumb:</b> 12px (<code>text-xs</code>) <code>#6A7581</code>, separator <code>›</code> slate-300, current crumb <code>#121A21</code> weight 500.<br/><b>Kicker:</b> 11px weight 700 uppercase tracking widest <code>#DC183C</code>.<br/><b>H1:</b> Plus Jakarta Sans weight 800, 24px (<code>text-2xl</code>), <code>#121A21</code>, tight tracking. Sub-line 14px (<code>text-sm</code>) slate-500, 2px top margin.<br/><b>New-discussion button:</b> bg <code>#DC183C</code> hover <code>#B0142F</code>, rounded-full, padding 20px×10px (<code>px-5 py-2.5</code>), Plus Jakarta Sans weight 700 14px white, Lucide `plus` 16×16.<br/><br/><b>Two-column grid:</b> 12-col grid, 24px gap (<code>lg:grid-cols-12 gap-6</code>). Sidebar spans 4/12 (~33%), discussions span 8/12 (~67%); stacks to single column below lg.<br/><b>Forum sidebar:</b> sticky at 112px offset (<code>lg:top-28</code>). Heading Plus Jakarta Sans weight 700 uppercase 14px (<code>text-sm</code>) <code>#121A21</code> wide tracking, 12px bottom margin. List container white bg rounded-2xl (16px) 1px border slate-100.<br/><b>Forum row:</b> full width, padding 16px×14px (<code>px-4 py-3.5</code>), 12px gap, hover bg slate-50, 1px bottom border slate-100 (last none); active bg <code>#FDECEF</code>/50. Icon tile 36×36 (<code>w-9 h-9</code>) rounded-lg (8px) per-forum colour, Lucide `messages-square` 16×16 white. Name Plus Jakarta Sans weight 700 14px <code>#121A21</code> truncated; meta 11px slate-400 (`·` separators). Trailing Lucide `chevron-right` slate-300 / `x` slate-400 16×16.<br/><br/><b>Scope tabs:</b> padding 14px×6px (<code>px-3.5 py-1.5</code>), rounded-full, 12px weight 700, 1px border. Active bg <code>#0C1F31</code> white; inactive border slate-200 slate-600, hover bg slate-50.<br/><b>Search field:</b> white bg 1px border slate-200 rounded-full, padding-left 36px / right 12px, 8px vertical, 14px, focus border <code>#DC183C</code>, width 100% mobile / 224px (<code>sm:w-56</code>). Lucide `search` 16×16 slate-400 inset 12px.<br/><br/><b>Discussion list:</b> 12px vertical rhythm (<code>space-y-3</code>).<br/><b>Discussion row:</b> white bg 1px border slate-100 rounded-2xl (16px) padding 16px (<code>p-4</code>); hover lifts -1px with shadow <code>0 8px 20px -8px rgba(10,44,61,.12)</code>. 12px gap to avatar.<br/><b>Avatar monogram:</b> 40px circle, gradient <code>#DC183C→#FF9900</code> (135°), Plus Jakarta Sans weight 700 white, font-size ~15px.<br/><b>Status icons:</b> Lucide 14×14 — pin <code>#AE6B0A</code>, lock slate-400, star <code>#FF9900</code> filled.<br/><b>Title:</b> Plus Jakarta Sans weight 700 <code>#121A21</code>, truncated.<br/><b>Excerpt:</b> 14px (<code>text-sm</code>) slate-500, snug leading, clamped to 1 line, 2px top margin.<br/><b>Meta row:</b> 11px slate-400, 8px top margin, 12px gap, Lucide `messages-square` / `message-circle` / `clock` 14×14.<br/><b>Filtered banner:</b> 14px, label slate-500, scope name weight 700 <code>#121A21</code>, clear link 11px weight 700 uppercase <code>#DC183C</code>.<br/><b>Empty state:</b> white rounded-2xl 1px border slate-100, 64px vertical padding, centered slate-400, Lucide `message-square-dashed` 32×32, Start-one button bg <code>#DC183C</code> hover <code>#B0142F</code> white rounded-full padding 16px×8px 14px weight 700.' } };
function toggleDevMode(){const on=document.body.classList.toggle('dev-on');const b=document.getElementById('devToggle');if(b)b.classList.toggle('on',on);if(on)showToast('Dev Mode on — tap any ⓘ for implementation notes.',null);lucide.createIcons();}
function closeOverlay(id){const el=document.getElementById(id);if(!el)return;el.classList.remove('open');setTimeout(()=>{if(el&&el.parentNode)el.remove();},300);}
function openBrief(id){const b=BRIEFS[id];if(!b)return;const sec=(icon,label,html)=>`<div class="px-6 py-4 border-t border-slate-100"><p class="text-[10px] font-bold uppercase tracking-widest text-[#DC183C] flex items-center gap-1.5 mb-2"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${label}</p><div class="text-sm text-slate-600 leading-relaxed">${html}</div></div>`;document.getElementById('overlay-root').innerHTML=`<div class="ov" id="ov-brief"><div class="ov-bg" onclick="closeOverlay('ov-brief')"></div><div class="drawer"><div class="sticky top-0 z-10 bg-[#0C1F31] text-white px-6 py-5 flex items-start justify-between"><div class="min-w-0"><p class="text-[10px] font-bold uppercase tracking-widest text-[#FF9900] mb-1">Dev Brief</p><h3 class="font-jakarta font-extrabold text-lg leading-tight">${b.title}</h3><p class="text-xs text-white/60 mt-1">${b.sub}</p></div><button onclick="closeOverlay('ov-brief')" class="text-white/60 hover:text-white shrink-0 ml-3"><i data-lucide="x" class="w-5 h-5"></i></button></div>${sec('target','Purpose',b.purpose)}${sec('database','Data model',b.data)}${sec('git-branch','Logic',b.logic)}${b.specs ? sec('ruler','Spec values', b.specs) : ''}${sec('boxes','Components',b.components)}</div></div>`;requestAnimationFrame(()=>{const o=document.getElementById('ov-brief');if(o)o.classList.add('open');});lucide.createIcons();}
function showToast(msg,kind){const el=document.getElementById('toast');const color=kind==='ask'?'#DC183C':kind==='win'?'#29A37A':kind==='share'?'#FF9900':'#0C1F31';el.classList.remove('hidden');el.innerHTML=`<div class="toast-in bg-[#0C1F31] text-white rounded-full pl-3 pr-5 py-2.5 shadow-2xl flex items-center gap-2 text-sm font-semibold" style="border-left:4px solid ${color}"><i data-lucide="check-circle" class="w-4 h-4" style="color:${color}"></i><span>${esc(msg)}</span></div>`;lucide.createIcons();setTimeout(()=>{const i=el.firstElementChild;if(i){i.classList.remove('toast-in');i.classList.add('toast-out');}setTimeout(()=>{el.classList.add('hidden');el.innerHTML='';},250);},2400);}

document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.ov.open').forEach(o=>closeOverlay(o.id)); });
