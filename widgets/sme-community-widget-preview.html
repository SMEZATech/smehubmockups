<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community widget preview</title><style>html,body{margin:0}body{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(115deg,#0C1F31 0%,#0C1F31 46%,#2b1626 76%,#5e1a2c 105%)}</style></head><body><!--
  SME South Africa: Community preview widget (the card in the homepage hero).
  Self-contained: HTML + CSS + JavaScript in this one block. No Tailwind, no plugin, no theme needed.

  HOW TO USE (Elementor): add an "HTML" widget, paste this whole file into it. That is all.
  - Put it inside a column on a dark background (the hero is a navy-to-plum gradient: linear-gradient(115deg,#0C1F31 0%,#0C1F31 46%,#2b1626 76%,#5e1a2c 105%)).
  - Width: it fills its column up to 548px and centres itself. Use a column of about 500-548px on desktop.
  - Fonts: Plus Jakarta Sans and Inter load from the <link> tags below. If the site already loads them you can delete those two lines.
  - Edit the copy: change the DATA block at the top of the <script> (posts, groups, events, notifications). Names there are illustrative, not real members.
  - Everything is namespaced (.smew, #smew-i-*), so it cannot clash with Elementor, BuddyBoss or the theme.
  - Behaviour: the Feed auto-plays a conversation (stops as soon as the visitor clicks anything); Groups and Events have Join / Remind me toggles;
    the floating chip and the notification card sit around the card on screens 640px and wider. Respects "reduce motion".
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>.smew,.smew *,.smew *::before,.smew *::after{box-sizing:border-box}
.smew{position:relative;max-width:548px;margin:0 auto;padding:24px 24px 48px;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:#121A21;line-height:1.5;-webkit-font-smoothing:antialiased}
.smew p{margin:0}:where(.smew) button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
.smew-j{font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.smew-i{width:16px;height:16px;flex:none;display:inline-block;vertical-align:middle}
.smew-card{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 25px 50px -12px rgba(0,0,0,.35);outline:1px solid rgba(255,255,255,.1);position:relative}
.smew-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid #E7EBEF}
.smew-brand{display:flex;align-items:center;gap:10px}
.smew-logo{width:36px;height:36px;border-radius:12px;background:#0C1F31;color:#fff;display:grid;place-items:center}.smew-logo .smew-i{width:18px;height:18px}
.smew-title{font-weight:800;font-size:14px;line-height:1}
.smew-sub{font-size:11px;color:#6A7581;margin-top:6px;display:flex;align-items:center;gap:6px}
.smew-dot{width:6px;height:6px;border-radius:50%;background:#29A37A;animation:smewPulse 1.8s ease-in-out infinite}
@keyframes smewPulse{0%,100%{box-shadow:0 0 0 0 rgba(41,163,122,.55)}50%{box-shadow:0 0 0 5px rgba(41,163,122,0)}}
.smew-pill{display:none;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#DC183C;background:#FDECEF;border-radius:999px;padding:4px 10px}.smew-pill .smew-i{width:12px;height:12px}
.smew-tabs{display:flex;gap:6px;padding:14px 20px 0}
.smew-tab{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:700;background:#F0F5F9;color:#42505E;transition:background .15s}
.smew-tab .smew-i{width:14px;height:14px}.smew-tab:hover{background:#E4ECF2}.smew-tab.is-on{background:#0C1F31;color:#fff}
.smew-body{padding:14px 20px 20px;min-height:330px}
.smew-pane[hidden]{display:none}
.smew-post{border:1px solid #E7EBEF;border-radius:16px;padding:16px}
.smew-row{display:flex;align-items:flex-start;gap:12px}
.smew-av{border-radius:50%;background:linear-gradient(135deg,#DC183C,#FF9900);display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.smew-name{font-weight:700;font-size:14px;line-height:1.25}.smew-name span{font-weight:400;color:#6A7581}
.smew-tag{display:inline-block;margin-top:6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:#FDECEF;color:#DC183C}
.smew-text{font-size:14px;line-height:1.6;margin-top:12px}
.smew-actions{display:flex;align-items:center;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid #E7EBEF;font-size:12.5px;font-weight:600;color:#6A7581}
.smew-actions>*{display:inline-flex;align-items:center;gap:6px}
.smew-like:hover{color:#DC183C}.smew-like.is-liked{color:#DC183C}
.smew-ok{margin-left:auto;color:#29A37A}
.smew-slot{margin-top:12px;min-height:74px}
.smew-reply{display:flex;align-items:flex-start;gap:10px;padding-left:12px;border-left:2px solid #E7EBEF}
.smew-bubble{background:#F0F5F9;border-radius:16px 16px 16px 6px;padding:10px 14px}
.smew-bubble .a{font-size:12px;font-weight:700;line-height:1.25}.smew-bubble .a span{font-weight:400;color:#6A7581}
.smew-bubble .b{font-size:13px;line-height:1.35;margin-top:4px}
.smew-typing{display:inline-flex;align-items:center;background:#F0F5F9;border-radius:16px;padding:14px}
.smew-typing i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#6A7581;margin:0 1.5px;animation:smewDot 1.1s infinite ease-in-out}
.smew-typing i:nth-child(2){animation-delay:.15s}.smew-typing i:nth-child(3){animation-delay:.3s}
@keyframes smewDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.smew-swap{animation:smewSwap .45s cubic-bezier(.2,.7,.2,1)}
@keyframes smewSwap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.smew-list{display:grid;gap:10px}
.smew-item{display:flex;align-items:center;gap:12px;border:1px solid #E7EBEF;border-radius:16px;padding:12px}
.smew-tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}.smew-tile .smew-i{width:20px;height:20px}
.smew-item .t{font-weight:700;font-size:14px;line-height:1.25}.smew-item .d{font-size:12px;color:#6A7581;margin-top:2px}
.smew-item>div{min-width:0;flex:1}.smew-item .d.cut{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smew-btn{flex:none;padding:0 14px;height:32px;border-radius:999px;font-size:12px;font-weight:700;background:#0C1F31;color:#fff;transition:background .15s}
.smew-btn.is-on{background:#E4F5EE;color:#29A37A}
.smew-float{position:absolute;display:none;background:#fff;color:#121A21;box-shadow:0 20px 25px -5px rgba(0,0,0,.2),0 8px 10px -6px rgba(0,0,0,.15);animation:smewBob 5.5s ease-in-out infinite}
@keyframes smewBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.smew-chip{top:6px;right:6px;border-radius:999px;padding:10px 16px;align-items:center;gap:8px;font-weight:700;font-size:14px}.smew-chip .smew-i{color:#DC183C}
.smew-notif{position:relative;display:flex;align-items:center;gap:12px;margin-top:12px;border-radius:16px;border:1px solid #E7EBEF;padding:12px 16px;max-width:260px;animation:smewBob 5.5s ease-in-out infinite;animation-delay:1.4s;background:#fff;box-shadow:0 20px 25px -5px rgba(0,0,0,.2),0 8px 10px -6px rgba(0,0,0,.15)}
.smew-notif .t{font-weight:800;font-size:13px;line-height:1.25}.smew-notif .d{font-size:12px;color:#6A7581;margin-top:2px}
.smew-notif .smew-sw{display:flex;align-items:center;gap:12px}
/* Host themes (BuddyBoss, Elementor kits) restyle every <button> on hover, focus and active. Pin every state so the widget looks the same anywhere. */
.smew .smew-tab,.smew .smew-btn,.smew .smew-like{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;text-transform:none;letter-spacing:normal;min-height:0;margin:0;text-decoration:none}
.smew .smew-tab{font-size:12.5px;font-weight:700;line-height:1;border-radius:999px;height:32px;padding:0 14px}
.smew .smew-btn{font-size:12px;font-weight:700;line-height:1;border-radius:999px;height:32px;padding:0 14px}
.smew .smew-like{font-size:12.5px;font-weight:600;line-height:1.2;padding:0;border-radius:0}
.smew .smew-tab,.smew .smew-tab:focus,.smew .smew-tab:active{background:#F0F5F9;color:#42505E;box-shadow:none;border:0;outline-offset:2px}
.smew .smew-tab:hover{background:#E4ECF2;color:#42505E}
.smew .smew-tab.is-on,.smew .smew-tab.is-on:hover,.smew .smew-tab.is-on:focus,.smew .smew-tab.is-on:active{background:#0C1F31;color:#fff}
.smew .smew-like,.smew .smew-like:hover,.smew .smew-like:focus,.smew .smew-like:active{background:none;box-shadow:none;border:0;color:#6A7581}
.smew .smew-like:hover,.smew .smew-like.is-liked,.smew .smew-like.is-liked:hover{color:#DC183C}
.smew .smew-btn,.smew .smew-btn:hover,.smew .smew-btn:focus,.smew .smew-btn:active{background:#0C1F31;color:#fff;box-shadow:none;border:0}
.smew .smew-btn:hover{background:#16324A}
.smew .smew-btn.is-on,.smew .smew-btn.is-on:hover,.smew .smew-btn.is-on:focus,.smew .smew-btn.is-on:active{background:#E4F5EE;color:#29A37A}
.t-red{background:#FDECEF;color:#DC183C}.t-green{background:#E4F5EE;color:#29A37A}.t-amber{background:#FFF1E0;color:#AE6B0A}.t-navy{background:#F0F5F9;color:#0C1F31}
@media (min-width:640px){.smew-pill{display:inline-flex}.smew-chip{display:flex;top:-6px;right:-6px}.smew-notif{position:absolute;left:-6px;bottom:6px;margin-top:0}}
@media (prefers-reduced-motion:reduce){.smew-dot,.smew-float,.smew-notif,.smew-typing i,.smew-swap{animation:none!important}}</style>

  var ini = function (n) { return n.split(/\s+/).map(function (s) { return s[0]; }).slice(0, 2).join('').toUpperCase(); };
  var av = function (n, size) { return '<span class="smew-av smew-j" style="width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * 0.36) + 'px">' + esc(ini(n)) + '</span>'; };
  var ic = function (n, cls) { return '<svg class="smew-i' + (cls ? ' ' + cls : '') + '" aria-hidden="true" focusable="false"><use href="#smew-i-' + n + '"/></svg>'; };

  function init(root) {
    if (root.getAttribute('data-ready')) { return; }
    root.setAttribute('data-ready', '1');
    var q = function (s) { return root.querySelector(s); }, qa = function (s) { return [].slice.call(root.querySelectorAll(s)); };
    var feed = q('[data-pane="feed"]'), auto = !reduce, timers = [], idx = 0;
    var stop = function () { timers.forEach(clearTimeout); timers = []; };

    qa('[data-pane="groups"]')[0].innerHTML = '<div class="smew-list">' + DATA.groups.map(function (g) {
      return '<div class="smew-item"><div class="smew-tile ' + g.tint + '">' + ic(g.icon) + '</div><div><p class="t smew-j">' + esc(g.name) + '</p><p class="d cut">' + esc(g.desc) + '</p></div><button type="button" class="smew-btn" data-toggle data-on="0" data-on-text="Joined" data-off-text="Join">Join</button></div>';
    }).join('') + '</div>';
    qa('[data-pane="events"]')[0].innerHTML = '<div class="smew-list">' + DATA.events.map(function (e) {
      return '<div class="smew-item"><div class="smew-tile ' + e.tint + '">' + ic(e.icon) + '</div><div><p class="t smew-j">' + esc(e.title) + '</p><p class="d">' + esc(e.when) + '</p></div><button type="button" class="smew-btn" data-toggle data-on="0" data-on-text="Reminder set" data-off-text="Remind me">Remind me</button></div>';
    }).join('') + '</div>';

    function post(i, instant) {
      stop();
      var p = DATA.posts[i];
      feed.innerHTML = '<div class="smew-swap"><div class="smew-post"><div class="smew-row">' + av(p.name, 40) +
        '<div style="min-width:0;flex:1"><p class="smew-name smew-j">' + esc(p.name) + ' <span>· ' + esc(p.role) + '</span></p><span class="smew-tag">' + esc(p.tag) + '</span></div></div>' +
        '<p class="smew-text">' + esc(p.text) + '</p>' +
        '<div class="smew-actions"><button type="button" class="smew-like" data-like aria-pressed="false">' + ic('heart') + '<span>Like</span></button><span>' + ic('message-circle') + 'Reply</span><span class="smew-ok">' + ic('badge-check') + 'Helpful answers</span></div></div>' +
        '<div class="smew-slot" data-slot></div></div>';
      var slot = feed.querySelector('[data-slot]');
      var reply = function () { slot.innerHTML = '<div class="smew-swap smew-reply">' + av(p.reply.name, 32) + '<div class="smew-bubble"><p class="a">' + esc(p.reply.name) + ' <span>· ' + esc(p.reply.role) + '</span></p><p class="b">' + esc(p.reply.text) + '</p></div></div>'; };
      if (instant || reduce) { reply(); }
      else {
        timers.push(setTimeout(function () { slot.innerHTML = '<div class="smew-reply">' + av(p.reply.name, 32) + '<span class="smew-typing"><i></i><i></i><i></i></span></div>'; }, 700));
        timers.push(setTimeout(reply, 2300));
        if (auto) { timers.push(setTimeout(function () { idx = (idx + 1) % DATA.posts.length; post(idx); }, 8200)); }
      }
    }
    function tab(name, byUser) {
      if (byUser) { auto = false; }
      qa('[data-tab]').forEach(function (b) { var on = b.getAttribute('data-tab') === name; b.classList.toggle('is-on', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
      qa('[data-pane]').forEach(function (p) { p.hidden = p.getAttribute('data-pane') !== name; });
      if (name === 'feed') { post(idx, !!byUser); } else { stop(); }
    }
    qa('[data-tab]').forEach(function (b) { b.addEventListener('click', function () { tab(b.getAttribute('data-tab'), true); }); });
    root.addEventListener('click', function (e) {
      var like = e.target.closest('[data-like]');
      if (like) { auto = false; stop(); var on = like.classList.toggle('is-liked'); like.setAttribute('aria-pressed', on ? 'true' : 'false'); like.querySelector('span').textContent = on ? 'Liked' : 'Like'; like.querySelector('use').setAttribute('href', on ? '#smew-i-heart-fill' : '#smew-i-heart'); return; }
      var t = e.target.closest('[data-toggle]');
      if (t) { auto = false; var on2 = t.getAttribute('data-on') !== '1'; t.setAttribute('data-on', on2 ? '1' : '0'); t.textContent = on2 ? t.getAttribute('data-on-text') : t.getAttribute('data-off-text'); t.classList.toggle('is-on', on2); }
    });
    post(0, true);
    if (!reduce) { post(0); }
    var notif = q('[data-notif]'), ni = 0;
    var showN = function (n, anim) { notif.innerHTML = '<div class="smew-sw' + (anim ? ' smew-swap' : '') + '"><div class="smew-tile ' + n.tint + '">' + ic(n.icon) + '</div><div><p class="t smew-j">' + esc(n.title) + '</p><p class="d">' + esc(n.sub) + '</p></div></div>'; };
    showN(DATA.notifs[0], false);
    if (!reduce) { setInterval(function () { ni++; showN(DATA.notifs[ni % DATA.notifs.length], true); }, 5200); }
  }
  [].slice.call(document.querySelectorAll('[data-smew]')).forEach(init);
})();</script>
</body></html>
