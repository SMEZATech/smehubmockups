<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Group · General | SME HUB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = { theme:{ extend:{ fontFamily:{ jakarta:['Plus Jakarta Sans','sans-serif'], inter:['Inter','system-ui','sans-serif'], mono:['ui-monospace','monospace'] }, colors:{ primary:'#DC183C', accent:'#FF9900', navy:'#0C1F31', success:'#29A37A', ink:'#121A21' } } } };
  </script>
  <style>
    html, body { font-family:'Inter', system-ui, sans-serif; }
    .font-jakarta { font-family:'Plus Jakarta Sans', sans-serif; letter-spacing:.005em; }
    .no-scrollbar::-webkit-scrollbar { display:none; } .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .reveal { animation: fadeUp .45s cubic-bezier(.2,.7,.2,1) backwards; }
    @keyframes toastIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes toastOut { to { opacity:0; transform:translateY(20px); } }
    .toast-in { animation: toastIn .25s ease forwards; } .toast-out { animation: toastOut .25s ease forwards; }
    .stripe-ask{box-shadow:inset 4px 0 0 0 #DC183C;} .stripe-win{box-shadow:inset 4px 0 0 0 #29A37A;} .stripe-share{box-shadow:inset 4px 0 0 0 #FF9900;}
    .card-lift{transition:box-shadow .2s, transform .2s;} .card-lift:hover{box-shadow:0 8px 20px -8px rgba(10,44,61,.12); transform:translateY(-1px);}
    .gtab{position:relative; transition:color .15s;} .gtab.active{color:#DC183C;} .gtab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:#DC183C;}
    #overlay-root:empty{display:none;}
    .ov{position:fixed;inset:0;z-index:60;} .ov-bg{position:absolute;inset:0;background:rgba(12,31,49,.45);backdrop-filter:blur(2px);opacity:0;transition:opacity .3s;} .ov.open .ov-bg{opacity:1;}
    .drawer{position:absolute;right:0;top:0;height:100%;width:100%;max-width:440px;background:#fff;box-shadow:-12px 0 40px rgba(12,31,49,.25);overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.7,.2,1);} .ov.open .drawer{transform:translateX(0);}
    .dev-badge{display:none;} body.dev-on .dev-badge{display:inline-flex;} #devToggle.on{background:#DC183C;color:#fff;border-color:#DC183C;}
  </style>
</head>
<body class="bg-[#FCFCFC] text-[#121A21] font-inter">

<!-- HEADER (shared, cross-linked) -->
<header class="bg-slate-100 border-b-2 border-dashed border-slate-400 relative overflow-hidden">
  <div class="absolute inset-0 opacity-30 pointer-events-none" style="background:repeating-linear-gradient(45deg,transparent,transparent 8px,rgba(100,116,139,.18) 8px,rgba(100,116,139,.18) 16px)"></div>
  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center gap-3 sm:gap-4">
    <a href="public-home.html" class="flex items-center gap-2 shrink-0 opacity-70 hover:opacity-100 transition">
      <img src="assets/logo-icon.png" alt="SME South Africa" class="w-7 h-7" />
      <span class="font-jakarta font-extrabold text-[13px] tracking-tight text-slate-700 hidden sm:inline">SME South Africa</span>
    </a>
    <span class="mx-1 hidden sm:inline w-px h-5 bg-slate-300"></span>
    <p class="text-[10px] sm:text-[11px] font-bold uppercase tracking-widest text-slate-600 flex items-center gap-1.5">
      <i data-lucide="construction" class="w-3.5 h-3.5 text-slate-500"></i>
      Header placeholder &middot; design pending
    </p>
    <div class="ml-auto flex items-center gap-2">
      <button id="devToggle" onclick="toggleDevMode()" class="inline-flex items-center gap-1.5 px-2.5 h-8 rounded-full bg-white border border-slate-300 hover:border-[#DC183C] hover:text-[#DC183C] text-[11px] font-bold uppercase tracking-wider text-slate-600 transition" title="Toggle implementation notes"><i data-lucide="code-2" class="w-3.5 h-3.5"></i><span class="hidden sm:inline">Dev</span></button>
      <a href="index.html" class="inline-flex items-center gap-1.5 px-3 h-8 rounded-full bg-white border border-slate-300 hover:border-slate-500 text-[11px] font-bold text-slate-700 transition">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i><span class="hidden sm:inline">Launcher</span>
      </a>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
  <!-- GROUP HERO -->
  <div id="group-hero"></div>

  <div class="mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    <div class="lg:col-span-8 min-w-0">
      <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden">
        <div id="group-subnav" class="flex gap-1 px-2 border-b border-slate-100 overflow-x-auto no-scrollbar"></div>
        <div id="group-content" class="p-4 sm:p-5 bg-slate-50/50"></div>
      </div>
    </div>
    
    <!-- SIDEBAR: Hidden entirely on mobile/tablet (lg breakpoint) -->
    <aside class="hidden lg:block lg:col-span-4 space-y-5">
      <!-- About -->
      <div class="bg-white rounded-2xl border border-slate-100 p-5 reveal">
        <h4 class="font-jakarta font-bold uppercase text-sm text-[#121A21] tracking-wide mb-3">About this group</h4>
        <p class="text-sm text-slate-600 leading-relaxed">Connect, collaborate and grow with fellow South African entrepreneurs. Share insights, ask questions, and celebrate wins together.</p>
        <div class="mt-4 space-y-2 text-sm">
          <div class="flex items-center gap-2 text-slate-600"><i data-lucide="globe" class="w-4 h-4 text-slate-400"></i> Public group</div>
          <div class="flex items-center gap-2 text-slate-600"><i data-lucide="users" class="w-4 h-4 text-slate-400"></i> 1,284 members</div>
          <div class="flex items-center gap-2 text-slate-600"><i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i> Created Mar 2023</div>
        </div>
      </div>
      <!-- Other groups -->
      <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden reveal" style="animation-delay:80ms">
        <div class="px-5 py-3 border-b border-slate-100 flex items-center gap-4">
          <h4 class="font-jakarta font-bold uppercase text-sm text-[#121A21] tracking-wide">Similar groups</h4>
        </div>
        <div id="other-groups"></div>
      </div>
    </aside>
  </div>
</main>

<div id="overlay-root"></div>
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50"></div>

<script>
/* ===== helpers ===== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function monogram(initials,size=44){ const fs=Math.max(10,Math.floor(size*0.38)); return `<div class="rounded-full bg-gradient-to-br from-[#DC183C] to-[#FF9900] grid place-items-center font-jakarta font-bold text-white shrink-0" style="width:${size}px;height:${size}px;font-size:${fs}px">${esc(initials)}</div>`; }
const TYPES = {
  ask:{color:'#DC183C',bgTint:'bg-[#DC183C]/10',text:'text-[#DC183C]',label:'Ask',icon:'help-circle'},
  win:{color:'#29A37A',bgTint:'bg-[#29A37A]/10',text:'text-[#29A37A]',label:'Win',icon:'trophy'},
  share:{color:'#FF9900',bgTint:'bg-[#FF9900]/15',text:'text-[#AE6B0A]',label:'Share',icon:'megaphone'}
};

/* ===== data ===== */
const GROUP = { name:'General', privacy:'Public', members:1284, active:'25 minutes ago', joined:true, subscribed:false };
const G_MEMBERS = [
  { name:'Tshepho Joel',    initials:'TJ', role:'Founder',     company:'Langa Holdings', gRole:'Organizer', province:'Gauteng' },
  { name:'Sello Monare',    initials:'SM', role:'MD',          company:'TechSolve RSA',  gRole:'Member',    province:'Gauteng' },
  { name:'Naledi Mokoena',  initials:'NM', role:'Founder',     company:'GreenTrace',     gRole:'Moderator', province:'Western Cape' },
  { name:'Karabo Kgophane', initials:'KK', role:'E-comm Lead', company:'Mzansi Cart',    gRole:'Member',    province:'Gauteng' },
  { name:'Mandla Dlamini',  initials:'MD', role:'Co-founder',  company:'PesaPay',        gRole:'Member',    province:'Western Cape' },
  { name:'Refiloe Sithole', initials:'RS', role:'Founder',     company:'Skhokho',        gRole:'Member',    province:'Gauteng' }
];

const G_POSTS = [
  { id:1, type:'ask', who:'Sello Monare', initials:'SM', sub:'MD at TechSolve RSA', time:'2h ago', action:'posted an update',
    content:"Anyone have a reliable CIPC annual returns contact that doesn't charge extortionate fees? Gauteng-based preferred.", 
    likes:14, comments:4, liked:false 
  },
  { id:2, type:'share', who:'Tsholofelo Nyahuye', initials:'TN', sub:'Financial Advisor', time:'3 days ago', action:'posted an update',
    title:'BUDGETING for Growth — Building Financial Confidence in Uncertain Times',
    content:"Every successful business begins with a plan. In today's uncertain economic environment, a well-prepared budget is more than just numbers on a spreadsheet—it is a strategic tool that helps business owners make confident decisions, manage cash flow, prepare for tax...",
    link:{ url:'#', title:'Read full article on SME South Africa', domain:'smesouthafrica.co.za' },
    likes:24, comments:5, liked:false 
  },
  { id:3, type:'win', who:'Naledi Mokoena', initials:'NM', sub:'Founder at GreenTrace', time:'5 days ago', action:'shared a photo',
    content:"Signed our 50th enterprise customer today. 14 months ago we had two. Huge milestone for the team! Thank you to this group for the pitch practice 🙌", 
    image:'https://images.unsplash.com/photo-1556761175-5973dc0f32e7?auto=format&fit=crop&q=80&w=800',
    likes:86, comments:22, liked:true 
  },
  { id:4, type:'share', who:'Karabo Kgophane', initials:'KK', sub:'E-comm Lead at Mzansi Cart', time:'1 week ago', action:'shared a video',
    content:"If you missed the webinar on predictive analytics last week, the replay is finally up. Highly recommend watching the section on inventory forecasting.", 
    video:'https://i9.ytimg.com/vi/La3lctj_rIo/maxresdefault.jpg?time=1786441500000&sqp=CJze69MG&rs=AOn4CLBJtomeWpeubxzfm8VQPJMtFO4fNQ',
    likes:47, comments:9, liked:false 
  }
];

const G_DISCUSSIONS = [
  { id:1, title:'Business advise', author:'Sipho N.', date:'26 May 2026 at 1:44pm', members:4, replies:5, last:'2 days, 7 hours ago', pinned:true, locked:false,
    excerpt:"hey can someone help me, i need to start an investment business were i help people to invest in sat-rix divi/SA40 that pays dividends and SA bonds. i already created a basic website for this business using AI — the problem is i don't have knowledge on how to market this business or the right tools to use." },
  { id:2, title:'Best POPIA-compliant payroll tools for under 15 staff?', author:'Tshepho J.', date:'24 May 2026', members:8, replies:11, last:'5 days ago', pinned:false, locked:false,
    excerpt:"Looking for something that won't cost the earth. Must be POPIA-friendly. Gauteng-based recommendations welcome." },
  { id:3, title:'Group rules & introductions — start here', author:'Admin', date:'1 Mar 2023', members:212, replies:48, last:'1 week ago', pinned:true, locked:true,
    excerpt:"Welcome to General! Please introduce yourself and read the community guidelines before posting." }
];

const OTHER_GROUPS = [
  { name:'Fintech Founders', members: 889 },
  { name:'Cape Town SMEs', members: 516 },
  { name:'Funding & Investors', members: 342 }
];

const state = { tab:'feed', filter:'all' };

/* ===== hero ===== */
function renderHero(){
  const g = GROUP;
  const memberBtn = g.joined
    ? `<button onclick="toggleJoin()" class="border border-[#29A37A] text-[#29A37A] rounded-full px-5 py-2.5 font-jakarta font-bold text-sm flex items-center gap-2 hover:bg-[#E4F5EE] transition"><i data-lucide="check" class="w-4 h-4"></i> Member</button>`
    : `<button onclick="toggleJoin()" class="bg-[#DC183C] hover:bg-[#B0142F] text-white rounded-full px-5 py-2.5 font-jakarta font-bold text-sm transition flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Join group</button>`;
  document.getElementById('group-hero').innerHTML = `
    <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden reveal shadow-sm">
      <div class="h-32 sm:h-40 relative bg-gradient-to-br from-[#0C1F31] to-[#1a3a54]">
        <div class="absolute inset-0 opacity-40" style="background:radial-gradient(circle at 70% 30%, #DC183C 0%, transparent 55%);"></div>
        <div class="absolute inset-0 grid place-items-center"><div class="font-jakarta font-extrabold text-white/90 text-2xl sm:text-3xl tracking-tight flex items-center gap-2"><i data-lucide="hexagon" class="w-7 h-7 text-[#FF9900]"></i> SME <span class="font-light">SOUTH AFRICA</span></div></div>
        <button onclick="openBrief('group')" class="dev-badge absolute top-3 left-3 w-5 h-5 rounded-full bg-[#DC183C] text-white items-center justify-center text-[10px] font-bold leading-none animate-pulse">i</button>
      </div>
      <div class="px-5 sm:px-7 pb-6">
        <div class="relative shrink-0 inline-block -mt-12 sm:-mt-14">
          <div class="w-24 h-24 rounded-2xl bg-[#0C1F31] grid place-items-center ring-4 ring-white shadow-lg"><i data-lucide="users" class="w-10 h-10 text-[#FF9900]"></i></div>
        </div>
        <div class="mt-3 flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 flex-wrap">
              <h1 class="font-jakarta font-extrabold text-2xl sm:text-3xl text-[#121A21] tracking-tight">${esc(g.name)}</h1>
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#E4F5EE] text-[#29A37A]"><i data-lucide="globe" class="w-3 h-3"></i> ${esc(g.privacy)}</span>
            </div>
            <p class="text-sm text-slate-500 mt-1 flex items-center gap-1.5"><i data-lucide="users" class="w-4 h-4"></i> ${g.members.toLocaleString()} members <span class="text-slate-300">·</span> active ${esc(g.active)}</p>
            <!-- Mobile-only group description context -->
            <p class="text-[13px] text-slate-600 mt-3 lg:hidden leading-relaxed pr-2">Connect, collaborate and grow with fellow South African entrepreneurs. Share insights, ask questions, and celebrate wins together.</p>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            ${memberBtn}
            <button onclick="toggleSub()" id="sub-btn" class="border border-slate-200 hover:border-[#DC183C] hover:text-[#DC183C] text-slate-600 rounded-full w-11 h-11 grid place-items-center transition" title="Notifications"><i data-lucide="${g.subscribed?'bell-ring':'bell'}" class="w-4 h-4"></i></button>
            <button onclick="showToast('Group options',null)" class="border border-slate-200 hover:border-[#DC183C] hover:text-[#DC183C] text-slate-600 rounded-full w-11 h-11 grid place-items-center transition"><i data-lucide="more-horizontal" class="w-4 h-4"></i></button>
          </div>
        </div>
      </div>
    </div>`;
}
function toggleJoin(){ GROUP.joined=!GROUP.joined; renderHero(); lucide.createIcons(); showToast(GROUP.joined?'You joined General.':'You left the group.', GROUP.joined?'win':null); }
function toggleSub(){ GROUP.subscribed=!GROUP.subscribed; renderHero(); lucide.createIcons(); showToast(GROUP.subscribed?'Subscribed to group updates.':'Unsubscribed.', null); }

/* ===== sub-nav ===== */
const G_TABS = [
  { id:'feed', label:'Feed', icon:'rss' },
  { id:'members', label:'Members', icon:'users' },
  { id:'discussions', label:'Discussions', icon:'messages-square' }
];
function renderSubnav(){
  document.getElementById('group-subnav').innerHTML = G_TABS.map(t=>`
    <button onclick="setTab('${t.id}')" class="gtab ${state.tab===t.id?'active':'text-slate-500 hover:text-[#121A21]'} shrink-0 px-4 py-3.5 text-sm font-bold font-jakarta flex items-center gap-2">
      <i data-lucide="${t.icon}" class="w-4 h-4"></i> ${t.label}
    </button>`).join('');
}
function setTab(id){ state.tab=id; renderSubnav(); renderTab(); lucide.createIcons(); }
function renderTab(){
  const map = { feed:tabFeed, members:tabMembers, discussions:tabDiscussions };
  document.getElementById('group-content').innerHTML = (map[state.tab]||tabFeed)();
  lucide.createIcons();
}
function sectionLabel(t, brief){ const b = brief?`<button onclick="openBrief('${brief}')" class="dev-badge w-4 h-4 rounded-full bg-[#DC183C] text-white items-center justify-center text-[9px] font-bold leading-none animate-pulse ml-1.5">i</button>`:''; return `<h3 class="font-jakarta font-bold uppercase text-sm text-[#121A21] tracking-wide flex items-center">${esc(t)}${b}</h3>`; }

/* ===== FEED ===== */
function tabFeed(){
  const composer = `
    <div class="mb-4 bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
      <div class="flex gap-3">${monogram('TJ',40)}<button onclick="showToast('Composer opens on the Hub.',null)" class="flex-1 text-left bg-slate-100 hover:bg-slate-200/70 rounded-full px-4 text-sm text-slate-500 transition">Post to General…</button></div>
    </div>`;
  const filters = [['all','All'],['ask','Asks'],['win','Wins'],['share','Shares']];
  const tabs = `<div class="flex gap-2 mb-4 overflow-x-auto no-scrollbar">${filters.map(([id,l])=>`<button onclick="setFilter('${id}')" class="shrink-0 px-4 py-2 rounded-full text-xs font-bold uppercase tracking-wider border ${state.filter===id?'bg-[#0C1F31] text-white border-[#0C1F31]':'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'} shadow-sm">${l}</button>`).join('')}</div>`;
  
  let posts = G_POSTS.slice(); if(state.filter!=='all') posts = posts.filter(p=>p.type===state.filter);
  const empty = `<div class="text-center py-10 bg-white rounded-2xl border border-slate-200"><div class="w-14 h-14 mx-auto rounded-full bg-slate-100 grid place-items-center mb-3"><i data-lucide="inbox" class="w-6 h-6 text-slate-400"></i></div><p class="font-jakarta font-bold text-[#121A21]">Be the first to post in General</p><p class="text-sm text-slate-500 max-w-xs mx-auto mt-1">Kick off the conversation — post an Ask, a Win, or a Share.</p><button onclick="showToast('Composer opens on the Hub.','ask')" class="mt-4 bg-[#DC183C] hover:bg-[#B0142F] text-white rounded-full px-5 py-2.5 font-jakarta font-bold text-sm transition inline-flex items-center gap-2"><i data-lucide="help-circle" class="w-4 h-4"></i> Post an Ask</button></div>`;
  const feed = posts.length ? posts.map(p=>postCard(p)).join('') : empty;
  
  return `${composer}<div class="flex items-center justify-between mb-3">${sectionLabel('Group Feed','feed')}</div>${tabs}<div class="space-y-4">${feed}</div>`;
}

function setFilter(f){ state.filter=f; renderTab(); }

function postCard(p){
  const t = TYPES[p.type];
  
  let media = '';
  if(p.image) {
    media = `<div class="mt-4 rounded-xl overflow-hidden border border-slate-100"><img src="${p.image}" class="w-full h-auto max-h-[400px] object-cover" alt="Post attachment"></div>`;
  } else if (p.video) {
    media = `<div class="mt-4 relative rounded-xl overflow-hidden aspect-video bg-[#0C1F31] cursor-pointer group shadow-sm" onclick="showToast('Video player opens')">
      <img src="${p.video}" class="w-full h-full object-cover opacity-85 group-hover:scale-105 transition duration-500">
      <div class="absolute inset-0 m-auto w-12 h-12 rounded-full bg-[#DC183C]/90 text-white grid place-items-center shadow-lg group-hover:scale-110 transition-transform"><i data-lucide="play" class="w-5 h-5 ml-0.5"></i></div>
    </div>`;
  } else if (p.link) {
    media = `<a href="${p.link.url}" class="mt-4 block rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 transition p-4">
      <p class="font-jakarta font-bold text-sm text-[#0C1F31] line-clamp-1">${esc(p.link.title)}</p>
      <p class="text-[11px] text-slate-500 mt-1 uppercase tracking-wider font-semibold flex items-center gap-1"><i data-lucide="link" class="w-3 h-3"></i> ${esc(p.link.domain)}</p>
    </a>`;
  }

  return `<article class="bg-white rounded-2xl border border-slate-200 shadow-sm stripe-${p.type} card-lift">
    <div class="p-5">
      
      <!-- BuddyBoss Style Header -->
      <div class="flex items-start gap-3 mb-4">
        ${monogram(p.initials, 44)}
        <div class="min-w-0 flex-1">
          <p class="text-[14px] text-[#121A21] leading-snug">
            <span class="font-bold">${esc(p.who)}</span> <span class="text-slate-500">${esc(p.action)}</span>
          </p>
          <div class="flex items-center gap-1.5 mt-0.5 text-[12px] text-slate-400 font-medium">
            <span>${esc(p.time)}</span>
            <span>·</span>
            <i data-lucide="users" class="w-3 h-3"></i>
            <span class="ml-1 uppercase tracking-wider text-[9px] font-extrabold ${t.text} bg-slate-50 px-1.5 py-0.5 rounded border border-slate-100">${t.label}</span>
          </div>
        </div>
        <button class="text-slate-400 hover:text-slate-600 p-1 rounded-md hover:bg-slate-50 transition"><i data-lucide="more-horizontal" class="w-5 h-5"></i></button>
      </div>

      <!-- Content -->
      ${p.title ? `<h4 class="font-jakarta font-bold text-[16px] text-[#0C1F31] mb-2 leading-snug">${esc(p.title)}</h4>` : ''}
      <p class="text-[14.5px] text-[#121A21] leading-relaxed whitespace-pre-line">${esc(p.content)}</p>
      ${p.title ? `<button class="text-[#DC183C] font-bold text-sm mt-2 hover:underline">Read more</button>` : ''}
      
      <!-- Media Attachments -->
      ${media}

      <!-- Reactions Summary (BuddyBoss style) -->
      ${p.likes > 0 ? `
      <div class="flex items-center gap-2 mt-4 pt-4 border-t border-slate-100">
        <div class="w-5 h-5 rounded-full bg-[#1877F2] grid place-items-center text-white shrink-0"><i data-lucide="thumbs-up" class="w-3 h-3"></i></div>
        <p class="text-[13px] text-slate-500 truncate">Sipho M., Naledi M. and ${p.likes > 2 ? p.likes - 2 : p.likes} others</p>
      </div>` : ''}

    </div>
    
    <!-- Action Bar -->
    <div class="px-2 py-1 border-t border-slate-100 flex">
      <button onclick="like(${p.id})" class="flex-1 flex items-center justify-center gap-2 py-3 rounded-lg hover:bg-slate-50 ${p.liked?'text-[#1877F2]':'text-slate-500'} text-[13.5px] font-bold transition"><i data-lucide="thumbs-up" class="w-4 h-4 ${p.liked?'fill-current':''}"></i><span>Like</span></button>
      <button class="flex-1 flex items-center justify-center gap-2 py-3 rounded-lg hover:bg-slate-50 text-slate-500 text-[13.5px] font-bold transition"><i data-lucide="message-square" class="w-4 h-4"></i><span>Comment</span></button>
      <button class="flex-1 flex items-center justify-center gap-2 py-3 rounded-lg hover:bg-slate-50 text-slate-500 text-[13.5px] font-bold transition"><i data-lucide="share-2" class="w-4 h-4"></i><span>Share</span></button>
    </div>
  </article>`;
}
function like(id){ const p=G_POSTS.find(x=>x.id===id); if(!p) return; p.liked=!p.liked; p.likes+=p.liked?1:-1; renderTab(); }

/* ===== MEMBERS ===== */
function tabMembers(){
  const roleBadge = r => r==='Organizer' ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#FDECEF] text-[#DC183C]">Organizer</span>` : r==='Moderator' ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#FFF1E0] text-[#AE6B0A]">Moderator</span>` : `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-500">Member</span>`;
  const rows = G_MEMBERS.map(m=>`
    <div class="flex items-center gap-3 py-3">
      ${monogram(m.initials,44)}
      <div class="min-w-0 flex-1"><div class="flex items-center gap-2"><p class="font-jakarta font-bold text-sm text-[#121A21]">${esc(m.name)}</p>${roleBadge(m.gRole)}</div><p class="text-xs text-slate-500 truncate">${esc(m.role)} at ${esc(m.company)} <span class="text-slate-300">·</span> ${esc(m.province)}</p></div>
      ${m.name==='Tshepho Joel'?'<span class="text-xs text-slate-400 font-semibold">You</span>':`<button onclick="showToast('Connection request sent to ${esc(m.name.split(' ')[0])}.','win')" class="border border-slate-200 hover:border-[#DC183C] hover:text-[#DC183C] text-slate-600 rounded-full px-4 py-1.5 text-xs font-bold transition">Connect</button>`}
    </div>`).join('');
  return `<div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
      <div class="flex items-center justify-between mb-1">${sectionLabel('Members','members')}<span class="text-xs font-bold text-slate-400">${GROUP.members.toLocaleString()} total</span></div>
      <div class="divide-y divide-slate-100">${rows}</div>
      <button onclick="showToast('Loading more members…',null)" class="w-full mt-4 py-2.5 rounded-full border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm font-bold transition">Show all members</button>
    </div>`;
}

/* ===== DISCUSSIONS ===== */
function tabDiscussions(){
  const rows = G_DISCUSSIONS.map(d=>`
    <button onclick="openDiscussion(${d.id})" class="w-full text-left border border-slate-100 rounded-2xl p-4 hover:shadow-md transition block bg-white">
      <div class="flex items-start justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">${d.pinned?'<i data-lucide="pin" class="w-3.5 h-3.5 text-[#AE6B0A] shrink-0"></i>':''}${d.locked?'<i data-lucide="lock" class="w-3.5 h-3.5 text-slate-400 shrink-0"></i>':''}<p class="font-jakarta font-bold text-[#121A21] truncate">${esc(d.title)}</p></div>
        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 shrink-0"></i>
      </div>
      <p class="text-sm text-slate-500 mt-1 leading-snug line-clamp-2">${esc(d.excerpt)}</p>
      <div class="flex items-center gap-3 mt-2 text-[11px] text-slate-400 flex-wrap">
        <span>by ${esc(d.author)}</span><span class="inline-flex items-center gap-1"><i data-lucide="users" class="w-3.5 h-3.5"></i> ${d.members}</span><span class="inline-flex items-center gap-1"><i data-lucide="message-circle" class="w-3.5 h-3.5"></i> ${d.replies} replies</span><span class="inline-flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> ${esc(d.last)}</span>
      </div>
    </button>`).join('');
  return `<div class="flex items-center justify-between mb-3">${sectionLabel('Discussions','discussions')}<button onclick="showToast('New discussion composer (mockup).',null)" class="bg-[#DC183C] hover:bg-[#B0142F] text-white rounded-full px-4 py-1.5 text-xs font-bold flex items-center gap-1.5 transition shadow-sm"><i data-lucide="plus" class="w-3.5 h-3.5"></i> New</button></div><div class="space-y-3">${rows}</div>`;
}
function openDiscussion(id){
  const d = G_DISCUSSIONS.find(x=>x.id===id); if(!d) return;
  const replies = [
    { who:'Naledi Mokoena', initials:'NM', time:'2 days ago', text:"Start with a clear niche. Don't try to serve everyone — pick the investor type you understand best and speak to them directly." },
    { who:'Karabo Kgophane', initials:'KK', time:'2 days ago', text:"For marketing on a budget: build an email list from day one and post your reasoning publicly. Trust sells financial products." }
  ];
  document.getElementById('group-content').innerHTML = `
    <button onclick="setTab('discussions')" class="text-sm font-semibold text-slate-500 hover:text-[#DC183C] flex items-center gap-1.5 mb-4"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back to discussions</button>
    <div class="border border-slate-200 rounded-2xl p-5 bg-white shadow-sm">
      <div class="flex items-start justify-between gap-2">
        <div class="flex items-center gap-2">${d.pinned?'<i data-lucide="pin" class="w-4 h-4 text-[#AE6B0A]"></i>':''}${d.locked?'<i data-lucide="lock" class="w-4 h-4 text-slate-400"></i>':''}<h2 class="font-jakarta font-extrabold text-xl text-[#121A21]">${esc(d.title)}</h2></div>
        <button class="text-slate-300 hover:text-slate-600"><i data-lucide="more-horizontal" class="w-5 h-5"></i></button>
      </div>
      <div class="flex items-center gap-3 mt-3 mb-4">${monogram('SN',40)}<div><p class="font-bold text-sm text-[#121A21]">${esc(d.author)}</p><p class="text-xs text-slate-400">Posted ${esc(d.date)}</p></div></div>
      <p class="text-[15px] text-[#121A21] leading-relaxed whitespace-pre-line">${esc(d.excerpt)}</p>
      <div class="flex gap-2 mt-4">
        <button onclick="showToast('Reply box (mockup).',null)" class="bg-[#DC183C] hover:bg-[#B0142F] text-white rounded-full px-5 py-2 font-jakarta font-bold text-sm transition flex items-center gap-1.5"><i data-lucide="reply" class="w-4 h-4"></i> Reply</button>
        <button onclick="showToast('Subscribed to this discussion.',null)" class="border border-slate-200 hover:border-[#DC183C] hover:text-[#DC183C] text-slate-600 rounded-full px-5 py-2 font-jakarta font-semibold text-sm transition flex items-center gap-1.5"><i data-lucide="bell" class="w-4 h-4"></i> Subscribe</button>
        <button onclick="showToast('Added to favourites.',null)" class="border border-slate-200 hover:border-[#DC183C] hover:text-[#DC183C] text-slate-600 rounded-full px-5 py-2 font-jakarta font-semibold text-sm transition flex items-center gap-1.5"><i data-lucide="star" class="w-4 h-4"></i> Favorite</button>
      </div>
    </div>
    <h4 class="font-jakarta font-bold uppercase text-sm text-[#121A21] tracking-wide mt-6 mb-3">${replies.length} replies</h4>
    <div class="space-y-3">${replies.map(r=>`
      <div class="border border-slate-200 rounded-2xl p-4 bg-white shadow-sm">
        <div class="flex items-center gap-3 mb-2">${monogram(r.initials,36)}<div><p class="font-bold text-sm text-[#121A21]">${esc(r.who)}</p><p class="text-[11px] text-slate-400">${esc(r.time)}</p></div></div>
        <p class="text-sm text-[#121A21] leading-relaxed">${esc(r.text)}</p>
      </div>`).join('')}</div>
    <div class="mt-4 flex gap-3"><div class="shrink-0">${monogram('TJ',36)}</div><div class="flex-1"><input onkeydown="if(event.key==='Enter'){showToast('Reply posted.','win');this.value='';}" placeholder="Write a reply…" class="w-full bg-white border border-slate-200 rounded-full px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-[#DC183C]/30 transition shadow-sm"></div></div>`;
  lucide.createIcons();
}

/* ===== aside ===== */
function renderAside(){
  document.getElementById('other-groups').innerHTML = OTHER_GROUPS.map(g=>`
    <a href="single-group.html" class="flex items-center gap-3 px-5 py-3 hover:bg-slate-50 transition border-b border-slate-50 last:border-0">
      <div class="w-9 h-9 rounded-lg bg-[#0C1F31] grid place-items-center shrink-0"><i data-lucide="users" class="w-4 h-4 text-[#FF9900]"></i></div>
      <div class="min-w-0"><p class="font-jakarta font-bold text-sm text-[#121A21] truncate">${esc(g.name)}</p><p class="text-[11px] text-slate-400">${g.members.toLocaleString()} members</p></div>
    </a>`).join('');
}

/* ===== dev mode ===== */
const BRIEFS = {
  group:{ title:'Single Group', sub:'BuddyBoss group container', purpose:'The group home — hero with join/subscribe, tabbed content (Feed, Members, Discussions). BuddyBoss feed layout implemented for posts.', data:'<code>group { id, name, privacy, member_count, created_at, my_role }</code> · posts, members, forum topics scoped to the group.', logic:'Join → POST membership (auto for Public, request for Private). Subscribe toggles digest for this group.', components:'Group hero · tab bar · feed/members/discussions panels · right rail.', specs:'<b>Layout:</b> main <code>max-w-6xl</code> = 1152px, padding-x 16px / 24px, padding-y 32px (<code>py-8</code>). Content grid 24px top margin, 12-col at lg, 24px gap (<code>gap-6</code>) &mdash; content <code>lg:col-span-8</code>, rail <code>lg:col-span-4</code> (20px spacing).<br/><b>Hero card:</b> white rounded 16px (<code>rounded-2xl</code>) 1px border slate-100. Cover banner height 128px mobile / 160px (<code>h-32 sm:h-40</code>), gradient <code>#0C1F31&rarr;#1a3a54</code> + radial <code>#DC183C</code> 40% overlay. Icon tile 96&times;96 (<code>w-24 h-24</code>) rounded 16px bg <code>#0C1F31</code>, 4px white ring, Lucide `users` 40&times;40 <code>#FF9900</code>, pulled up 48px mobile / 56px.<br/><b>Group H1:</b> Plus Jakarta Sans weight 800 &mdash; 24px mobile / 30px (<code>text-2xl sm:text-3xl</code>) <code>#121A21</code>.<br/><b>Privacy pill:</b> padding 8px/2px rounded-full 10px weight 700 bg <code>#E4F5EE</code> text <code>#29A37A</code>, Lucide `globe` 12&times;12. Meta 14px slate-500.<br/><b>Join button:</b> bg <code>#DC183C</code> hover <code>#B0142F</code> rounded-full padding 20px/10px Plus Jakarta weight 700 14px. Joined state: 1px border <code>#29A37A</code> text <code>#29A37A</code> hover bg <code>#E4F5EE</code>. Bell / more buttons 44&times;44 (<code>w-11 h-11</code>) rounded-full 1px border slate-200.<br/><b>Tab bar:</b> tabs padding 16px/14px (<code>px-4 py-3.5</code>) Plus Jakarta weight 700 14px; active <code>#DC183C</code> with 3px bottom rule <code>#DC183C</code>, inactive slate-500.<br/><b>Content shell:</b> white rounded 16px 1px border slate-100; body padding 16px mobile / 20px (<code>p-4 sm:p-5</code>) over a soft slate-50 background.<br/><b>Rail cards:</b> white rounded 16px 1px border slate-100 padding 20px; heading Plus Jakarta weight 700 uppercase 14px <code>#121A21</code>.' },
  feed:{ title:'Group Feed', sub:'Posts scoped to the group', purpose:'BuddyBoss activity stream. Rich media cards (Text, Link, Image, Video) with BuddyBoss reaction summary layouts.', data:'Posts where <code>group_id = {id}</code>, type ∈ {ask, win, share}.', logic:'Composer posts into the group context. Filter tabs scope by type. Honours group privacy.', components:'Composer · filter tabs · rich post cards.', specs:'<b>Section label:</b> Plus Jakarta Sans weight 700 uppercase 14px (<code>text-sm</code>) <code>#121A21</code>.<br/><b>Composer:</b> white card 1px border slate-200 rounded 16px (<code>rounded-2xl</code>) padding 16px; avatar 40px rounded-full gradient; prompt pill bg slate-100 rounded-full padding-x 16px 14px slate-500. Action row items uppercase 12px weight 700 slate-500 hover bg slate-50.<br/><b>Post card:</b> white rounded 16px 1px border slate-200, card-lift hover shadow. Padding 20px. Avatar 44px. Author/Action line 14px <code>#121A21</code>. Meta line 12px slate-400 + group icon + taxonomy badge. Body 14.5px <code>#121A21</code> leading-relaxed. Reactions summary 13px slate-500 with FB-blue icon. Action bar 13.5px weight 700 slate-500 buttons.' }
};
function toggleDevMode(){ const on=document.body.classList.toggle('dev-on'); const b=document.getElementById('devToggle'); if(b) b.classList.toggle('on',on); if(on) showToast('Dev Mode on — tap any ⓘ for implementation notes.', null); lucide.createIcons(); }
function closeOverlay(id){ const el=document.getElementById(id); if(!el) return; el.classList.remove('open'); setTimeout(()=>{ if(el&&el.parentNode) el.remove(); },300); }
function openBrief(id){
  const b = BRIEFS[id]; if(!b) return;
  const sec = (icon,label,html)=>`<div class="px-6 py-4 border-t border-slate-100"><p class="text-[10px] font-bold uppercase tracking-widest text-[#DC183C] flex items-center gap-1.5 mb-2"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${label}</p><div class="text-sm text-slate-600 leading-relaxed">${html}</div></div>`;
  document.getElementById('overlay-root').innerHTML = `
    <div class="ov" id="ov-brief"><div class="ov-bg" onclick="closeOverlay('ov-brief')"></div>
      <div class="drawer">
        <div class="sticky top-0 z-10 bg-[#0C1F31] text-white px-6 py-5 flex items-start justify-between"><div class="min-w-0"><p class="text-[10px] font-bold uppercase tracking-widest text-[#FF9900] mb-1">Dev Brief</p><h3 class="font-jakarta font-extrabold text-lg leading-tight">${b.title}</h3><p class="text-xs text-white/60 mt-1">${b.sub}</p></div><button onclick="closeOverlay('ov-brief')" class="text-white/60 hover:text-white shrink-0 ml-3"><i data-lucide="x" class="w-5 h-5"></i></button></div>
        ${sec('target','Purpose',b.purpose)}${sec('database','Data model',b.data)}${sec('git-branch','Logic',b.logic)}${b.specs ? sec('ruler','Spec values', b.specs) : ''}${sec('boxes','Components',b.components)}
      </div></div>`;
  requestAnimationFrame(()=>{ const o=document.getElementById('ov-brief'); if(o) o.classList.add('open'); });
  lucide.createIcons();
}

/* ===== toast ===== */
function showToast(msg, kind){
  const el=document.getElementById('toast'); const t=TYPES[kind]; const color=t?t.color:'#0C1F31';
  el.classList.remove('hidden');
  el.innerHTML = `<div class="toast-in bg-[#0C1F31] text-white rounded-full pl-3 pr-5 py-2.5 shadow-2xl flex items-center gap-2 text-sm font-semibold" style="border-left:4px solid ${color}"><i data-lucide="check-circle" class="w-4 h-4" style="color:${color}"></i><span>${esc(msg)}</span></div>`;
  lucide.createIcons();
  setTimeout(()=>{ const i=el.firstElementChild; if(i){ i.classList.remove('toast-in'); i.classList.add('toast-out'); } setTimeout(()=>{ el.classList.add('hidden'); el.innerHTML=''; },250); },2400);
}

/* ===== init ===== */
document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.querySelectorAll('.ov.open').forEach(o=>closeOverlay(o.id)); });
renderHero(); renderSubnav(); renderTab(); renderAside(); lucide.createIcons();
</script>
</body>
